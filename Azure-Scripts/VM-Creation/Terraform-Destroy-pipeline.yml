trigger:
- none  # Manual trigger only

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: "destroy"
    values:
      - destroy
  - name: project
    displayName: "Project Name"
    type: string
    default: "default-project"
  - name: destroySpecificTargets
    displayName: "Destroy Specific Targets (Yes/No)"
    type: string
    default: "No"
    values:
      - Yes
      - No
  - name: destroyTargets
    displayName: "Specify Resources to Destroy"
    type: string
    default: ""  # Leave empty by default, making it optional

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/VM-Creation/"
  - group: TerraformVariables
  - name: pythonVersion
    value: "3.9"

steps:
# Step 1: Set Environment Variables
- script: |
    echo "Setting environment variables..."
    if [[ ! ${{ parameters.project }} =~ ^[a-zA-Z0-9-]+$ ]]; then
        echo "Error: Invalid project name. Use only letters, numbers, and hyphens."
        exit 1
    fi
    export PROJECT_NAME="${{ parameters.project }}"
    echo "##vso[task.setvariable variable=PROJECT_NAME]$PROJECT_NAME"
    export STORAGE_CONTAINER_NAME="${PROJECT_NAME}-tfstate"
    echo "##vso[task.setvariable variable=STORAGE_CONTAINER_NAME]$STORAGE_CONTAINER_NAME"
    echo "Using Project: $PROJECT_NAME"
    echo "Using Storage Container: $STORAGE_CONTAINER_NAME"
  displayName: "Set Environment Variables"

# Step 2: Azure Login
- script: |
    echo "Logging into Azure..."
    az login --service-principal \
        -u $(ARM_CLIENT_ID) \
        -p $(ARM_CLIENT_SECRET) \
        --tenant $(ARM_TENANT_ID) || { echo "Azure login failed! Exiting."; exit 1; }
    echo "Azure login successful."
  displayName: "Azure Login"
# Step 3: Download Terraform State Files for Destroy
- task: Bash@3
  displayName: "Download Terraform State Files for Destroy"
  condition: eq('${{ parameters.action }}', 'destroy')
  inputs:
    targetType: 'inline'
    script: |
      set -x
      echo "Executing parallel file upload/download preparation."
      # Use & to run processes in the background
      (
          echo "Downloading state files..."
          az storage blob download-batch \
            --account-name $(storageAccountName) \
            --destination $(tfWorkingDirectory) \
            --source $(STORAGE_CONTAINER_NAME) \
            --pattern "*.tfstate*" \
            --account-key $(storageAccountKey) || { echo "Error downloading state files."; exit 1; }
      ) &
      wait  # Wait for all background jobs to finish
      echo "File preparation completed."

# Step 4: Validate Destroy Targets (Only if Destroy Specific Targets is Yes)
- script: |
    echo "Validating destroy targets..."
    if [ "${{ parameters.destroySpecificTargets }}" == "Yes" ]; then
        if [ -z "${{ parameters.destroyTargets }}" ]; then
            echo "Error: 'destroyTargets' must be specified when 'Destroy Specific Targets' is set to Yes."
            exit 1
        fi
        echo "Destroy targets provided: ${{ parameters.destroyTargets }}"
    else
        echo "Destroying all resources. No specific targets specified."
    fi
  displayName: "Validate Destroy Targets"
  condition: eq('${{ parameters.destroySpecificTargets }}', 'Yes')

# Step 5: Terraform Destroy Logic
- script: |
    echo "Executing Terraform destroy..."
    cd $(tfWorkingDirectory)
    terraform init || { echo "Terraform initialization failed! Exiting."; exit 1; }
    if [ "${{ parameters.destroySpecificTargets }}" == "Yes" ]; then
        echo "Destroying specific resources: ${{ parameters.destroyTargets }}"
        terraform destroy -auto-approve $(echo ${{ parameters.destroyTargets }} | tr ',' '\n' | sed 's/^/-target=/') || { echo "Terraform destroy failed! Exiting."; exit 1; }
    else
        echo "Destroying all resources..."
        terraform destroy -auto-approve || { echo "Terraform destroy failed! Exiting."; exit 1; }
    fi
    echo "Terraform destroy completed successfully."
  displayName: "Terraform Destroy Logic"

# Step 6: Upload Terraform State Files after Destroy
- task: Bash@3
  displayName: "Upload Terraform State Files after Destroy"
  condition: and(succeeded(), eq('${{ parameters.action }}', 'destroy'))
  inputs:
    targetType: 'inline'
    script: |
      echo "Uploading files in parallel..."
      parallel_upload() {
          az storage blob upload-batch \
            --account-name $(storageAccountName) \
            --destination $(STORAGE_CONTAINER_NAME) \
            --source $(tfWorkingDirectory) \
            --pattern "$1" \
            --account-key $(storageAccountKey) \
            --overwrite true || echo "Error uploading $1 files."
      }
      parallel_upload "*.tfstate*" &
      parallel_upload "*.lock.*" &
      wait
      echo "All files uploaded successfully."