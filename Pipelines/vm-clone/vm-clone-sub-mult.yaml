# ------------------- VM Cloning Pipeline from CSV -------------------

variables:
- group: AZ-Resources
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: targetSubscriptionName
    displayName: 'Target Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_SIT'
  - name: resourceGroupName
    displayName: 'Source Resource Group'
    type: string
    default: 'my-source-rg'
  - name: targetResourceGroupName
    displayName: 'Target Resource Group'
    type: string
    default: 'my-target-rg'
  - name: osType
    displayName: 'OS Type (linux or windows)'
    type: string
    default: 'linux'
    values:
      - linux
      - windows
  - name: dryRun
    displayName: 'Dry Run (no changes, just log actions)'
    type: boolean
    default: false

trigger: none

pool:
  name: cloudops-agent

steps:
# ------------------- Azure CLI Login -------------------
- task: PowerShell@2
  displayName: 'Azure CLI Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "" | Out-File -FilePath $LogFile -Encoding utf8

      # Source Subscription
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid source subscription"; exit 1 }
      }

      # Target Subscription
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid target subscription"; exit 1 }
      }

      az login --service-principal `
          -u $env:AZURE_CLIENT_ID `
          -p $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID | Tee-Object -FilePath $LogFile -Append
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure CLI login failed"
          exit 1
      }
      az account set --subscription $srcSub | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] Azure CLI login successful. Source subscription: $srcSub, Target subscription: $tgtSub" | Tee-Object -FilePath $LogFile -Append
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

# ------------------- Clone VMs from CSV -------------------
- task: PowerShell@2
  displayName: 'Clone VMs Sequentially with Summary'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $ErrorActionPreference = "Continue"
      $global:ErrorCount = 0

      function Log-Error {
        param($msg)
        Write-Error $msg
        $global:ErrorCount++
      }

      if (-not (Test-Path "C:\vm-to-clone")) { New-Item -Path "C:\vm-to-clone" -ItemType Directory | Out-Null }
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      $LogFile = "C:\log\clone_log.txt"
      $vmInputCsv = "C:\vm-to-clone\vm-to-clone.csv"

      if (Test-Path $vmInputCsv) {
          Write-Host "Importing VM definitions from CSV: $vmInputCsv"
          $vmList = Import-Csv -Path $vmInputCsv | Select-Object SourceVMName,NewVMName,SubnetName,VMSize
      } else {
          Log-Error "CSV file with VM definitions not found at $vmInputCsv. Please provide the file."
          exit 0
      }

      # Target environment variables
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' {
              $vnetName = '$(DEV_VNETName)'; $vnetRg = '$(DEV_VNETRG)'
              $nsgName = '$(DEV_NSGName)'; $nsgRg = '$(DEV_NSGRG)'
              $bootDiagStorage = '$(DEV_BootDiagStorage)'
          }
          'BAB_SIT' {
              $vnetName = '$(SIT_VNETName)'; $vnetRg = '$(SIT_VNETRG)'
              $nsgName = '$(SIT_NSGName)'; $nsgRg = '$(SIT_NSGRG)'
              $bootDiagStorage = '$(SIT_BootDiagStorage)'
          }
          'BAB_CORE' {
              $vnetName = '$(CORE_VNETName)'; $vnetRg = '$(CORE_VNETRG)'
              $nsgName = '$(CORE_NSGName)'; $nsgRg = '$(CORE_NSGRG)'
              $bootDiagStorage = '$(CORE_BootDiagStorage)'
          }
          default { Log-Error "Invalid target subscription"; exit 0 }
      }

      # Source/target subscription IDs
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
      }
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
      }

      foreach ($PSItem in $vmList) {
          $osTypeParam = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query storageProfile.osDisk.osType -o tsv
          "Detected OS type: $osTypeParam" | Tee-Object -FilePath $LogFile -Append

          $nicId = $null
          try {
              "[$(Get-Date -Format o)] Starting clone: $($PSItem.SourceVMName) -> $($PSItem.NewVMName)" | Tee-Object -FilePath $LogFile -Append

              # ------------------- OS/Data Disk logic -------------------
              az account set --subscription $srcSub
              $osDiskId = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.osDisk.managedDisk.id" -o tsv
              $dataDiskIds = @(az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.dataDisks[].managedDisk.id" -o tsv)

              az account set --subscription $tgtSub
              $location = az group show -n '${{ parameters.targetResourceGroupName }}' --query location -o tsv

              # OS snapshot & disk creation
              $osSnap = "$($PSItem.NewVMName)-os-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
              $osSnapId = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $osSnap --source $osDiskId --location $location --sku Standard_LRS --query id -o tsv
              $osDiskName = "$($PSItem.NewVMName)-osdisk"
              $osDiskIdNew = az disk create -g '${{ parameters.targetResourceGroupName }}' -n $osDiskName --source $osSnapId --location $location --query id -o tsv

              # Data disks
              $newDataDisksFinal = @(); $lun=0
              if ($dataDiskIds -and $dataDiskIds[0] -ne "") {
                  foreach ($dd in $dataDiskIds) {
                      $snapName = "$($PSItem.NewVMName)-data$lun-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                      $dataSnapId = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $snapName --source $dd --location $location --sku Standard_LRS --query id -o tsv
                      $dataDiskName = "$($PSItem.NewVMName)-data$lun-disk"
                      $dataDiskIdNew = az disk create -g '${{ parameters.targetResourceGroupName }}' -n $dataDiskName --source $dataSnapId --location $location --query id -o tsv
                      $newDataDisksFinal += [PSCustomObject]@{Id=$dataDiskIdNew; Lun=$lun}
                      $lun++
                  }
              }

              # ------------------- NIC with cleanup -------------------
              try {
                  $nicName = "$($PSItem.NewVMName)-nic"
                  $subnetId = az network vnet subnet show -g $vnetRg --vnet-name $vnetName -n $($PSItem.SubnetName) --query id -o tsv
                  $nsgId = az network nsg show -g $nsgRg -n $nsgName --query id -o tsv
                  if (-not $subnetId -or -not $nsgId) { Log-Error "Subnet or NSG ID missing for $($PSItem.NewVMName)"; continue }
                  $nicId = az network nic create -g '${{ parameters.targetResourceGroupName }}' -n $nicName --subnet $subnetId --network-security-group $nsgId --query 'NewNIC.id' -o tsv
                  if (-not $nicId) { Log-Error "NIC creation failed for $($PSItem.NewVMName)"; continue }
                  $nicId = $nicId.Trim()
                  $privateIp = az network nic show --ids $nicId --query "ipConfigurations[0].privateIpAddress" -o tsv
              } catch {
                  if ($nicId) { az network nic delete --ids $nicId }
                  Log-Error "NIC creation error for $($PSItem.NewVMName): $_"
                  continue
              }

              # ------------------- VM Creation -------------------
              try {
                  $vmCreateCmd = "az vm create -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName) --nics $nicId --attach-os-disk $osDiskIdNew --os-type $osTypeParam --size $($PSItem.VMSize) --boot-diagnostics-storage https://$bootDiagStorage.blob.core.windows.net/"
                  Invoke-Expression $vmCreateCmd

                  # Only deallocate if there are data disks to attach
                  if ($newDataDisksFinal.Count -gt 0) {
                      az vm deallocate -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName) --no-wait
                      az vm wait -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName) --custom "instanceView.statuses[?code=='PowerState/deallocated']"
                  }
              } catch {
                  if ($nicId) { az network nic delete --ids $nicId }
                  Log-Error "VM creation error for $($PSItem.NewVMName): $_"
                  continue
              }

              # Attach data disks
              foreach ($disk in $newDataDisksFinal) {
                  try {
                      az vm disk attach -g '${{ parameters.targetResourceGroupName }}' --vm-name $($PSItem.NewVMName) --name $($disk.Id) --lun $($disk.Lun)
                  } catch {
                      Log-Error "Failed to attach disk $($disk.Id) to $($PSItem.NewVMName): $_"
                  }
              }

              # Delete OS snapshot after VM and disks are created
              if ($osSnapId) {
                  az snapshot delete --ids $osSnapId
              }

              # Delete data disk snapshots after VM and disks are created
              $snapNamePattern = "$($PSItem.NewVMName)-data"
              $dataSnapIdsRaw = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name, '$snapNamePattern')].id" -o tsv
              if ($dataSnapIdsRaw -and $dataSnapIdsRaw.Trim() -ne "") {
                  $dataSnapIds = $dataSnapIdsRaw -split "`r?`n"
                  foreach ($snapId in $dataSnapIds) {
                      if ($snapId -and $snapId.Trim() -ne "") {
                          az snapshot delete --ids $snapId
                      }
                  }
              }

              # Start the VM after all disks are attached and snapshots are deleted
              try {
                  az vm start -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName)
              } catch {
                  Log-Error "Failed to start VM $($PSItem.NewVMName): $_"
              }
          } catch {
              Log-Error "❌ Failed cloning $($PSItem.SourceVMName): $_"
              continue
          }
      }

      if ($global:ErrorCount -gt 0) {
        Write-Warning "$global:ErrorCount errors occurred during VM cloning. See log for details."
        exit 1   # <-- This will fail the step and stop the pipeline
      } else {
        Write-Host "All VM cloning tasks completed successfully."
      }