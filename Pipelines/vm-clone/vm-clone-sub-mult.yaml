# ------------------- VM Cloning Pipeline from CSV -------------------

variables:
- group: AZ-Resources
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: targetSubscriptionName
    displayName: 'Target Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_SIT'
  - name: resourceGroupName
    displayName: 'Source Resource Group'
    type: string
    default: 'my-source-rg'
  - name: targetResourceGroupName
    displayName: 'Target Resource Group'
    type: string
    default: 'my-target-rg'

trigger: none

pool:
  name: cloudops-agent

steps:
# ------------------- Azure PowerShell Login -------------------
- task: PowerShell@2
  displayName: 'Azure PowerShell Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "" | Out-File -FilePath $LogFile -Encoding utf8

      $securePassword = ConvertTo-SecureString $env:AZURE_CLIENT_SECRET -AsPlainText -Force
      $pscredential = New-Object System.Management.Automation.PSCredential ($env:AZURE_CLIENT_ID, $securePassword)
      Connect-AzAccount -ServicePrincipal -Credential $pscredential -Tenant $env:AZURE_TENANT_ID | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] Azure PowerShell login successful." | Tee-Object -FilePath $LogFile -Append
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

# ------------------- Clone VMs from CSV (Az PowerShell) -------------------
- task: PowerShell@2
  displayName: 'Clone VMs in Parallel with Summary (Az PowerShell)'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      Import-Module Az.Accounts
      Import-Module Az.Compute
      Import-Module Az.Network
      Import-Module Az.Resources

      $LogFile = "C:\log\clone_log.txt"
      $CsvFile = "C:\vm-to-clone\vm_clone_summary.csv"
      $vmInputCsv = "C:\vm-to-clone\vm-to-clone.csv"
      "" | Out-File -FilePath $CsvFile -Encoding UTF8

      # Reference pipeline variables from environment
      $srcSub = $env:SRC_SUBSCRIPTION_ID
      $tgtSub = $env:TGT_SUBSCRIPTION_ID
      $resourceGroupName = $env:SOURCE_RG
      $targetResourceGroupName = $env:TARGET_RG
      $vnetName = $env:VNET_NAME
      $vnetRg = $env:VNET_RG
      $nsgName = $env:NSG_NAME
      $nsgRg = $env:NSG_RG
      $bootDiagStorage = $env:BOOTDIAG_STORAGE

      if (-not (Test-Path "C:\vm-to-clone")) { New-Item -Path "C:\vm-to-clone" -ItemType Directory | Out-Null }
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }

      if (Test-Path $vmInputCsv) {
          Write-Host "Importing VM definitions from CSV: $vmInputCsv"
          $vmList = Import-Csv -Path $vmInputCsv | Select-Object SourceVMName,NewVMName,SubnetName,VMSize
      } else {
          throw "CSV file with VM definitions not found at $vmInputCsv. Please provide the file."
      }

      $ThrottleLimit = 4

      $vmList | ForEach-Object -Parallel {
          param($using:srcSub, $using:tgtSub, $using:vnetName, $using:vnetRg, $using:nsgName, $using:nsgRg, $using:bootDiagStorage, $using:LogFile, $using:CsvFile, $using:resourceGroupName, $using:targetResourceGroupName)
          try {
              "[$(Get-Date -Format o)] Starting clone: $($PSItem.SourceVMName) -> $($PSItem.NewVMName)" | Tee-Object -FilePath $using:LogFile -Append

              # Set source subscription
              Set-AzContext -SubscriptionId $using:srcSub | Out-Null

              # Get source VM
              $srcVM = Get-AzVM -ResourceGroupName $using:resourceGroupName -Name $PSItem.SourceVMName
              $osDisk = Get-AzDisk -ResourceGroupName $using:resourceGroupName -DiskName $srcVM.StorageProfile.OsDisk.Name
              $osType = $osDisk.OsType
              $dataDisks = @()
              if ($srcVM.StorageProfile.DataDisks) {
                  foreach ($dd in $srcVM.StorageProfile.DataDisks) {
                      $dataDisks += Get-AzDisk -ResourceGroupName $using:resourceGroupName -DiskName $dd.Name
                  }
              }

              # Set target subscription
              Set-AzContext -SubscriptionId $using:tgtSub | Out-Null

              $location = (Get-AzResourceGroup -Name $using:targetResourceGroupName).Location

              # Create OS disk snapshot and disk
              $osSnapName = "$($PSItem.NewVMName)-os-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
              $osSnap = New-AzSnapshot -ResourceGroupName $using:targetResourceGroupName -SnapshotName $osSnapName -SourceUri $osDisk.Id -Location $location -SkuName Standard_LRS
              $osDiskName = "$($PSItem.NewVMName)-osdisk"
              $osDiskNew = New-AzDisk -ResourceGroupName $using:targetResourceGroupName -DiskName $osDiskName -Disk (New-AzDiskConfig -Location $location -CreateOption Copy -SourceResourceId $osSnap.Id -SkuName Standard_LRS)

              # Create data disk snapshots and disks
              $newDataDisksFinal = @()
              $lun = 0
              foreach ($dd in $dataDisks) {
                  $dataSnapName = "$($PSItem.NewVMName)-data$lun-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                  $dataSnap = New-AzSnapshot -ResourceGroupName $using:targetResourceGroupName -SnapshotName $dataSnapName -SourceUri $dd.Id -Location $location -SkuName Standard_LRS
                  $dataDiskName = "$($PSItem.NewVMName)-data$lun-disk"
                  $dataDiskNew = New-AzDisk -ResourceGroupName $using:targetResourceGroupName -DiskName $dataDiskName -Disk (New-AzDiskConfig -Location $location -CreateOption Copy -SourceResourceId $dataSnap.Id -SkuName Standard_LRS)
                  $newDataDisksFinal += [PSCustomObject]@{Id=$dataDiskNew.Id; Lun=$lun}
                  $lun++
              }

              # NIC creation (dynamic IP)
              $subnet = Get-AzVirtualNetworkSubnetConfig -Name $PSItem.SubnetName -VirtualNetwork (Get-AzVirtualNetwork -Name $using:vnetName -ResourceGroupName $using:vnetRg)
              $nsg = Get-AzNetworkSecurityGroup -Name $using:nsgName -ResourceGroupName $using:nsgRg
              $nicName = "$($PSItem.NewVMName)-nic"
              $nic = New-AzNetworkInterface -Name $nicName -ResourceGroupName $using:targetResourceGroupName -Location $location -SubnetId $subnet.Id -NetworkSecurityGroupId $nsg.Id
              "[$(Get-Date -Format o)] Created NIC for $($PSItem.NewVMName): $($nic.Id)" | Tee-Object -FilePath $using:LogFile -Append

              # VM config
              $vmConfig = New-AzVMConfig -VMName $PSItem.NewVMName -VMSize $PSItem.VMSize | `
                  Set-AzVMOSDisk -ManagedDiskId $osDiskNew.Id -CreateOption Attach -Windows -Caching ReadWrite | `
                  Add-AzVMNetworkInterface -Id $nic.Id

              # Attach data disks
              foreach ($disk in $newDataDisksFinal) {
                  $vmConfig = Add-AzVMDataDisk -VM $vmConfig -Name ("data" + $disk.Lun) -ManagedDiskId $disk.Id -Lun $disk.Lun -CreateOption Attach
              }

              # Create VM
              New-AzVM -ResourceGroupName $using:targetResourceGroupName -Location $location -VM $vmConfig -BootDiagnosticsStorageUri "https://$using:bootDiagStorage.blob.core.windows.net/" | Out-Null

              # Write summary
              foreach ($disk in $newDataDisksFinal) {
                  "$($PSItem.NewVMName),$($PSItem.SourceVMName),$($PSItem.SubnetName),$($PSItem.VMSize),$($nic.IpConfigurations[0].PrivateIpAddress),$($disk.Id),$($disk.Lun)" | Out-File -FilePath $using:CsvFile -Append
              }

              # Cleanup snapshots
              Remove-AzSnapshot -ResourceGroupName $using:targetResourceGroupName -SnapshotName $osSnapName -Force
              $lun = 0
              foreach ($dd in $dataDisks) {
                  $dataSnapName = "$($PSItem.NewVMName)-data$lun-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                  Remove-AzSnapshot -ResourceGroupName $using:targetResourceGroupName -SnapshotName $dataSnapName -Force
                  $lun++
              }

              "[$(Get-Date -Format o)] VM clone completed: $($PSItem.NewVMName)" | Tee-Object -FilePath $using:LogFile -Append
          } catch {
              "[$(Get-Date -Format o)] ❌ Failed cloning $($PSItem.SourceVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
              throw
          }
      } -ThrottleLimit $ThrottleLimit
  env:
    SRC_SUBSCRIPTION_ID: ${{ parameters.subscriptionName == 'BAB_DEV' && variables.BAB_DEV_SUBSCRIPTION_ID || parameters.subscriptionName == 'BAB_SIT' && variables.BAB_SIT_SUBSCRIPTION_ID || variables.BAB_CORE_SUBSCRIPTION_ID }}
    TGT_SUBSCRIPTION_ID: ${{ parameters.targetSubscriptionName == 'BAB_DEV' && variables.BAB_DEV_SUBSCRIPTION_ID || parameters.targetSubscriptionName == 'BAB_SIT' && variables.BAB_SIT_SUBSCRIPTION_ID || variables.BAB_CORE_SUBSCRIPTION_ID }}
    SOURCE_RG: ${{ parameters.resourceGroupName }}
    TARGET_RG: ${{ parameters.targetResourceGroupName }}
    VNET_NAME: ${{ parameters.targetSubscriptionName == 'BAB_DEV' && variables.DEV_VNETName || parameters.targetSubscriptionName == 'BAB_SIT' && variables.SIT_VNETName || variables.CORE_VNETName }}
    VNET_RG: ${{ parameters.targetSubscriptionName == 'BAB_DEV' && variables.DEV_VNETRG || parameters.targetSubscriptionName == 'BAB_SIT' && variables.SIT_VNETRG || variables.CORE_VNETRG }}
    NSG_NAME: ${{ parameters.targetSubscriptionName == 'BAB_DEV' && variables.DEV_NSGName || parameters.targetSubscriptionName == 'BAB_SIT' && variables.SIT_NSGName || variables.CORE_NSGName }}
    NSG_RG: ${{ parameters.targetSubscriptionName == 'BAB_DEV' && variables.DEV_NSGRG || parameters.targetSubscriptionName == 'BAB_SIT' && variables.SIT_NSGRG || variables.CORE_NSGRG }}
    BOOTDIAG_STORAGE: ${{ parameters.targetSubscriptionName == 'BAB_DEV' && variables.DEV_BootDiagStorage || parameters.targetSubscriptionName == 'BAB_SIT' && variables.SIT_BootDiagStorage || variables.CORE_BootDiagStorage }}
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

# ------------------- Final Summary Table (Az PowerShell) -------------------
- task: PowerShell@2
  displayName: 'Generate Final Summary Table (Az PowerShell)'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      $CsvFile = "C:\vm-to-clone\vm_clone_summary.csv"

      "[$(Get-Date -Format o)] 🎉 All VM cloning tasks completed. Generating summary table..." | Tee-Object -FilePath $LogFile -Append

      if (Test-Path $CsvFile) {
          $summary = Import-Csv $CsvFile -Header "NewVM","SourceVM","Subnet","Size","IP","DiskId","LUN"
          $grouped = $summary | Group-Object -Property NewVM
          foreach ($vmGroup in $grouped) {
              $vmName = $vmGroup.Name
              $sourceVM = ($vmGroup.Group | Select-Object -First 1).SourceVM
              $ip = ($vmGroup.Group | Select-Object -First 1).IP
              $subnet = ($vmGroup.Group | Select-Object -First 1).Subnet
              $size = ($vmGroup.Group | Select-Object -First 1).Size
              "-------------------------------------------------------------" | Tee-Object -FilePath $LogFile -Append
              "VM Name: $vmName" | Tee-Object -FilePath $LogFile -Append
              "Source VM: $sourceVM" | Tee-Object -FilePath $LogFile -Append
              "IP: $ip" | Tee-Object -FilePath $LogFile -Append
              "Subnet: $subnet" | Tee-Object -FilePath $LogFile -Append
              "Size: $size" | Tee-Object -FilePath $LogFile -Append
              "Disks and LUNs:" | Tee-Object -FilePath $LogFile -Append
              foreach ($disk in $vmGroup.Group) {
                  "  DiskID: $($disk.DiskId) | LUN: $($disk.LUN)" | Tee-Object -FilePath $LogFile -Append
              }
          }
          "-------------------------------------------------------------" | Tee-Object -FilePath $LogFile -Append
          "Summary CSV: $CsvFile" | Tee-Object -FilePath $LogFile -Append
      } else {
          "No CSV file found. Summary not generated." | Tee-Object -FilePath $LogFile -Append
      }

      "[$(Get-Date -Format o)] ✅ Pipeline completed." | Tee-Object -FilePath $LogFile -Append

# ------------------- Publish Summary as Artifact (PowerShell) -------------------
- task: PowerShell@2
  displayName: 'Publish VM Clone Summary Artifact (PowerShell)'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $CsvFile = "C:\vm-to-clone\vm_clone_summary.csv"
      $ArtifactDir = "C:\artifact"
      if (-not (Test-Path $ArtifactDir)) { New-Item -Path $ArtifactDir -ItemType Directory | Out-Null }
      Copy-Item -Path $CsvFile -Destination $ArtifactDir -Force
      Write-Host "##vso[artifact.upload containerfolder=VMCloneSummary;artifactname=VMCloneSummary]$ArtifactDir"