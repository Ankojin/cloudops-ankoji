# ------------------- VM Cloning Pipeline from CSV -------------------

variables:
- group: AZ-Resources
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: targetSubscriptionName
    displayName: 'Target Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_SIT'
  - name: resourceGroupName
    displayName: 'Source Resource Group'
    type: string
    default: 'my-source-rg'
  - name: targetResourceGroupName
    displayName: 'Target Resource Group'
    type: string
    default: 'my-target-rg'

trigger: none

pool:
  name: cloudops-agent

steps:
# ------------------- Azure CLI Login -------------------
- task: PowerShell@2
  displayName: 'Azure CLI Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "" | Out-File -FilePath $LogFile -Encoding utf8

      # Source Subscription
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid source subscription"; exit 1 }
      }

      # Target Subscription
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid target subscription"; exit 1 }
      }

      az login --service-principal `
          -u $env:AZURE_CLIENT_ID `
          -p $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID | Tee-Object -FilePath $LogFile -Append
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure CLI login failed"
          exit 1
      }
      az account set --subscription $srcSub | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] Azure CLI login successful. Source subscription: $srcSub, Target subscription: $tgtSub" | Tee-Object -FilePath $LogFile -Append
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

# ------------------- Clone VMs from CSV -------------------
- task: PowerShell@2
  displayName: 'Clone VMs in Parallel with Summary'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      if (-not (Test-Path "C:\vm-to-clone")) { New-Item -Path "C:\vm-to-clone" -ItemType Directory | Out-Null }
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      $LogFile = "C:\log\clone_log.txt"
      $CsvFile = "C:\vm-to-clone\vm_clone_summary.csv"
      $vmInputCsv = "C:\vm-to-clone\vm-to-clone.csv"
      "" | Out-File -FilePath $CsvFile -Encoding UTF8

      if (Test-Path $vmInputCsv) {
          Write-Host "Importing VM definitions from CSV: $vmInputCsv"
          $vmList = Import-Csv -Path $vmInputCsv | Select-Object SourceVMName,NewVMName,SubnetName,VMSize
      } else {
          throw "CSV file with VM definitions not found at $vmInputCsv. Please provide the file."
      }

      # Target environment variables
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' {
              $vnetName = '$(DEV_VNETName)'; $vnetRg = '$(DEV_VNETRG)'
              $nsgName = '$(DEV_NSGName)'; $nsgRg = '$(DEV_NSGRG)'
              $bootDiagStorage = '$(DEV_BootDiagStorage)'
          }
          'BAB_SIT' {
              $vnetName = '$(SIT_VNETName)'; $vnetRg = '$(SIT_VNETRG)'
              $nsgName = '$(SIT_NSGName)'; $nsgRg = '$(SIT_NSGRG)'
              $bootDiagStorage = '$(SIT_BootDiagStorage)'
          }
          'BAB_CORE' {
              $vnetName = '$(CORE_VNETName)'; $vnetRg = '$(CORE_VNETRG)'
              $nsgName = '$(CORE_NSGName)'; $nsgRg = '$(CORE_NSGRG)'
              $bootDiagStorage = '$(CORE_BootDiagStorage)'
          }
          default { throw "Invalid target subscription" }
      }

      # Source/target subscription IDs
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
      }
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
      }

      $ThrottleLimit = 4

      $vmList | ForEach-Object -Parallel {
          $nicId = $null
          $nicNameOnly = $null
          try {
              "[$(Get-Date -Format o)] Starting clone: $($PSItem.SourceVMName) -> $($PSItem.NewVMName)" | Tee-Object -FilePath $using:LogFile -Append

              # ------------------- OS/Data Disk logic -------------------
              az account set --subscription $using:srcSub
              $osDiskId = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.osDisk.managedDisk.id" -o tsv
              $osType = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.osDisk.osType" -o tsv
              $dataDiskIds = @($(az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.dataDisks[].managedDisk.id" -o tsv))

              az account set --subscription $using:tgtSub
              $location = az group show -n '${{ parameters.targetResourceGroupName }}' --query location -o tsv

              # OS snapshot & disk creation
              $existingOsSnap = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name, '$($PSItem.NewVMName)-os-snap')]|sort_by(@,&creationData.sourceResourceId)[-1].id" -o tsv
              if ($existingOsSnap) { $osSnapId = $existingOsSnap } else {
                  $osSnap = "$($PSItem.NewVMName)-os-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                  $osSnapId = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $osSnap --source $osDiskId --location $location --sku Standard_LRS --query id -o tsv
              }
              $osDiskName = "$($PSItem.NewVMName)-osdisk"
              $existingOsDisk = az disk list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$osDiskName'].id" -o tsv
              $osDiskIdNew = if ($existingOsDisk) { $existingOsDisk } else { az disk create -g '${{ parameters.targetResourceGroupName }}' -n $osDiskName --source $osSnapId --location $location --query id -o tsv }

              # Data disks
              $newDataDisksFinal = @(); $lun=0
              if ($dataDiskIds -and $dataDiskIds[0]) {
                  foreach ($dd in $dataDiskIds) {
                      $existingDataSnap = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name,'$($PSItem.NewVMName)-data$lun-snap')]|sort_by(@,&creationData.sourceResourceId)[-1].id" -o tsv
                      $dataSnapId = if ($existingDataSnap) { $existingDataSnap } else {
                          $snapName = "$($PSItem.NewVMName)-data$lun-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                          az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $snapName --source $dd --location $location --sku Standard_LRS --query id -o tsv
                      }
                      $dataDiskName = "$($PSItem.NewVMName)-data$lun-disk"
                      $existingDataDisk = az disk list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$dataDiskName'].id" -o tsv
                      $dataDiskIdNew = if ($existingDataDisk) { $existingDataDisk } else { az disk create -g '${{ parameters.targetResourceGroupName }}' -n $dataDiskName --source $dataSnapId --location $location --query id -o tsv }
                      $newDataDisksFinal += [PSCustomObject]@{Id=$dataDiskIdNew; Lun=$lun}
                      $lun++
                  }
              }

              # ------------------- NIC with cleanup -------------------
              try {
                  $nicName = "$($PSItem.NewVMName)-nic"
                  $existingNic = az network nic list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$nicName'].id" -o tsv
                  if ($existingNic) { $nicId = $existingNic } else {
                      $subnetId = az network vnet subnet show -g $using:vnetRg --vnet-name $using:vnetName -n $($PSItem.SubnetName) --query id -o tsv
                      $nsgId = az network nsg show -g $using:nsgRg -n $using:nsgName --query id -o tsv
                      if (-not $subnetId -or -not $nsgId) { throw "Subnet or NSG ID missing" }
                      $nicId = az network nic create -g '${{ parameters.targetResourceGroupName }}' -n $nicName --subnet $subnetId --network-security-group $nsgId --query "id" -o tsv
                      if (-not $nicId) { throw "NIC creation failed" }
                  }
                #   $nicNameOnly = Split-Path -Leaf $nicId
                # Keep the full NIC ID
                  $nicId = $nicId.Trim()  # remove any trailing whitespace just in case
                  $privateIp = az network nic show --ids $nicId --query "ipConfigurations[0].privateIpAddress" -o tsv
              } catch {
                  if ($nicId) { az network nic delete --ids $nicId }
                  throw
              }

              # ------------------- VM Creation -------------------
              try {
                  az vm create -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName) --nics $nicId --attach-os-disk $osDiskIdNew --os-type $osType --size $($PSItem.VMSize) --boot-diagnostics-storage "https://$using:bootDiagStorage.blob.core.windows.net/"
              } catch {
                  if ($nicId) { az network nic delete --ids $nicId }
                  throw
              }

              # Attach data disks
              foreach ($disk in $newDataDisksFinal) {
                  az vm disk attach -g '${{ parameters.targetResourceGroupName }}' --vm-name $($PSItem.NewVMName) --name $disk.Id --lun $disk.Lun
                  "$($PSItem.NewVMName),$($PSItem.SourceVMName),$($PSItem.SubnetName),$($PSItem.VMSize),$privateIp,$($disk.Id),$($disk.Lun)" | Out-File -FilePath $using:CsvFile -Append
              }

              # Cleanup snapshots
              if ($osSnapId) { az snapshot delete --ids $osSnapId }
              $lun=0
              foreach ($dd in $dataDiskIds) {
                  $dataSnapName = "$($PSItem.NewVMName)-data$lun-snap"
                  $dataSnapId = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name,'$dataSnapName')].id" -o tsv
                  if ($dataSnapId) { az snapshot delete --ids $dataSnapId }
                  $lun++
              }

              "[$(Get-Date -Format o)] VM clone completed: $($PSItem.NewVMName)" | Tee-Object -FilePath $using:LogFile -Append
          } catch {
              "[$(Get-Date -Format o)] ❌ Failed cloning $($PSItem.SourceVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
              throw
          }
      } -ThrottleLimit $ThrottleLimit

# ------------------- Final Summary Table -------------------
- task: PowerShell@2
  displayName: 'Generate Final Summary Table'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      $CsvFile = "C:\vm-to-clone\vm_clone_summary.csv"

      "[$(Get-Date -Format o)] 🎉 All VM cloning tasks completed. Generating summary table..." | Tee-Object -FilePath $LogFile -Append

      if (Test-Path $CsvFile) {
          $summary = Import-Csv $CsvFile -Header "NewVM","SourceVM","Subnet","Size","IP","DiskId","LUN"
          $grouped = $summary | Group-Object -Property NewVM
          foreach ($vmGroup in $grouped) {
              $vmName = $vmGroup.Name
              $sourceVM = ($vmGroup.Group | Select-Object -First 1).SourceVM
              $ip = ($vmGroup.Group | Select-Object -First 1).IP
              $subnet = ($vmGroup.Group | Select-Object -First 1).Subnet
              $size = ($vmGroup.Group | Select-Object -First 1).Size
              "-------------------------------------------------------------" | Tee-Object -FilePath $LogFile -Append
              "VM Name: $vmName" | Tee-Object -FilePath $LogFile -Append
              "Source VM: $sourceVM" | Tee-Object -FilePath $LogFile -Append
              "IP: $ip" | Tee-Object -FilePath $LogFile -Append
              "Subnet: $subnet" | Tee-Object -FilePath $LogFile -Append
              "Size: $size" | Tee-Object -FilePath $LogFile -Append
              "Disks and LUNs:" | Tee-Object -FilePath $LogFile -Append
              foreach ($disk in $vmGroup.Group) {
                  "  DiskID: $($disk.DiskId) | LUN: $($disk.LUN)" | Tee-Object -FilePath $LogFile -Append
              }
          }
          "-------------------------------------------------------------" | Tee-Object -FilePath $LogFile -Append
          "Summary CSV: $CsvFile" | Tee-Object -FilePath $LogFile -Append
      } else {
          "No CSV file found. Summary not generated." | Tee-Object -FilePath $LogFile -Append
      }

      "[$(Get-Date -Format o)] ✅ Pipeline completed." | Tee-Object -FilePath $LogFile -Append

# ------------------- Publish Summary as Artifact -------------------
- task: PublishBuildArtifacts@1
  displayName: 'Publish VM Clone Summary Artifact'
  inputs:
    PathtoPublish: 'C:\vm-to-clone\vm_clone_summary.csv'
    ArtifactName: 'VMCloneSummary'
    publishLocation: 'Container'