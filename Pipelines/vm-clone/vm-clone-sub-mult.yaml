# ------------------- VM Cloning Pipeline from CSV -------------------
#
# CSV Format:
# SourceVMName,NewVMName,StaticIp,SubnetName,VMSize
# DAIBGAPWSDLV1,DAIBGAPWSDLV1-upgrade,10.189.56.15,snet-dev-nonpci-web-01,Standard_D2s_v5
#
# Notes:
# - StaticIp: Optional. Leave empty for dynamic IP allocation
# - SubnetName: Required. Must exist in target VNet
# - StaticIp must be within SubnetName's address range
#
# ------------------- Pipeline Configuration -------------------

variables:
- group: AZ-Resources
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: targetSubscriptionName
    displayName: 'Target Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_SIT'
  - name: resourceGroupName
    displayName: 'Source Resource Group'
    type: string
    default: 'my-source-rg'
  - name: targetResourceGroupName
    displayName: 'Target Resource Group'
    type: string
    default: 'my-target-rg'
  - name: osType
    displayName: 'OS Type (linux or windows)'
    type: string
    default: 'linux'
    values:
      - linux
      - windows

trigger: none

pool:
  name: cloudops-agent

steps:
# ------------------- Azure CLI Login -------------------
- task: PowerShell@2
  displayName: 'Azure CLI Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "" | Out-File -FilePath $LogFile -Encoding utf8

      # Source Subscription
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid source subscription"; exit 1 }
      }

      # Target Subscription
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid target subscription"; exit 1 }
      }

      az login --service-principal `
          -u $env:AZURE_CLIENT_ID `
          -p $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID | Tee-Object -FilePath $LogFile -Append
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure CLI login failed"
          exit 1
      }
      az account set --subscription $srcSub | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] Azure CLI login successful. Source: $srcSub, Target: $tgtSub" | Tee-Object -FilePath $LogFile -Append
      
      # Store subscription IDs as pipeline variables
      Write-Host "##vso[task.setvariable variable=SourceSubscriptionId]$srcSub"
      Write-Host "##vso[task.setvariable variable=TargetSubscriptionId]$tgtSub"
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

# ------------------- Initialize Variables and CSV -------------------
- task: PowerShell@2
  displayName: 'Initialize Variables and Load CSV'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $ErrorActionPreference = "Stop"
      $LogFile = "C:\log\clone_log.txt"
      
      # Use CSV from repository
      $vmInputCsv = "$(Build.SourcesDirectory)\Pipelines\vm-clone\vms-to-clone.csv"

      if (-not (Test-Path $vmInputCsv)) {
          Write-Error "CSV file not found at $vmInputCsv"
          exit 1
      }

      Write-Host "Importing VM definitions from CSV: $vmInputCsv"
      $vmList = Import-Csv -Path $vmInputCsv | Select-Object SourceVMName,NewVMName,StaticIp,SubnetName,VMSize
      
      # Validate CSV has required columns
      $requiredColumns = @('SourceVMName', 'NewVMName', 'SubnetName', 'VMSize')
      $csvColumns = ($vmList | Get-Member -MemberType NoteProperty).Name
      $missingColumns = $requiredColumns | Where-Object { $_ -notin $csvColumns }
      if ($missingColumns) {
          Write-Error "CSV is missing required columns: $($missingColumns -join ', ')"
          exit 1
      }
      
      "Successfully imported $($vmList.Count) VM(s) from CSV" | Tee-Object -FilePath $LogFile -Append

      # Target environment variables
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' {
              $vnetName = '$(DEV_VNETName)'; $vnetRg = '$(DEV_VNETRG)'
              $nsgName = '$(DEV_NSGName)'; $nsgRg = '$(DEV_NSGRG)'
              $bootDiagStorage = '$(DEV_BootDiagStorage)'
          }
          'BAB_SIT' {
              $vnetName = '$(SIT_VNETName)'; $vnetRg = '$(SIT_VNETRG)'
              $nsgName = '$(SIT_NSGName)'; $nsgRg = '$(SIT_NSGRG)'
              $bootDiagStorage = '$(SIT_BootDiagStorage)'
          }
          'BAB_CORE' {
              $coreVnetName = '$(CORE_VNETName)'; $coreVnetRg = '$(CORE_VNETRG)'
              $dmzVnetName = '$(CORE_DMZ_VNETName)'; $dmzVnetRg = '$(CORE_DMZ_VNETRG)'
              $nsgName = '$(CORE_NSGName)'; $nsgRg = '$(CORE_NSGRG)'
              $dmzNsgName = '$(CORE_DMZ_NSGName)'; $dmzNsgRg = $dmzVnetRg
              # Use WEEU-specific BootDiagStorage if region is WEEU
              if ('$(CORE_REGION)' -eq 'westeurope' -or $coreVnetRg -match '(?i)weeu') {
                $bootDiagStorage = '$(CORE_BootDiagStorage_weeu)'
              } else {
                $bootDiagStorage = '$(CORE_BootDiagStorage)'
              }
              # Default to core VNET for main pipeline variables
              $vnetName = $coreVnetName
              $vnetRg = $coreVnetRg
            Write-Host "BAB_CORE VNETs:"
            Write-Host "  CORE_VNETName: $coreVnetName"
            Write-Host "  CORE_VNETRG: $coreVnetRg"
            Write-Host "  CORE_DMZ_VNETName: $dmzVnetName"
            Write-Host "  CORE_DMZ_VNETRG: $dmzVnetRg"
            Write-Host "  CORE_DMZ_NSGName: $dmzNsgName"
            Write-Host "  CORE_DMZ_NSGRG: $dmzNsgRg (set to DMZ VNET RG)"
          }
          default { Write-Error "Invalid target subscription"; exit 1 }
             # Both VNETs are now available for BAB_CORE
      }

      # Store as pipeline variables
      Write-Host "##vso[task.setvariable variable=VnetName]$vnetName"
      Write-Host "##vso[task.setvariable variable=VnetRg]$vnetRg"
      Write-Host "##vso[task.setvariable variable=CoreVnetName]$coreVnetName"
      Write-Host "##vso[task.setvariable variable=CoreVnetRg]$coreVnetRg"
      Write-Host "##vso[task.setvariable variable=DmzVnetName]$dmzVnetName"
      Write-Host "##vso[task.setvariable variable=DmzVnetRg]$dmzVnetRg"
      Write-Host "##vso[task.setvariable variable=NsgName]$nsgName"
      Write-Host "##vso[task.setvariable variable=NsgRg]$nsgRg"
      Write-Host "##vso[task.setvariable variable=DmzNsgName]$dmzNsgName"
      Write-Host "##vso[task.setvariable variable=DmzNsgRg]$dmzNsgRg"
      Write-Host "##vso[task.setvariable variable=BootDiagStorage]$bootDiagStorage"
      Write-Host "##vso[task.setvariable variable=VMCount]$($vmList.Count)"

# ------------------- Clone VMs from CSV -------------------
- task: PowerShell@2
  displayName: 'Clone VMs Sequentially'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)/Pipelines/vm-clone/Clone-VMs.ps1'
    arguments: >
      -SourceSubscription "$(SourceSubscriptionId)"
      -TargetSubscription "$(TargetSubscriptionId)"
      -SourceResourceGroup "${{ parameters.resourceGroupName }}"
      -TargetResourceGroup "${{ parameters.targetResourceGroupName }}"
      -VnetName "$(VnetName)"
      -VnetRg "$(VnetRg)"
      -NsgName "$(NsgName)"
      -NsgRg "$(NsgRg)"
      -BootDiagStorage "$(BootDiagStorage)"
      -CsvPath "$(Build.SourcesDirectory)\Pipelines\vm-clone\vms-to-clone.csv"
      -TargetEnvironment "${{ parameters.targetSubscriptionName }}"
    pwsh: true
  env:
    DmzNsgName: $(DmzNsgName)
    DmzNsgRg: $(DmzNsgRg)
    CORE_BootDiagStorage_weeu: 'babcorevmbootdiag02'