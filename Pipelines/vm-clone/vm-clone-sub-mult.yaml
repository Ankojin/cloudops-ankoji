# ------------------- Parallel VM Cloning Pipeline with Summary -------------------

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: targetSubscriptionName
    displayName: 'Target Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: resourceGroupName
    displayName: 'Source Resource Group'
    type: string
    default: 'my-source-rg'
  - name: targetResourceGroupName
    displayName: 'Target Resource Group'
    type: string
    default: 'my-target-rg'
  - name: vnetName
    displayName: 'VNet Name'
    type: string
    default: 'my-vnet'
  - name: vnetRg
    displayName: 'VNet Resource Group'
    type: string
    default: 'my-vnet-rg'
  - name: nsgName
    displayName: 'NSG Name'
    type: string
    default: 'my-nsg'
  - name: nsgRg
    displayName: 'NSG Resource Group'
    type: string
    default: 'my-nsg-rg'
  - name: bootDiagStorage
    displayName: 'Boot Diagnostics Storage Account Name'
    type: string
    default: 'mybootdiagstorage'
  - name: singleSourceVM
    displayName: 'Single Source VM Name (leave empty if using Multi-VMs)'
    type: string
    default: ''
  - name: singleNewVM
    displayName: 'Single New VM Name'
    type: string
    default: ''
  - name: singleStaticIP
    displayName: 'Single Static IP'
    type: string
    default: ''
  - name: singleSubnet
    displayName: 'Single Subnet Name'
    type: string
    default: ''
  - name: singleVMSize
    displayName: 'Single VM Size'
    type: string
    default: ''
  - name: multiVMs
    displayName: 'Multi-VMs (comma-separated: SourceVM,NewVM,IP,Subnet,Size per line)'
    type: string
    default: ''

trigger: none

pool:
  name: cloudops-agent

steps:
# ------------------- Azure CLI Login -------------------
- task: PowerShell@2
  displayName: 'Azure CLI Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "" | Out-File -FilePath $LogFile -Encoding utf8

      # Source Subscription
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = $env:BAB_DEV_SUBSCRIPTION_ID }
          'BAB_SIT' { $srcSub = $env:BAB_SIT_SUBSCRIPTION_ID }
          'BAB_CORE' { $srcSub = $env:BAB_CORE_SUBSCRIPTION_ID }
          default { Write-Error "Invalid source subscription"; exit 1 }
      }

      # Target Subscription
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = $env:BAB_DEV_SUBSCRIPTION_ID }
          'BAB_SIT' { $tgtSub = $env:BAB_SIT_SUBSCRIPTION_ID }
          'BAB_CORE' { $tgtSub = $env:BAB_CORE_SUBSCRIPTION_ID }
          default { Write-Error "Invalid target subscription"; exit 1 }
      }

      az login --service-principal `
          -u $env:AZURE_CLIENT_ID `
          -p $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID | Tee-Object -FilePath $LogFile -Append
      az account set --subscription $srcSub | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] Azure CLI login successful. Source subscription: $srcSub, Target subscription: $tgtSub" | Tee-Object -FilePath $LogFile -Append
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

# ------------------- Clone VMs -------------------
- task: PowerShell@2
  displayName: 'Clone VMs in Parallel with Summary'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      $CsvFile = "C:\log\vm_clone_summary.csv"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "" | Out-File -FilePath $CsvFile -Encoding UTF8

      $vmList = @()

      # --- Prepare VM List
      if ('${{ parameters.multiVMs }}'.Trim()) {
          $lines = '${{ parameters.multiVMs }}' -split "`n"
          foreach ($line in $lines) {
              $parts = $line.Split(',') | ForEach-Object { $_.Trim() }
              $vmList += [PSCustomObject]@{
                  SourceVM = $parts[0]
                  NewVM = $parts[1]
                  IP = $parts[2]
                  Subnet = $parts[3]
                  Size = $parts[4]
              }
          }
      } elseif ('${{ parameters.singleSourceVM }}'.Trim()) {
          $vmList += [PSCustomObject]@{
              SourceVM = '${{ parameters.singleSourceVM }}'
              NewVM = '${{ parameters.singleNewVM }}'
              IP = '${{ parameters.singleStaticIP }}'
              Subnet = '${{ parameters.singleSubnet }}'
              Size = '${{ parameters.singleVMSize }}'
          }
      } else {
          Write-Error "No VM defined"
          exit 1
      }

      $ThrottleLimit = 4  # Adjust number of parallel VMs

      $vmList | ForEach-Object -Parallel {
          param($vm, $LogFile, $CsvFile, $srcSub, $tgtSub)

          try {
              "[$(Get-Date -Format o)] Starting clone: $($vm.SourceVM) -> $($vm.NewVM)" | Tee-Object -FilePath $LogFile -Append

              # ------------------- OS Disk -------------------
              az account set --subscription $srcSub
              $osDiskId = az vm show -g '${{ parameters.resourceGroupName }}' -n $($vm.SourceVM) --query "storageProfile.osDisk.managedDisk.id" -o tsv
              $osType = az vm show -g '${{ parameters.resourceGroupName }}' -n $($vm.SourceVM) --query "storageProfile.osDisk.osType" -o tsv
              $dataDiskIds = az vm show -g '${{ parameters.resourceGroupName }}' -n $($vm.SourceVM) --query "storageProfile.dataDisks[].managedDisk.id" -o tsv

              az account set --subscription $tgtSub
              $location = az group show -n '${{ parameters.targetResourceGroupName }}' --query location -o tsv

              # --- OS snapshot: use latest if exists
              $existingOsSnap = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name, '$($vm.NewVM)-os-snap')]|sort_by(@,&creationData.sourceResourceId)[-1].id" -o tsv
              if ($existingOsSnap) { $osSnapId = $existingOsSnap; "[$(Get-Date -Format o)] Using existing OS snapshot: $osSnapId" | Tee-Object -FilePath $LogFile -Append }
              else {
                  $osSnap = "${vm.NewVM}-os-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                  $osSnapId = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $osSnap --source $osDiskId --location $location --sku Standard_LRS --query id -o tsv
                  if (-not $osSnapId) { throw "OS snapshot creation failed" }
              }

              # --- OS Disk: use existing if available
              $osDiskName = "${vm.NewVM}-osdisk"
              $existingOsDisk = az disk list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$osDiskName'].id" -o tsv
              $osDiskIdNew = if ($existingOsDisk) { $existingOsDisk } else {
                  $diskId = az disk create -g '${{ parameters.targetResourceGroupName }}' -n $osDiskName --source $osSnapId --location $location --query id -o tsv
                  if (-not $diskId) { throw "OS disk creation failed" } else { $diskId }
              }

              # ------------------- Data Disks -------------------
              $newDataDisksFinal = @()
              $lun = 0
              foreach ($dd in $dataDiskIds) {
                  $existingDataSnap = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name,'$($vm.NewVM)-data$lun-snap')]|sort_by(@,&creationData.sourceResourceId)[-1].id" -o tsv
                  $dataSnapId = if ($existingDataSnap) { $existingDataSnap } else {
                      $snapName = "${vm.NewVM}-data$lun-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                      $id = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $snapName --source $dd --location $location --sku Standard_LRS --query id -o tsv
                      if (-not $id) { throw "Data snapshot failed for LUN $lun" } else { $id }
                  }

                  # Data disk
                  $dataDiskName = "${vm.NewVM}-data$lun-disk"
                  $existingDataDisk = az disk list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$dataDiskName'].id" -o tsv
                  $dataDiskIdNew = if ($existingDataDisk) { $existingDataDisk } else {
                      $id = az disk create -g '${{ parameters.targetResourceGroupName }}' -n $dataDiskName --source $dataSnapId --location $location --query id -o tsv
                      if (-not $id) { throw "Data disk creation failed for LUN $lun" } else { $id }
                  }

                  $newDataDisksFinal += [PSCustomObject]@{Id=$dataDiskIdNew; Lun=$lun}
                  $lun++
              }

              # ------------------- NIC -------------------
              $subnetId = az network vnet subnet show -g '${{ parameters.vnetRg }}' --vnet-name '${{ parameters.vnetName }}' -n $($vm.Subnet) --query id -o tsv
              $nsgId = az network nsg show -g '${{ parameters.nsgRg }}' -n '${{ parameters.nsgName }}' --query id -o tsv
              $nicName = "${vm.NewVM}-nic"
              $existingNic = az network nic list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$nicName'].id" -o tsv
              $nicId = if ($existingNic) { $existingNic } else {
                  $id = az network nic create -g '${{ parameters.targetResourceGroupName }}' -n $nicName --subnet $subnetId --private-ip-address $($vm.IP) --network-security-group $nsgId --query id -o tsv
                  if (-not $id) { throw "NIC creation failed" } else { $id }
              }

              # ------------------- VM -------------------
              $vmCreate = az vm create -g '${{ parameters.targetResourceGroupName }}' -n $($vm.NewVM) --nics $nicId --attach-os-disk $osDiskIdNew --os-type $osType --size $($vm.Size) --boot-diagnostics-storage "https://${{ parameters.bootDiagStorage }}.blob.core.windows.net/"
              if (-not $?) { throw "VM creation failed" }

              # Attach data disks
              foreach ($disk in $newDataDisksFinal) {
                  az vm disk attach -g '${{ parameters.targetResourceGroupName }}' --vm-name $($vm.NewVM) --name $disk.Id --lun $disk.Lun
              }

              # ------------------- CSV Export -------------------
              foreach ($disk in $newDataDisksFinal) {
                  "$($vm.NewVM),$($vm.SourceVM),$($vm.IP),$($vm.Subnet),$($vm.Size),$($disk.Id),$($disk.Lun)" | Out-File -FilePath $CsvFile -Append
              }

              "[$(Get-Date -Format o)] VM clone completed: $($vm.NewVM)" | Tee-Object -FilePath $LogFile -Append
          } catch {
              "[$(Get-Date -Format o)] ❌ Failed cloning $($vm.SourceVM): $_" | Tee-Object -FilePath $LogFile -Append
              throw "Stopping pipeline due to failure"
          }
      } -ThrottleLimit $ThrottleLimit -ArgumentList $LogFile, $CsvFile, $srcSub, $tgtSub

# ------------------- Final Summary Table -------------------
- task: PowerShell@2
  displayName: 'Generate Final Summary Table'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      $CsvFile = "C:\log\vm_clone_summary.csv"

      "[$(Get-Date -Format o)] 🎉 All VM cloning tasks completed. Generating summary table..." | Tee-Object -FilePath $LogFile -Append

      if (Test-Path $CsvFile) {
          $summary = Import-Csv $CsvFile -Header "NewVM","SourceVM","IP","Subnet","Size","DiskId","LUN"
          $grouped = $summary | Group-Object -Property NewVM
          foreach ($vmGroup in $grouped) {
              $vmName = $vmGroup.Name
              $sourceVM = ($vmGroup.Group | Select-Object -First 1).SourceVM
              $ip = ($vmGroup.Group | Select-Object -First 1).IP
              $subnet = ($vmGroup.Group | Select-Object -First 1).Subnet
              $size = ($vmGroup.Group | Select-Object -First 1).Size
              "-------------------------------------------------------------" | Tee-Object -FilePath $LogFile -Append
              "VM Name: $vmName" | Tee-Object -FilePath $LogFile -Append
              "Source VM: $sourceVM" | Tee-Object -FilePath $LogFile -Append
              "IP: $ip" | Tee-Object -FilePath $LogFile -Append
              "Subnet: $subnet" | Tee-Object -FilePath $LogFile -Append
              "Size: $size" | Tee-Object -FilePath $LogFile -Append
              "Disks and LUNs:" | Tee-Object -FilePath $LogFile -Append
              foreach ($disk in $vmGroup.Group) {
                  "  DiskID: $($disk.DiskId) | LUN: $($disk.LUN)" | Tee-Object -FilePath $LogFile -Append
              }
          }
          "-------------------------------------------------------------" | Tee-Object -FilePath $LogFile -Append
          "Summary CSV: $CsvFile" | Tee-Object -FilePath $LogFile -Append
      } else {
          "No CSV file found. Summary not generated." | Tee-Object -FilePath $LogFile -Append
      }

      "[$(Get-Date -Format o)] ✅ Pipeline completed." | Tee-Object -FilePath $LogFile -Append

# ------------------- Publish Summary as Artifact -------------------
- task: PublishBuildArtifacts@1
  displayName: 'Publish VM Clone Summary Artifact'
  inputs:
    PathtoPublish: 'C:\log\vm_clone_summary.csv'
    ArtifactName: 'VMCloneSummary'
    publishLocation: 'Container'