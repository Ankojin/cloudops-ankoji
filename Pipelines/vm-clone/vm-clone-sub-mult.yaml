# ------------------- VM Cloning Pipeline from CSV -------------------
#
# CSV Format:
# SourceVMName,NewVMName,StaticIp,SubnetName,VMSize
# DAIBGAPWSDLV1,DAIBGAPWSDLV1-upgrade,10.189.56.15,snet-dev-nonpci-web-01,Standard_D2s_v5
#
# Notes:
# - StaticIp: Optional. Leave empty for dynamic IP allocation
# - SubnetName: Required. Must exist in target VNet
# - StaticIp must be within SubnetName's address range
#
# ------------------- Pipeline Configuration -------------------

variables:
- group: AZ-Resources
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: targetSubscriptionName
    displayName: 'Target Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_SIT'
  - name: resourceGroupName
    displayName: 'Source Resource Group'
    type: string
    default: 'my-source-rg'
  - name: targetResourceGroupName
    displayName: 'Target Resource Group'
    type: string
    default: 'my-target-rg'
  - name: osType
    displayName: 'OS Type (linux or windows)'
    type: string
    default: 'linux'
    values:
      - linux
      - windows

trigger: none

pool:
  name: cloudops-agent

steps:
# ------------------- Azure CLI Login -------------------
- task: PowerShell@2
  displayName: 'Azure CLI Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "" | Out-File -FilePath $LogFile -Encoding utf8

      # Source Subscription
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid source subscription"; exit 1 }
      }

      # Target Subscription
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid target subscription"; exit 1 }
      }

      az login --service-principal `
          -u $env:AZURE_CLIENT_ID `
          -p $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID | Tee-Object -FilePath $LogFile -Append
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure CLI login failed"
          exit 1
      }
      az account set --subscription $srcSub | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] Azure CLI login successful. Source: $srcSub, Target: $tgtSub" | Tee-Object -FilePath $LogFile -Append
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

# ------------------- Clone VMs from CSV -------------------
- task: PowerShell@2
  displayName: 'Clone VMs Sequentially with Summary'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $ErrorActionPreference = "Continue"
      $global:ErrorCount = 0
      $global:SuccessCount = 0

      function Log-Error {
        param($msg)
        Write-Error $msg
        $global:ErrorCount++
      }

      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      $LogFile = "C:\log\clone_log.txt"
      
      # Use CSV from repository
      $vmInputCsv = "$(Build.SourcesDirectory)\Pipelines\vm-clone\vms-to-clone.csv"

      if (Test-Path $vmInputCsv) {
          Write-Host "Importing VM definitions from CSV: $vmInputCsv"
          $vmList = Import-Csv -Path $vmInputCsv | Select-Object SourceVMName,NewVMName,StaticIp,SubnetName,VMSize
          
          # Validate CSV has required columns
          $requiredColumns = @('SourceVMName', 'NewVMName', 'SubnetName', 'VMSize')
          $csvColumns = ($vmList | Get-Member -MemberType NoteProperty).Name
          $missingColumns = $requiredColumns | Where-Object { $_ -notin $csvColumns }
          if ($missingColumns) {
              Log-Error "CSV is missing required columns: $($missingColumns -join ', ')"
              exit 1
          }
          
          "Successfully imported $($vmList.Count) VM(s) from CSV" | Tee-Object -FilePath $LogFile -Append
      } else {
          Log-Error "CSV file with VM definitions not found at $vmInputCsv. Please provide the file."
          exit 1
      }

      # Target environment variables
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' {
              $vnetName = '$(DEV_VNETName)'; $vnetRg = '$(DEV_VNETRG)'
              $nsgName = '$(DEV_NSGName)'; $nsgRg = '$(DEV_NSGRG)'
              $bootDiagStorage = '$(DEV_BootDiagStorage)'
          }
          'BAB_SIT' {
              $vnetName = '$(SIT_VNETName)'; $vnetRg = '$(SIT_VNETRG)'
              $nsgName = '$(SIT_NSGName)'; $nsgRg = '$(SIT_NSGRG)'
              $bootDiagStorage = '$(SIT_BootDiagStorage)'
          }
          'BAB_CORE' {
              $vnetName = '$(CORE_VNETName)'; $vnetRg = '$(CORE_VNETRG)'
              $nsgName = '$(CORE_NSGName)'; $nsgRg = '$(CORE_NSGRG)'
              $bootDiagStorage = '$(CORE_BootDiagStorage)'
          }
          default { Log-Error "Invalid target subscription"; exit 1 }
      }

      # Source/target subscription IDs
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
      }
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
      }

      foreach ($PSItem in $vmList) {
          $osTypeParam = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query storageProfile.osDisk.osType -o tsv
          "Detected OS type: $osTypeParam" | Tee-Object -FilePath $LogFile -Append

          $nicId = $null
          $nicName = "$($PSItem.NewVMName)-nic"
          
          # Get StaticIp and SubnetName from CSV for this specific VM
          $staticIp = if ($PSItem.StaticIp -and $PSItem.StaticIp.Trim() -ne "") { $PSItem.StaticIp.Trim() } else { $null }
          $subnetName = if ($PSItem.SubnetName -and $PSItem.SubnetName.Trim() -ne "") { $PSItem.SubnetName.Trim() } else { $null }
          
          if (-not $subnetName) {
              Log-Error "SubnetName is required for VM $($PSItem.NewVMName) but not provided in CSV"
              continue
          }
          
          "VM: $($PSItem.NewVMName) | Subnet: $subnetName | Static IP: $(if($staticIp){"$staticIp"}else{"Dynamic (not specified)"})" | Tee-Object -FilePath $LogFile -Append

          try {
              "[$(Get-Date -Format o)] Starting clone: $($PSItem.SourceVMName) -> $($PSItem.NewVMName)" | Tee-Object -FilePath $LogFile -Append

              # ------------------- OS/Data Disk logic -------------------
              az account set --subscription $srcSub
              $osDiskId = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.osDisk.managedDisk.id" -o tsv
              $dataDiskIds = @(az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.dataDisks[].managedDisk.id" -o tsv)

              # Get original OS disk SKU to preserve performance tier
              $osDiskSku = az disk show --ids $osDiskId --query "sku.name" -o tsv
              if (-not $osDiskSku) { $osDiskSku = "Standard_LRS" }
              "Original OS disk SKU: $osDiskSku" | Tee-Object -FilePath $LogFile -Append

              az account set --subscription $tgtSub
              $location = az group show -n '${{ parameters.targetResourceGroupName }}' --query location -o tsv

              # Validate boot diagnostics storage account exists
              $storageExists = az storage account show --name $bootDiagStorage 2>$null
              if (-not $storageExists) {
                  Log-Error "Boot diagnostics storage account '$bootDiagStorage' not found in target subscription"
                  continue
              }

              # Tags for resource governance
              $clonedDate = Get-Date -Format 'yyyy-MM-dd'
              $tags = "Environment=${{ parameters.targetSubscriptionName }} SourceVM=$($PSItem.SourceVMName) ClonedDate=$clonedDate ClonedBy=AzureDevOps ManagedBy=CloudOps"

              # OS snapshot & disk creation with original SKU
              $osSnap = "$($PSItem.NewVMName)-os-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
              $osSnapId = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $osSnap --source $osDiskId --location $location --sku $osDiskSku --tags $tags --query id -o tsv
              $osDiskName = "$($PSItem.NewVMName)-osdisk"
              $osDiskIdNew = az disk create -g '${{ parameters.targetResourceGroupName }}' -n $osDiskName --source $osSnapId --location $location --sku $osDiskSku --tags $tags --query id -o tsv
              "Created OS disk '$osDiskName' with SKU: $osDiskSku" | Tee-Object -FilePath $LogFile -Append

              # Data disks with original SKU preservation
              $newDataDisksFinal = @(); $lun=0
              if ($dataDiskIds -and $dataDiskIds[0] -ne "") {
                  foreach ($dd in $dataDiskIds) {
                      # Switch to source subscription to get disk SKU
                      az account set --subscription $srcSub
                      $dataDiskSku = az disk show --ids $dd --query "sku.name" -o tsv
                      if (-not $dataDiskSku) { $dataDiskSku = "Standard_LRS" }
                      $dataDiskSize = az disk show --ids $dd --query "diskSizeGb" -o tsv
                      "Data disk $lun | Original SKU: $dataDiskSku | Size: $dataDiskSize GB" | Tee-Object -FilePath $LogFile -Append
                      
                      # Switch back to target subscription for creation
                      az account set --subscription $tgtSub
                      $snapName = "$($PSItem.NewVMName)-data$lun-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                      $dataSnapId = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $snapName --source $dd --location $location --sku $dataDiskSku --tags $tags --query id -o tsv
                      $dataDiskName = "$($PSItem.NewVMName)-data$lun-disk"
                      $dataDiskIdNew = az disk create -g '${{ parameters.targetResourceGroupName }}' -n $dataDiskName --source $dataSnapId --location $location --sku $dataDiskSku --tags $tags --query id -o tsv
                      $newDataDisksFinal += [PSCustomObject]@{Id=$dataDiskIdNew; Lun=$lun}
                      "Created data disk '$dataDiskName' with SKU: $dataDiskSku" | Tee-Object -FilePath $LogFile -Append
                      $lun++
                  }
              }

              # ------------------- NIC with static IP from CSV -------------------
              try {
                  # Validate subnet exists
                  $subnetId = az network vnet subnet show -g $vnetRg --vnet-name $vnetName -n $subnetName --query id -o tsv 2>$null
                  if (-not $subnetId) {
                      Log-Error "Subnet '$subnetName' not found in VNet '$vnetName' (Resource Group: $vnetRg)"
                      continue
                  }
                  "Validated subnet: $subnetName (ID: $subnetId)" | Tee-Object -FilePath $LogFile -Append

                  $nsgId = az network nsg show -g $nsgRg -n $nsgName --query id -o tsv 2>$null
                  if (-not $nsgId) {
                      Log-Error "NSG '$nsgName' not found in Resource Group: $nsgRg"
                      continue
                  }

                  # Check if NIC already exists and delete it (force overwrite)
                  $existingNic = az network nic show -g '${{ parameters.targetResourceGroupName }}' -n $nicName 2>$null
                  if ($existingNic) {
                      "Existing NIC '$nicName' found. Deleting for force overwrite..." | Tee-Object -FilePath $LogFile -Append
                      az network nic delete -g '${{ parameters.targetResourceGroupName }}' -n $nicName --yes
                      
                      # Wait for deletion to complete (up to 30 seconds)
                      $maxWait = 30
                      $waited = 0
                      while ((az network nic show -g '${{ parameters.targetResourceGroupName }}' -n $nicName 2>$null) -and ($waited -lt $maxWait)) {
                          Start-Sleep -Seconds 2
                          $waited += 2
                      }
                      if ($waited -ge $maxWait) {
                          Log-Error "Timeout waiting for NIC deletion"
                          continue
                      }
                  }

                  # Create NIC with static IP from CSV (if provided) or dynamic IP
                  if ($staticIp) {
                      # Get subnet address prefix for validation logging
                      $subnetPrefix = az network vnet subnet show -g $vnetRg --vnet-name $vnetName -n $subnetName --query "addressPrefix" -o tsv
                      "Attempting to create NIC with static IP: $staticIp (Subnet: $subnetPrefix)" | Tee-Object -FilePath $LogFile -Append
                      
                      # Let Azure validate the IP
                      $nicCreateResult = az network nic create -g '${{ parameters.targetResourceGroupName }}' -n $nicName --subnet $subnetId --network-security-group $nsgId --private-ip-address $staticIp --tags $tags --query 'NewNIC.id' -o tsv 2>&1
                      
                      if ($LASTEXITCODE -ne 0) {
                          Log-Error "Static IP $staticIp validation failed for subnet $subnetPrefix. Error: $nicCreateResult"
                          "Retrying NIC creation with dynamic IP allocation..." | Tee-Object -FilePath $LogFile -Append
                          
                          $nicId = az network nic create -g '${{ parameters.targetResourceGroupName }}' -n $nicName --subnet $subnetId --network-security-group $nsgId --tags $tags --query 'NewNIC.id' -o tsv
                      } else {
                          $nicId = $nicCreateResult
                      }
                  } else {
                      "Creating NIC with dynamic IP (no static IP provided in CSV)" | Tee-Object -FilePath $LogFile -Append
                      $nicId = az network nic create -g '${{ parameters.targetResourceGroupName }}' -n $nicName --subnet $subnetId --network-security-group $nsgId --tags $tags --query 'NewNIC.id' -o tsv
                  }

                  if (-not $nicId) { 
                      Log-Error "NIC creation failed for $($PSItem.NewVMName)"
                      continue 
                  }
                  
                  $nicId = $nicId.Trim()
                  $privateIp = az network nic show --ids $nicId --query "ipConfigurations[0].privateIpAddress" -o tsv
                  $ipAllocation = az network nic show --ids $nicId --query "ipConfigurations[0].privateIpAllocationMethod" -o tsv
                  "✅ NIC created successfully | Name: $nicName | IP: $privateIp | Allocation: $ipAllocation | Subnet: $subnetName" | Tee-Object -FilePath $LogFile -Append
              } catch {
                  $errorMsg = $_.Exception.Message
                  if ($nicId) { 
                      "Cleaning up failed NIC..." | Tee-Object -FilePath $LogFile -Append
                      az network nic delete --ids $nicId --yes --no-wait 2>$null
                  }
                  Log-Error "NIC creation error for $($PSItem.NewVMName): $errorMsg"
                  continue
              }

              # ------------------- VM Creation -------------------
              try {
                  "Creating VM: $($PSItem.NewVMName) with size $($PSItem.VMSize)..." | Tee-Object -FilePath $LogFile -Append
                  $vmCreateCmd = "az vm create -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName) --nics $nicId --attach-os-disk $osDiskIdNew --os-type $osTypeParam --size $($PSItem.VMSize) --boot-diagnostics-storage https://$bootDiagStorage.blob.core.windows.net/ --tags `"$tags`""
                  Invoke-Expression $vmCreateCmd | Tee-Object -FilePath $LogFile -Append

                  if ($LASTEXITCODE -ne 0) {
                      throw "VM creation command failed with exit code $LASTEXITCODE"
                  }

                  # Apply tags to VM
                  try {
                      $vmResourceId = "/subscriptions/$tgtSub/resourceGroups/${{ parameters.targetResourceGroupName }}/providers/Microsoft.Compute/virtualMachines/$($PSItem.NewVMName)"
                      az resource tag --ids $vmResourceId --tags $tags | Tee-Object -FilePath $LogFile -Append
                  } catch {
                      Log-Error "Failed to apply tags to VM $($PSItem.NewVMName): $_"
                  }

                  # Attach data disks (if any)
                  if ($newDataDisksFinal.Count -gt 0) {
                      "Attaching $($newDataDisksFinal.Count) data disk(s) to VM..." | Tee-Object -FilePath $LogFile -Append
                      
                      # Deallocate VM before attaching disks
                      az vm deallocate -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName) --no-wait
                      az vm wait -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName) --custom "instanceView.statuses[?code=='PowerState/deallocated']"
                      
                      foreach ($disk in $newDataDisksFinal) {
                          try {
                              az vm disk attach -g '${{ parameters.targetResourceGroupName }}' --vm-name $($PSItem.NewVMName) --name $($disk.Id) --lun $($disk.Lun)
                              "Attached data disk at LUN $($disk.Lun)" | Tee-Object -FilePath $LogFile -Append
                          } catch {
                              Log-Error "Failed to attach disk $($disk.Id) at LUN $($disk.Lun): $_"
                          }
                      }
                      
                      # Start VM after attaching disks
                      az vm start -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName)
                      "VM started after data disk attachment" | Tee-Object -FilePath $LogFile -Append
                  }

                  "✅ VM $($PSItem.NewVMName) created successfully with NIC: $nicName" | Tee-Object -FilePath $LogFile -Append
              } catch {
                  $errorMsg = $_.Exception.Message
                  Log-Error "VM creation error for $($PSItem.NewVMName): $errorMsg"
                  
                  # Cleanup NIC if VM creation failed
                  if ($nicId) {
                      "VM creation failed. Deleting NIC '$nicName'..." | Tee-Object -FilePath $LogFile -Append
                      az network nic delete -g '${{ parameters.targetResourceGroupName }}' -n $nicName --yes --no-wait 2>$null
                  }
                  continue
              }

              # ------------------- Cleanup: Snapshots only -------------------
              try {
                  # Delete OS snapshot
                  if ($osSnapId) {
                      "Deleting OS snapshot: $osSnap" | Tee-Object -FilePath $LogFile -Append
                      az snapshot delete --ids $osSnapId --yes --no-wait 2>$null
                  }

                  # Delete data disk snapshots
                  if ($dataDiskIds -and $dataDiskIds[0] -ne "") {
                      $dataSnaps = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name, '$($PSItem.NewVMName)-data')].id" -o tsv
                      if ($dataSnaps) {
                          $dataSnapArray = $dataSnaps -split "`r?`n"
                          foreach ($snapId in $dataSnapArray) {
                              if ($snapId -and $snapId.Trim() -ne "") {
                                  "Deleting data snapshot: $snapId" | Tee-Object -FilePath $LogFile -Append
                                  az snapshot delete --ids $snapId --yes --no-wait 2>$null
                              }
                          }
                      }
                  }
              } catch {
                  Log-Error "Snapshot cleanup error for $($PSItem.NewVMName): $_"
              }

              "[$(Get-Date -Format o)] ✅ Clone completed successfully: $($PSItem.SourceVMName) -> $($PSItem.NewVMName) | IP: $privateIp | Subnet: $subnetName" | Tee-Object -FilePath $LogFile -Append
              $global:SuccessCount++
          } catch {
              $errorMsg = $_.Exception.Message
              # Final cleanup attempt for NIC if overall process failed
              if ($nicName) {
                  "Overall process failed. Attempting final NIC cleanup..." | Tee-Object -FilePath $LogFile -Append
                  az network nic delete -g '${{ parameters.targetResourceGroupName }}' -n $nicName --yes --no-wait 2>$null
              }
              Log-Error "❌ Failed cloning $($PSItem.SourceVMName): $errorMsg"
          }
      }

      # ------------------- Final Summary -------------------
      "=" * 80 | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] VM Cloning Pipeline Completed" | Tee-Object -FilePath $LogFile -Append
      "Total VMs processed: $($vmList.Count)" | Tee-Object -FilePath $LogFile -Append
      "Successfully cloned: $global:SuccessCount" | Tee-Object -FilePath $LogFile -Append
      "Failed: $global:ErrorCount" | Tee-Object -FilePath $LogFile -Append
      "Log file: $LogFile" | Tee-Object -FilePath $LogFile -Append
      "=" * 80 | Tee-Object -FilePath $LogFile -Append

      if ($global:ErrorCount -gt 0) {
          Write-Warning "⚠️ $global:ErrorCount error(s) occurred during VM cloning. See log for details."
          exit 1
      } else {
          Write-Host "✅ All VM cloning tasks completed successfully."
      }