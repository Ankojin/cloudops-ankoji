# ------------------- VM Cloning Pipeline from CSV -------------------

variables:
- group: AZ-Resources
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: targetSubscriptionName
    displayName: 'Target Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_SIT'
  - name: resourceGroupName
    displayName: 'Source Resource Group'
    type: string
    default: 'my-source-rg'
  - name: targetResourceGroupName
    displayName: 'Target Resource Group'
    type: string
    default: 'my-target-rg'

trigger: none

pool:
  name: cloudops-agent

steps:
# ------------------- Azure CLI Login -------------------
- task: PowerShell@2
  displayName: 'Azure CLI Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "" | Out-File -FilePath $LogFile -Encoding utf8

      # Source Subscription
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid source subscription"; exit 1 }
      }

      # Target Subscription
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
          default { Write-Error "Invalid target subscription"; exit 1 }
      }

      az login --service-principal `
          -u $env:AZURE_CLIENT_ID `
          -p $env:AZURE_CLIENT_SECRET `
          --tenant $env:AZURE_TENANT_ID | Tee-Object -FilePath $LogFile -Append
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure CLI login failed"
          exit 1
      }
      az account set --subscription $srcSub | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] Azure CLI login successful. Source subscription: $srcSub, Target subscription: $tgtSub" | Tee-Object -FilePath $LogFile -Append
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

# ------------------- Clone VMs from CSV -------------------
- task: PowerShell@2
  displayName: 'Clone VMs in Parallel with Summary'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      if (-not (Test-Path "C:\vm-to-clone")) { New-Item -Path "C:\vm-to-clone" -ItemType Directory | Out-Null }
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      $LogFile = "C:\log\clone_log.txt"
      $CsvFile = "C:\vm-to-clone\vm_clone_summary.csv"
      $vmInputCsv = "C:\vm-to-clone\vm-to-clone.csv"
      "" | Out-File -FilePath $CsvFile -Encoding UTF8

      # Import VM list from CSV
      if (Test-Path $vmInputCsv) {
          Write-Host "Importing VM definitions from CSV: $vmInputCsv"
          # Remove StaticIp from header and import
          $vmList = Import-Csv -Path $vmInputCsv | Select-Object SourceVMName,NewVMName,SubnetName,VMSize
      } else {
          throw "CSV file with VM definitions not found at $vmInputCsv. Please provide the file."
      }

      # Select target environment variables
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' {
              $vnetName = '$(DEV_VNETName)'
              $vnetRg = '$(DEV_VNETRG)'
              $nsgName = '$(DEV_NSGName)'
              $nsgRg = '$(DEV_NSGRG)'
              $bootDiagStorage = '$(DEV_BootDiagStorage)'
          }
          'BAB_SIT' {
              $vnetName = '$(SIT_VNETName)'
              $vnetRg = '$(SIT_VNETRG)'
              $nsgName = '$(SIT_NSGName)'
              $nsgRg = '$(SIT_NSGRG)'
              $bootDiagStorage = '$(SIT_BootDiagStorage)'
          }
          'BAB_CORE' {
              $vnetName = '$(CORE_VNETName)'
              $vnetRg = '$(CORE_VNETRG)'
              $nsgName = '$(CORE_NSGName)'
              $nsgRg = '$(CORE_NSGRG)'
              $bootDiagStorage = '$(CORE_BootDiagStorage)'
          }
          default { throw "Invalid target subscription" }
      }

      # Get subscriptions from variable group
      switch ('${{ parameters.subscriptionName }}') {
          'BAB_DEV' { $srcSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $srcSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $srcSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
      }
      switch ('${{ parameters.targetSubscriptionName }}') {
          'BAB_DEV' { $tgtSub = '$(BAB_DEV_SUBSCRIPTION_ID)' }
          'BAB_SIT' { $tgtSub = '$(BAB_SIT_SUBSCRIPTION_ID)' }
          'BAB_CORE' { $tgtSub = '$(BAB_CORE_SUBSCRIPTION_ID)' }
      }

      $ThrottleLimit = 4  # Adjust number of parallel VMs

      $vmList | ForEach-Object -Parallel {
          try {
              "[$(Get-Date -Format o)] Starting clone: $($PSItem.SourceVMName) -> $($PSItem.NewVMName)" | Tee-Object -FilePath $using:LogFile -Append

              # Validate required fields
              if (-not $PSItem.SourceVMName -or -not $PSItem.NewVMName -or -not $PSItem.SubnetName -or -not $PSItem.VMSize) {
                  "[$(Get-Date -Format o)] ❌ Stopping pipeline: Missing required fields for VM: $($PSItem | ConvertTo-Json -Compress)" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to missing required fields"
              }

              # ------------------- OS Disk -------------------
              az account set --subscription $using:srcSub
              try {
                  $osDiskId = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.osDisk.managedDisk.id" -o tsv
                  $osType = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.osDisk.osType" -o tsv
                  $dataDiskIds = az vm show -g '${{ parameters.resourceGroupName }}' -n $($PSItem.SourceVMName) --query "storageProfile.dataDisks[].managedDisk.id" -o tsv
                  $dataDiskIds = @($dataDiskIds)
              } catch {
                  "[$(Get-Date -Format o)] ❌ Failed to get disk info for $($PSItem.SourceVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to disk info failure"
              }

              az account set --subscription $using:tgtSub
              try {
                  $location = az group show -n '${{ parameters.targetResourceGroupName }}' --query location -o tsv
              } catch {
                  "[$(Get-Date -Format o)] ❌ Failed to get location for RG ${{ parameters.targetResourceGroupName }}: $_" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to location fetch failure"
              }

              # --- OS snapshot: use latest if exists
              try {
                  $existingOsSnap = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name, '$($PSItem.NewVMName)-os-snap')]|sort_by(@,&creationData.sourceResourceId)[-1].id" -o tsv
                  if ($existingOsSnap) { $osSnapId = $existingOsSnap }
                  else {
                      $osSnap = "$($PSItem.NewVMName)-os-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                      $osSnapId = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $osSnap --source $osDiskId --location $location --sku Standard_LRS --query id -o tsv
                      if (-not $osSnapId) { throw "OS snapshot creation failed" }
                  }
              } catch {
                  "[$(Get-Date -Format o)] ❌ Failed to create or find OS snapshot for $($PSItem.NewVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to OS snapshot failure"
              }

              # --- OS Disk: use existing if available
              try {
                  $osDiskName = "$($PSItem.NewVMName)-osdisk"
                  $existingOsDisk = az disk list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$osDiskName'].id" -o tsv
                  $osDiskIdNew = if ($existingOsDisk) { $existingOsDisk } else {
                      $diskId = az disk create -g '${{ parameters.targetResourceGroupName }}' -n $osDiskName --source $osSnapId --location $location --query id -o tsv
                      if (-not $diskId) { throw "OS disk creation failed" } else { $diskId }
                  }
              } catch {
                  "[$(Get-Date -Format o)] ❌ Failed to create or find OS disk for $($PSItem.NewVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to OS disk failure"
              }

              # ------------------- Data Disks -------------------
              $newDataDisksFinal = @()
              $lun = 0
              try {
                  if ($dataDiskIds -and $dataDiskIds[0]) {
                      foreach ($dd in $dataDiskIds) {
                          $existingDataSnap = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name,'$($PSItem.NewVMName)-data$lun-snap')]|sort_by(@,&creationData.sourceResourceId)[-1].id" -o tsv
                          $dataSnapId = if ($existingDataSnap) { $existingDataSnap } else {
                              $snapName = "$($PSItem.NewVMName)-data$lun-snap-$(Get-Date -Format 'yyyyMMddHHmmss')"
                              $id = az snapshot create -g '${{ parameters.targetResourceGroupName }}' -n $snapName --source $dd --location $location --sku Standard_LRS --query id -o tsv
                              if (-not $id) { throw "Data snapshot failed for LUN $lun" } else { $id }
                          }

                          $dataDiskName = "$($PSItem.NewVMName)-data$lun-disk"
                          $existingDataDisk = az disk list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$dataDiskName'].id" -o tsv
                          $dataDiskIdNew = if ($existingDataDisk) { $existingDataDisk } else {
                              $id = az disk create -g '${{ parameters.targetResourceGroupName }}' -n $dataDiskName --source $dataSnapId --location $location --query id -o tsv
                              if (-not $id) { throw "Data disk creation failed for LUN $lun" } else { $id }
                          }

                          $newDataDisksFinal += [PSCustomObject]@{Id=$dataDiskIdNew; Lun=$lun}
                          $lun++
                      }
                  }
              } catch {
                  "[$(Get-Date -Format o)] ❌ Failed to create/find data disk or snapshot for $($PSItem.NewVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to data disk/snapshot failure"
              }

              # ------------------- NIC -------------------
              try {
                  $nicName = "$($PSItem.NewVMName)-nic"
                  $existingNic = az network nic list -g '${{ parameters.targetResourceGroupName }}' --query "[?name=='$nicName'].id" -o tsv

                  "[$(Get-Date -Format o)] Checking for NIC: $nicName in RG: ${{ parameters.targetResourceGroupName }}" | Tee-Object -FilePath $using:LogFile -Append

                  if ($existingNic) {
                      $nicId = $existingNic
                      "[$(Get-Date -Format o)] NIC already exists for $($PSItem.NewVMName): $nicId. Will use existing NIC." | Tee-Object -FilePath $using:LogFile -Append
                  } else {
                      $subnetId = az network vnet subnet show -g $using:vnetRg --vnet-name $using:vnetName -n $($PSItem.SubnetName) --query id -o tsv
                      $nsgId = az network nsg show -g $using:nsgRg -n $using:nsgName --query id -o tsv

                      # Log all NIC parameters for troubleshooting
                      "[$(Get-Date -Format o)] NIC creation params for $($PSItem.NewVMName): SubnetId='$subnetId', NSGId='$nsgId', SubnetName='$($PSItem.SubnetName)'" | Tee-Object -FilePath $using:LogFile -Append

                      if (-not $subnetId) {
                          "[$(Get-Date -Format o)] ❌ ERROR: SubnetId is empty for $($PSItem.NewVMName). SubnetName='$($PSItem.SubnetName)'" | Tee-Object -FilePath $using:LogFile -Append
                          throw "Stopping pipeline due to missing SubnetId for $($PSItem.NewVMName)"
                      }
                      if (-not $nsgId) {
                          "[$(Get-Date -Format o)] ❌ ERROR: NSGId is empty for $($PSItem.NewVMName). NSGName='$using:nsgName'" | Tee-Object -FilePath $using:LogFile -Append
                          throw "Stopping pipeline due to missing NSGId for $($PSItem.NewVMName)"
                      }
                      if (-not $PSItem.SubnetName) {
                          "[$(Get-Date -Format o)] ❌ ERROR: SubnetName is empty for $($PSItem.NewVMName)" | Tee-Object -FilePath $using:LogFile -Append
                          throw "Stopping pipeline due to missing SubnetName for $($PSItem.NewVMName)"
                      }

                      $nicCreateResult = az network nic create -g '${{ parameters.targetResourceGroupName }}' -n $nicName --subnet $subnetId --network-security-group $nsgId --query id -o tsv 2>&1
                      "[$(Get-Date -Format o)] az network nic create output: $nicCreateResult" | Tee-Object -FilePath $using:LogFile -Append
                      $nicId = $nicCreateResult.Trim()
                      if (-not $nicId -or $nicId -like "*ERROR*") { throw "NIC creation failed: $nicCreateResult" }
                      "[$(Get-Date -Format o)] Created NIC for $($PSItem.NewVMName): $nicId" | Tee-Object -FilePath $using:LogFile -Append
                  }

                  # Log the final NIC ID to be used for VM creation
                  "[$(Get-Date -Format o)] Using NIC ID for VM creation: $nicId" | Tee-Object -FilePath $using:LogFile -Append

                  # Check NIC provisioning state
                  $nicState = az network nic show --ids $nicId --query "provisioningState" -o tsv
                  "[$(Get-Date -Format o)] NIC provisioning state for $($PSItem.NewVMName): $nicState" | Tee-Object -FilePath $using:LogFile -Append
                  if ($nicState -ne "Succeeded") {
                      throw "NIC $nicId is not in Succeeded state, current state: $nicState"
                  }

                  if (-not $nicId) {
                      "[$(Get-Date -Format o)] ❌ ERROR: nicId is empty for $($PSItem.NewVMName)" | Tee-Object -FilePath $using:LogFile -Append
                      throw "Stopping pipeline due to empty nicId for $($PSItem.NewVMName)"
                  }
              } catch {
                  "[$(Get-Date -Format o)] ❌ Failed to create/find NIC for $($PSItem.NewVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to NIC failure"
              }

              # ------------------- VM -------------------
              try {
                  "[$(Get-Date -Format o)] About to create VM $($PSItem.NewVMName) with NIC ID: $nicId" | Tee-Object -FilePath $using:LogFile -Append
                  $vmCreate = az vm create -g '${{ parameters.targetResourceGroupName }}' -n $($PSItem.NewVMName) --nics $nicId --attach-os-disk $osDiskIdNew --os-type $osType --size $($PSItem.VMSize) --boot-diagnostics-storage "https://$using:bootDiagStorage.blob.core.windows.net/"
                  if (-not $?) { throw "VM creation failed" }
              } catch {
                  "[$(Get-Date -Format o)] ❌ Failed to create VM $($PSItem.NewVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to VM creation failure"
              }

              # Attach data disks
              try {
                  foreach ($disk in $newDataDisksFinal) {
                      az vm disk attach -g '${{ parameters.targetResourceGroupName }}' --vm-name $($PSItem.NewVMName) --name $disk.Id --lun $disk.Lun
                  }
              } catch {
                  "[$(Get-Date -Format o)] ❌ Failed to attach data disks to $($PSItem.NewVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
                  throw "Stopping pipeline due to disk attach failure"
              }

              foreach ($disk in $newDataDisksFinal) {
                  "$($PSItem.NewVMName),$($PSItem.SourceVMName),$($PSItem.SubnetName),$($PSItem.VMSize),$($disk.Id),$($disk.Lun)" | Out-File -FilePath $using:CsvFile -Append
              }

              # ------------------- Cleanup: Delete Snapshots -------------------
              try {
                  # Delete OS snapshot
                  if ($osSnapId) {
                      az snapshot delete --ids $osSnapId
                      "[$(Get-Date -Format o)] Deleted OS snapshot: $osSnapId" | Tee-Object -FilePath $using:LogFile -Append
                  }
                  # Delete Data disk snapshots
                  $lun = 0
                  if ($dataDiskIds -and $dataDiskIds[0]) {
                      foreach ($dd in $dataDiskIds) {
                          $dataSnapName = "$($PSItem.NewVMName)-data$lun-snap"
                          $dataSnapId = az snapshot list -g '${{ parameters.targetResourceGroupName }}' --query "[?contains(name, '$dataSnapName')].id" -o tsv
                          if ($dataSnapId) {
                              az snapshot delete --ids $dataSnapId
                              "[$(Get-Date -Format o)] Deleted Data snapshot: $dataSnapId" | Tee-Object -FilePath $using:LogFile -Append
                          }
                          $lun++
                      }
                  }
              } catch {
                  "[$(Get-Date -Format o)] ⚠️ Snapshot cleanup failed: $_" | Tee-Object -FilePath $using:LogFile -Append
              }

              "[$(Get-Date -Format o)] VM clone completed: $($PSItem.NewVMName)" | Tee-Object -FilePath $using:LogFile -Append
          } catch {
              "[$(Get-Date -Format o)] ❌ Failed cloning $($PSItem.SourceVMName): $_" | Tee-Object -FilePath $using:LogFile -Append
              throw "Stopping pipeline due to failure"
          }
      } -ThrottleLimit $ThrottleLimit

# ------------------- Final Summary Table -------------------
- task: PowerShell@2
  displayName: 'Generate Final Summary Table'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\clone_log.txt"
      $CsvFile = "C:\vm-to-clone\vm_clone_summary.csv"

      "[$(Get-Date -Format o)] 🎉 All VM cloning tasks completed. Generating summary table..." | Tee-Object -FilePath $LogFile -Append

      if (Test-Path $CsvFile) {
          $summary = Import-Csv $CsvFile -Header "NewVM","SourceVM","Subnet","Size","DiskId","LUN"
          $grouped = $summary | Group-Object -Property NewVM
          foreach ($vmGroup in $grouped) {
              $vmName = $vmGroup.Name
              $sourceVM = ($vmGroup.Group | Select-Object -First 1).SourceVM
              $ip = ($vmGroup.Group | Select-Object -First 1).IP
              $subnet = ($vmGroup.Group | Select-Object -First 1).Subnet
              $size = ($vmGroup.Group | Select-Object -First 1).Size
              "-------------------------------------------------------------" | Tee-Object -FilePath $LogFile -Append
              "VM Name: $vmName" | Tee-Object -FilePath $LogFile -Append
              "Source VM: $sourceVM" | Tee-Object -FilePath $LogFile -Append
              "IP: $ip" | Tee-Object -FilePath $LogFile -Append
              "Subnet: $subnet" | Tee-Object -FilePath $LogFile -Append
              "Size: $size" | Tee-Object -FilePath $LogFile -Append
              "Disks and LUNs:" | Tee-Object -FilePath $LogFile -Append
              foreach ($disk in $vmGroup.Group) {
                  "  DiskID: $($disk.DiskId) | LUN: $($disk.LUN)" | Tee-Object -FilePath $LogFile -Append
              }
          }
          "-------------------------------------------------------------" | Tee-Object -FilePath $LogFile -Append
          "Summary CSV: $CsvFile" | Tee-Object -FilePath $LogFile -Append
      } else {
          "No CSV file found. Summary not generated." | Tee-Object -FilePath $LogFile -Append
      }

      "[$(Get-Date -Format o)] ✅ Pipeline completed." | Tee-Object -FilePath $LogFile -Append

# ------------------- Publish Summary as Artifact -------------------
- task: PublishBuildArtifacts@1
  displayName: 'Publish VM Clone Summary Artifact'
  inputs:
    PathtoPublish: 'C:\vm-to-clone\vm_clone_summary.csv'
    ArtifactName: 'VMCloneSummary'
    publishLocation: 'Container'