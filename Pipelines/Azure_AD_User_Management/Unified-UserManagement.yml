trigger: none

variables:
- group: cloud-subs
- name: AVDGroup
  value: 'BAB_VDI_DT_Shared_Pool'
- name: defaultServiceAccountGroup
  value: 'ALBTests service accounts'
- name: logPath
  value: 'C:\log'
- name: logFileName
  value: 'user_management_log.txt'

parameters:
- name: operationType
  displayName: 'Select Operation Type'
  type: string
  values:
  - 'Create Service Account (GUI Input)'
  - 'Create Normal AVD Users and Add to Hardcoded Group'
  - 'Add Existing Admin Studio Users to Admin Studio Groups'
  - 'Create New ABIC Users and Add to ABIC Groups'
  - 'Add Existing ABIC Users to ABIC Groups'
  default: 'Create Service Account (GUI Input)'

# Parameters for Service Account Creation (GUI Input)
- name: serviceAccountUPN
  displayName: '[Service Account] UPN (e.g., svc-account@contoso.com)'
  type: string
  default: ''

- name: serviceAccountDisplayName
  displayName: '[Service Account] Display Name'
  type: string
  default: ''

- name: serviceAccountPassword
  displayName: '[Service Account] Password (min 8 chars, complexity required)'
  type: string
  default: ''

- name: serviceAccountGroup
  displayName: '[Service Account] Group Name'
  type: string
  default: 'ALBTests service accounts'

# Parameters for CSV-based operations
- name: csvFilePath
  displayName: '[CSV Operations] CSV File Path'
  type: string
  default: 'Pipelines/Azure_AD_User_Management/users.csv'

pool:
  name: cloudops-agent

steps:
- task: PowerShell@2
  displayName: 'Validate Inputs and Environment'
  inputs:
    targetType: 'inline'
    pwsh: true
    errorActionPreference: 'stop'
    script: |
      $ErrorActionPreference = 'Stop'
      $operationType = "${{ parameters.operationType }}"
      
      Write-Host "========================================" -ForegroundColor Cyan
      Write-Host "Azure AD User Management - Input Validation" -ForegroundColor Cyan
      Write-Host "========================================" -ForegroundColor Cyan
      Write-Host "Operation: $operationType" -ForegroundColor Cyan
      
      # Validate environment variables
      if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_ID)) {
        Write-Error "AZURE_CLIENT_ID environment variable is not set"
        exit 1
      }
      if ([string]::IsNullOrWhiteSpace($env:AZURE_CLIENT_SECRET)) {
        Write-Error "AZURE_CLIENT_SECRET environment variable is not set"
        exit 1
      }
      if ([string]::IsNullOrWhiteSpace($env:AZURE_TENANT_ID)) {
        Write-Error "AZURE_TENANT_ID environment variable is not set"
        exit 1
      }
      
      Write-Host "Environment variables validated" -ForegroundColor Green
      
      if ($operationType -eq "Create Service Account (GUI Input)") {
        $upn = "${{ parameters.serviceAccountUPN }}"
        $displayName = "${{ parameters.serviceAccountDisplayName }}"
        $password = "${{ parameters.serviceAccountPassword }}"
        $group = "${{ parameters.serviceAccountGroup }}"
        
        # Validate required parameters
        if ([string]::IsNullOrWhiteSpace($upn)) {
          Write-Error "Service Account UPN is required"
          exit 1
        }
        if ([string]::IsNullOrWhiteSpace($displayName)) {
          Write-Error "Service Account Display Name is required"
          exit 1
        }
        if ([string]::IsNullOrWhiteSpace($password)) {
          Write-Error "Service Account Password is required"
          exit 1
        }
        
        # Validate UPN format
        if ($upn -notmatch '^[\w\.-]+@[\w\.-]+\.\w+$') {
          Write-Error "Invalid UPN format: $upn"
          exit 1
        }
        
        # Validate password complexity
        if ($password.Length -lt 8) {
          Write-Error "Password must be at least 8 characters long"
          exit 1
        }
        if ($password -notmatch '[A-Z]') {
          Write-Error "Password must contain at least one uppercase letter"
          exit 1
        }
        if ($password -notmatch '[a-z]') {
          Write-Error "Password must contain at least one lowercase letter"
          exit 1
        }
        if ($password -notmatch '[0-9]') {
          Write-Error "Password must contain at least one number"
          exit 1
        }
        if ($password -notmatch '[!@#$%^&*(),.?":{}|<>]') {
          Write-Error "Password must contain at least one special character"
          exit 1
        }
        
        Write-Host "Service Account UPN: $upn" -ForegroundColor Green
        Write-Host "Display Name: $displayName" -ForegroundColor Green
        Write-Host "Target Group: $group" -ForegroundColor Green
        Write-Host "Password complexity validated" -ForegroundColor Green
      } else {
        $csvPath = "$(Build.SourcesDirectory)/${{ parameters.csvFilePath }}"
        
        if (-not (Test-Path $csvPath)) {
          Write-Error "CSV file not found: $csvPath"
          exit 1
        }
        
        try {
          $data = Import-Csv -Path $csvPath -ErrorAction Stop
          if ($data.Count -eq 0) {
            Write-Error "CSV file is empty"
            exit 1
          }
        } catch {
          Write-Error "Failed to parse CSV file: $_"
          exit 1
        }
        
        Write-Host "CSV File: $csvPath" -ForegroundColor Green
        Write-Host "Found $($data.Count) records in CSV" -ForegroundColor Green
        
        # Display expected CSV format
        switch ($operationType) {
          "Create Normal AVD Users and Add to Hardcoded Group" {
            Write-Host "Expected Columns: DisplayName, UserPrincipalName, Password" -ForegroundColor Yellow
            Write-Host "Target Group: $(hardcodedAVDGroup)" -ForegroundColor Yellow
          }
          "Add Existing Admin Studio Users to Admin Studio Groups" {
            Write-Host "Expected Columns: UserPrincipalName, GroupName" -ForegroundColor Yellow
          }
          "Create New ABIC Users and Add to ABIC Groups" {
            Write-Host "Expected Columns: DisplayName, UserPrincipalName, Password, GroupName" -ForegroundColor Yellow
          }
          "Add Existing ABIC Users to ABIC Groups" {
            Write-Host "Expected Columns: UserPrincipalName, GroupName" -ForegroundColor Yellow
          }
        }
      }
      
      Write-Host "All validations passed successfully!" -ForegroundColor Green
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

- task: PowerShell@2
  displayName: 'Execute Azure AD Operation'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)/Pipelines/Azure_AD_User_Management/Execute-UserManagement.ps1'
    arguments: >
      -OperationType "${{ parameters.operationType }}"
      -ServiceAccountUPN "${{ parameters.serviceAccountUPN }}"
      -ServiceAccountDisplayName "${{ parameters.serviceAccountDisplayName }}"
      -ServiceAccountPassword "${{ parameters.serviceAccountPassword }}"
      -ServiceAccountGroup "${{ parameters.serviceAccountGroup }}"
      -CsvFilePath "$(Build.SourcesDirectory)/${{ parameters.csvFilePath }}"
      -HardcodedAVDGroup "$(hardcodedAVDGroup)"
      -LogPath "$(logPath)"
      -LogFileName "$(logFileName)"
    pwsh: true
    errorActionPreference: 'stop'
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

- task: PublishBuildArtifacts@1
  displayName: 'Publish Logs'
  condition: always()
  inputs:
    PathtoPublish: '$(logPath)\$(logFileName)'
    ArtifactName: 'UserManagementLogs-$(Build.BuildNumber)'
    publishLocation: 'Container'