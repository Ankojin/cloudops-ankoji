trigger: none

pool:
  name: cloudops-agent

variables:
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Azure Subscription (type BAB_DEV or BAB_SIT)'
    type: string
    default: 'BAB_DEV'
    values:
      - BAB_DEV
      - BAB_SIT

  - name: logicAppPrefix
    displayName: 'Logic App Prefix (AppName_Env, e.g., ststv2_AppName_Env)'
    type: string
    default: 'ststv2_AppName_Env'

  - name: DB_ResourceGroup
    displayName: 'DB Resource Group (enter name or leave blank/enter none to skip)'
    type: string
    default: 'ResourceGroupNameHere'

  - name: DB_VMNames
    displayName: 'DB VM Names (comma-separated, enter as VMName1,VMName2 or leave blank/enter none to skip)'
    type: string
    default: 'VMName1,VMName2'

  - name: APPWEB_ResourceGroup
    displayName: 'App/Web Resource Group (enter name or leave blank/enter none to skip)'
    type: string
    default: 'ResourceGroupNameHere'

  - name: APPWEB_VMNames
    displayName: 'App/Web VM Names (comma-separated, enter as VMName1,VMName2 or leave blank/enter none to skip)'
    type: string
    default: 'VMName1,VMName2'

steps:
- powershell: |
    $ErrorActionPreference = "Stop"
     "[$(Get-Date -Format o)] Logging into Azure CLI with service principal..."
      if ('${{ parameters.subscriptionName }}' -eq 'BAB_DEV') {
        $subscriptionId = $env:BAB_DEV_SUBSCRIPTION_ID
      } elseif ('${{ parameters.subscriptionName }}' -eq 'BAB_SIT') {
        $subscriptionId = $env:BAB_SIT_SUBSCRIPTION_ID
      } else {
        "[$(Get-Date -Format o)] Invalid subscription: ${{ parameters.subscriptionName }}" 
        Write-Error "Invalid subscription: ${{ parameters.subscriptionName }}"
        exit 1
      }
    az login --service-principal `
        -u $env:AZURE_CLIENT_ID `
        -p $env:AZURE_CLIENT_SECRET `
        --tenant $env:AZURE_TENANT_ID
    az account set --subscription $subscriptionId
    Write-Host "[$(Get-Date -Format o)] Azure CLI login successful. Using subscription $subscriptionId"
  displayName: 'Azure CLI Login'
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

- ${{ if and(ne(parameters.DB_VMNames, ''), ne(parameters.DB_VMNames, 'none'), ne(parameters.DB_ResourceGroup, ''), ne(parameters.DB_ResourceGroup, 'none')) }}:
  - task: PowerShell@2
    displayName: 'Deploy DB Logic App (Start/Stop)'
    inputs:
      targetType: 'filePath'
      filePath: 'Pipelines/logicapps/Deploy-LogicApp.ps1'
      arguments: >
        -SubscriptionId "$subscriptionId"
        -ResourceGroupName $(LOGICAPP_RG)
        -LogicAppName "${{ parameters.logicAppPrefix }}_vms_Scheduled_db"
        -Location $(LOCATION)
        -DefinitionFile 'Pipelines/logicapps/logicapp-startstop.json'
        -VMResourceGroup "${{ parameters.DB_ResourceGroup }}"
        -VMNames "${{ parameters.DB_VMNames }}"
        -StartHour 7
        -StartMinute 45
        -StopHour 19
        -StopMinute 0

- ${{ if and(ne(parameters.APPWEB_VMNames, ''), ne(parameters.APPWEB_VMNames, 'none'), ne(parameters.APPWEB_ResourceGroup, ''), ne(parameters.APPWEB_ResourceGroup, 'none')) }}:
  - task: PowerShell@2
    displayName: 'Deploy App/Web Logic App (Start/Stop)'
    inputs:
      targetType: 'filePath'
      filePath: 'Pipelines/logicapps/Deploy-LogicApp.ps1'
      arguments: >
        -SubscriptionName "$subscriptionId"
        -ResourceGroupName $(LOGICAPP_RG)
        -LogicAppName "${{ parameters.logicAppPrefix }}_vms_Scheduled_appweb"
        -Location $(LOCATION)
        -DefinitionFile 'Pipelines/logicapps/logicapp-startstop.json'
        -VMResourceGroup "${{ parameters.APPWEB_ResourceGroup }}"
        -VMNames "${{ parameters.APPWEB_VMNames }}"
        -StartHour 8
        -StartMinute 0
        -StopHour 19
        -StopMinute 15