trigger: none

pool:
  name: cloudops-agent

variables:
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Azure Subscription'
    type: string
    default: 'BAB_DEV'
    values:
      - BAB_DEV
      - BAB_SIT

  - name: logicAppPrefix
    displayName: 'Logic App Prefix (e.g., ststv2_AppName_Env)'
    type: string
    default: 'ststv2_AppName_Env'

  # DB Logic App parameters
  - name: dbResourceGroup
    displayName: 'Database Resource Group'
    type: string
    default: ''

  - name: dbVmNames
    displayName: 'Database VM Names (comma-separated, e.g., VM1,VM2)'
    type: string
    default: ''

  - name: dbStartHour
    displayName: 'DB Start Hour (0-23)'
    type: number
    default: 7

  - name: dbStartMinute
    displayName: 'DB Start Minute (0-59)'
    type: number
    default: 0

  # App/Web Logic App parameters
  - name: appWebResourceGroup
    displayName: 'App/Web Resource Group'
    type: string
    default: ''

  - name: appWebVmNames
    displayName: 'App/Web VM Names (comma-separated, e.g., VM1,VM2)'
    type: string
    default: ''

  - name: appWebStartHour
    displayName: 'App/Web Start Hour (0-23)'
    type: number
    default: 8

  - name: appWebStartMinute
    displayName: 'App/Web Start Minute (0-59)'
    type: number
    default: 0

  # Logic App Subscription (dropdown)
  - name: logicAppSubscription
    displayName: 'Logic App Subscription'
    type: string
    default: 'BAB_CORE'
    values:
      - BAB_CORE

steps:
- powershell: |
    $ErrorActionPreference = "Stop"
    $subscriptionId = $env:BAB_CORE_SUBSCRIPTION_ID
    az login --service-principal `
        -u $env:AZURE_CLIENT_ID `
        -p $env:AZURE_CLIENT_SECRET `
        --tenant $env:AZURE_TENANT_ID
    az account set --subscription $subscriptionId
    Write-Host "[$(Get-Date -Format o)] Azure CLI login successful. Using subscription $subscriptionId"
    Write-Host "##vso[task.setvariable variable=resolvedSubscriptionId]$subscriptionId"
  displayName: 'Azure CLI Login (Always BAB_CORE)'
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)
    BAB_CORE_SUBSCRIPTION_ID: $(BAB_CORE_SUBSCRIPTION_ID)

- powershell: |
    $ErrorActionPreference = "Stop"
    if ("${{ parameters.subscriptionName }}" -eq "BAB_DEV") {
      Write-Host "##vso[task.setvariable variable=vmSubscriptionId]$env:BAB_DEV_SUBSCRIPTION_ID"
    } elseif ("${{ parameters.subscriptionName }}" -eq "BAB_SIT") {
      Write-Host "##vso[task.setvariable variable=vmSubscriptionId]$env:BAB_SIT_SUBSCRIPTION_ID"
    } else {
      Write-Error "Invalid subscription: ${{ parameters.subscriptionName }}"
      exit 1
    }
  displayName: 'Set VM Subscription ID'
  env:
    BAB_DEV_SUBSCRIPTION_ID: $(BAB_DEV_SUBSCRIPTION_ID)
    BAB_SIT_SUBSCRIPTION_ID: $(BAB_SIT_SUBSCRIPTION_ID)

- ${{ if and(ne(parameters.dbVmNames, ''), ne(parameters.dbVmNames, 'none'), ne(parameters.dbResourceGroup, ''), ne(parameters.dbResourceGroup, 'none')) }}:
  - task: PowerShell@2
    displayName: 'Deploy Database Logic App (Start Only)'
    inputs:
      targetType: 'filePath'
      filePath: 'Pipelines/logicapps/Deploy-LogicApp_start.ps1'
      arguments: >
        -SubscriptionId "$(resolvedSubscriptionId)"
        -ResourceGroupName "bab-core-auto-weeu-rg-01"
        -LogicAppName "${{ parameters.logicAppPrefix }}_vms_Scheduled_db"
        -DefinitionFile 'Pipelines/logicapps/logicapp_start.json'
        -VMResourceGroup "${{ parameters.dbResourceGroup }}"
        -VMNames "${{ parameters.dbVmNames }}"
        -VMSubscriptionId "$(vmSubscriptionId)"
        -StartHour ${{ parameters.dbStartHour }}
        -StartMinute ${{ parameters.dbStartMinute }}

- ${{ if and(ne(parameters.appWebVmNames, ''), ne(parameters.appWebVmNames, 'none'), ne(parameters.appWebResourceGroup, ''), ne(parameters.appWebResourceGroup, 'none')) }}:
  - task: PowerShell@2
    displayName: 'Deploy App/Web Logic App (Start Only)'
    inputs:
      targetType: 'filePath'
      filePath: 'Pipelines/logicapps/Deploy-LogicApp_start.ps1'
      arguments: >
        -SubscriptionId "$(resolvedSubscriptionId)"
        -ResourceGroupName "bab-core-auto-weeu-rg-01"
        -LogicAppName "${{ parameters.logicAppPrefix }}_vms_Scheduled_appweb"
        -DefinitionFile 'Pipelines/logicapps/logicapp_start.json'
        -VMResourceGroup "${{ parameters.appWebResourceGroup }}"
        -VMNames "${{ parameters.appWebVmNames }}"
        -VMSubscriptionId "$(vmSubscriptionId)"
        -StartHour ${{ parameters.appWebStartHour }}
        -StartMinute ${{ parameters.appWebStartMinute }}