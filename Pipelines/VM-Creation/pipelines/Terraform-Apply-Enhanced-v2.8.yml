trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    type: string
    default: apply
    values: [apply, modify]

  - name: environment
    type: string
    default: DEV
    values: [DEV, SIT]

  - name: project
    type: string
    default: pilot-test

  - name: tags_json_override
    type: string
    default: '{"Company":"BAB","Department":"Information Technology","ProjectName":"pilot-test","ApplicationName":"pilot-test","Region":"Sweden Central","ApproverName":"pilot-test","RequesterName":"CloudOps Team","BusinessOwner":"pilot-test","TechnicalOwner":"pilot-test","CostCenter":"pilot-test","ServiceClass":"pilot-test","ManagedBy":"CloudOps Team"}'


variables:
  - name: tfWorkingDirectory
    value: '$(Build.SourcesDirectory)\Pipelines\VM-Creation'

  - name: tfRepoDirectory
    value: '$(Build.SourcesDirectory)\Pipelines\VM-Creation\Project\${{ parameters.project }}\tf'

  - name: tfStateDirectory
    value: 'C:\TerraformState\Project'

  - group: TerraformVariables

  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV

  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT

  - name: pythonVersion
    value: "3.9"


# ========================================================================
#   SINGLE-STAGE PIPELINE — PLAN + APPLY (Option A)
# ========================================================================
stages:
- stage: TerraformPlanAndApply
  displayName: "Terraform v2.8 — PLAN + APPLY"

  jobs:
  - job: TerraformJob
    displayName: "Terraform Job"
    pool:
      name: cloudops-agent

    steps:

    # Setup Python
    - task: UsePythonVersion@0
      displayName: "Setup Python $(pythonVersion)"
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'

    # ----------------------------------------------------
    # Set required environment variables for Python + TF
    # ----------------------------------------------------
    - task: PowerShell@2
      displayName: "Set Environment Variables"
      inputs:
        targetType: inline
        script: |
          $env:PROJECT_NAME     = "${{ parameters.project }}"
          $env:ENVIRONMENT      = "${{ parameters.environment }}"

          # Export VNet, KV, DCR, Diagnostics, SAS input variables
          $env:SUBSCRIPTION_ID = "$(subscription_id)"
          $env:LOCATION = "$(location)"
          $env:VNET_NAME = "$(vnet_name)"
          $env:VNET_RG = "$(vnet_rg)"
          $env:SUBNET_RG = "$(subnet_rg)"
          $env:KEYVAULT_NAME = "$(keyvault_name)"
          $env:KEYVAULT_RG = "$(keyvault_rg)"
          $env:DCR_NAME = "$(dcr_name)"
          $env:DCR_RG = "$(dcr_rg)"
          $env:DIAGNOSTICS_STORAGE = "$(diagnostics_storage)"
          $env:DIAGNOSTICS_STORAGE_RG = "$(diagnostics_storage_rg)"
          $env:SCRIPT_STORAGE_ACCOUNT = "$(script_storage_account)"
          $env:SCRIPT_STORAGE_CONTAINER = "$(script_storage_container)"
          $env:SCRIPT_BLOB_NAME_WINDOWS = "$(script_blob_name_windows)"
          $env:SCRIPT_BLOB_NAME_LINUX   = "$(script_blob_name_linux)"
          $env:SCRIPT_STORAGE_KEY        = "$(script_storage_key)"

          $env:shutdown_enabled = "$(shutdown_enabled)"
          $env:shutdown_time = "$(shutdown_time)"
          $env:shutdown_timezone = "$(shutdown_timezone)"

          # TAGS
          $env:DEFAULT_TAGS_JSON = '${{ parameters.tags_json_override }}'

          # Prepare state directory
          $tfState = "$(tfStateDirectory)\$($env:PROJECT_NAME)\$($env:ENVIRONMENT)"
          if (!(Test-Path $tfState)) { New-Item -Path $tfState -ItemType Directory -Force }
          Write-Host "TF STATE PATH = $tfState"

    # --------------------------
    # Azure Login
    # --------------------------
    - task: PowerShell@2
      displayName: "Azure Login"
      inputs:
        targetType: inline
        script: |
          az login --service-principal `
            -u "$(ARM_CLIENT_ID)" `
            -p "$(ARM_CLIENT_SECRET)" `
            --tenant "$(ARM_TENANT_ID)"

    # --------------------------
    # SAS TOKEN GENERATION
    # --------------------------
    - task: PowerShell@2
      displayName: "Generate SAS URLs"
      inputs:
        targetType: inline
        script: |
          $account   = "$(script_storage_account)"
          $container = "$(script_storage_container)"
          $key       = "$(script_storage_key)"
          $expiry    = (Get-Date).AddHours(24).ToString("yyyy-MM-ddTHH:mmZ")

          $env:AZURE_STORAGE_KEY = $key

          function Make-SafeSas {
            param([string]$Blob)
            if (-not $Blob) { return $null }
            $sas = az storage blob generate-sas `
              --account-name $account `
              --container-name $container `
              --name $Blob `
              --permissions r `
              --expiry $expiry `
              --auth-mode key `
              --https-only -o tsv
            if (!$sas) { return $null }
            return "https://$account.blob.core.windows.net/$container/$Blob?$sas"
          }

          $sasWin   = Make-SafeSas "$(script_blob_name_windows)"
          $sasLinux = Make-SafeSas "$(script_blob_name_linux)"

          if ($sasWin)   { Write-Host "##vso[task.setvariable variable=SAS_URL_WINDOWS;issecret=true]$sasWin" }
          if ($sasLinux) { Write-Host "##vso[task.setvariable variable=SAS_URL_LINUX;issecret=true]$sasLinux" }

    # --------------------------
    # Run Python Generator v2.8
    # --------------------------
    - task: PowerShell@2
      displayName: "Run Python generator (v2.8)"
      inputs:
        targetType: inline
        script: |
          Set-Location "$(tfWorkingDirectory)"

          python "$(tfWorkingDirectory)\core\generate-tf-v2.8.py"
          if ($LASTEXITCODE -ne 0) { throw "Python failed" }

          # Copy the output .tf into REPO TF folder
          $repoTF = "$(tfRepoDirectory)"
          if (!(Test-Path $repoTF)) { New-Item -Path $repoTF -ItemType Directory -Force }

          Copy-Item "$(tfWorkingDirectory)\Project\${{ parameters.project }}\main-${{ parameters.environment }}.tf" `
                    "$repoTF\main-${{ parameters.environment }}.tf" -Force

          Write-Host "Copied generated TF file → $repoTF"

    # --------------------------
    # Copy TF → Persistent State
    # --------------------------
    - task: PowerShell@2
      displayName: "Copy TF file to TFSTATE directory"
      inputs:
        targetType: inline
        script: |
          $src = "$(tfRepoDirectory)\main-${{ parameters.environment }}.tf"
          $dst = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}"

          Copy-Item $src "$dst\main-${{ parameters.environment }}.tf" -Force
          Write-Host "Copied TF to agentState: $dst"

    # --------------------------
    # Terraform Validate + Plan
    # --------------------------
    - task: PowerShell@2
      displayName: "Terraform Plan"
      inputs:
        targetType: inline
        script: |
          $tfState = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}"

          Set-Location $tfState

          terraform init -input=false
          if ($LASTEXITCODE -ne 0) { throw "TF init failed" }

          terraform validate
          if ($LASTEXITCODE -ne 0) { throw "Terraform validate failed" }

          terraform plan -out "$tfState\tfplan"
          if ($LASTEXITCODE -ne 0) { throw "Plan failed" }

          terraform show "$tfState\tfplan" > "$tfState\tfplan.txt"
          Write-Host "PLAN generated successfully."

    # --------------------------
    # Modify Mode Summary
    # --------------------------
    - ${{ if eq(parameters.action, 'modify') }}:
      - task: PowerShell@2
        displayName: "Modify Mode: Diff Summary"
        inputs:
          targetType: inline
          script: |
            $planFile = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}\tfplan.txt"

            Write-Host "MODIFY SUMMARY:"
            Get-Content $planFile | Select-String "Plan:" -Context 2,2


    # --------------------------
    # Terraform Apply (with Backup + Retry)
    # --------------------------
    - task: PowerShell@2
      displayName: "Terraform Apply"
      inputs:
        targetType: inline
        script: |
          $tfState = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}"
          $stateFile = "$tfState\terraform.tfstate"
          $backupDir = "$tfState\backups"

          if (!(Test-Path $backupDir)) {
            New-Item -Path $backupDir -ItemType Directory -Force | Out-Null
          }

          # Backup tfstate
          if (Test-Path $stateFile) {
            Copy-Item $stateFile "$backupDir\terraform-$(Get-Date -Format 'yyyyMMdd-HHmmss').bak"
          }

          Set-Location $tfState

          terraform init -input=false

          # retry apply
          $max = 3
          for ($i=1; $i -le $max; $i++) {
            Write-Host "Attempt $i/$max: terraform apply..."
            terraform apply -auto-approve "$tfState\tfplan"
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep 10
          }

          if ($LASTEXITCODE -ne 0) { throw "Terraform apply failed after retries" }

          Write-Host "✔ APPLY SUCCESSFUL"