trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: "apply"
    values:
      - apply
      - modify
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "DEV"
    values:
      - DEV
      - SIT
  - name: project
    displayName: "Project Name"
    type: string
    default: "pilot-test"
  - name: tags_json_override
    displayName: "Tags (JSON Format)"
    type: string
    default: '{"Company": "BAB", "Department": "Information Technology", "ProjectName": "pilot-test", "ApplicationName": "pilot-test", "StartDate": "2025-11-08", "EndDate": "2025-11-08", "Region": "Sweden Central", "ApproverName": "pilot-test", "RequesterName": "CloudOps Team", "BusinessOwner": "pilot-test", "TechnicalOwner": "pilot-test", "CostCenter": "pilot-test", "ServiceClass": "pilot-test", "ManagedBy": "CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

steps:
# Step 1: Setup Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
    addToPath: true
    architecture: 'x64'
  displayName: 'Setup Python $(pythonVersion)'

# Step 2: Set Environment Variables
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Setting environment variables for ${{ parameters.environment }}..."
      $env:PROJECT_NAME = "${{ parameters.project }}"
      $env:ENVIRONMENT = "${{ parameters.environment }}"
      $env:SUBSCRIPTION_ID = "$(subscription_id)"
      $env:LOCATION = "$(location)"
      $env:VNET_NAME = "$(vnet_name)"
      $env:VNET_RG = "$(vnet_rg)"
      $env:TF_STATE_PATH = "$(tfStateDirectory)/$($env:PROJECT_NAME)/$($env:ENVIRONMENT)"
      Write-Host "##vso[task.setvariable variable=TF_STATE_PATH]$($env:TF_STATE_PATH)"
      New-Item -Path $env:TF_STATE_PATH -ItemType Directory -Force | Out-Null
      Write-Host "📁 Terraform state directory ensured: $($env:TF_STATE_PATH)"
  displayName: "Set Environment Variables from Variable Groups"

# Step 3: Azure Login
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Logging into Azure..."
      az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
      if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
      Write-Host "✅ Azure login successful."
  displayName: "Azure Login"

# Step 4: Run Python Script and Copy TF Immediately
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    errorActionPreference: 'stop'
    failOnStderr: true
    script: |
      $ErrorActionPreference = "Stop"
      Set-Location "$(tfWorkingDirectory)"

      Write-Host "🔧 Validating and setting environment variables from Variable Groups..."

      function Set-ValidatedEnvVar {
          param($Name, $Value, $Required = $true)
          if ([string]::IsNullOrWhiteSpace($Value) -and $Required) {
              Write-Error "❌ MISSING REQUIRED VARIABLE: $Name"
              throw "Required variable $Name missing"
          }
          if (![string]::IsNullOrWhiteSpace($Value)) {
              Set-Item -Path "env:$Name" -Value $Value
              Write-Host "✅ SET: $Name"
          }
      }

      # Core parameters
      Set-ValidatedEnvVar "ENVIRONMENT" "${{ parameters.environment }}"
      Set-ValidatedEnvVar "PROJECT_NAME" "${{ parameters.project }}"
      Set-ValidatedEnvVar "SUBSCRIPTION_ID" "$(subscription_id)"
      Set-ValidatedEnvVar "LOCATION" "$(location)"
      Set-ValidatedEnvVar "TF_STATE_PATH" "$(TF_STATE_PATH)"

      # Network + Key Vault + DCR
      Set-ValidatedEnvVar "VNET_NAME" "$(vnet_name)"
      Set-ValidatedEnvVar "VNET_RG" "$(vnet_rg)"
      Set-ValidatedEnvVar "SUBNET_RG" "$(subnet_rg)"
      Set-ValidatedEnvVar "KEYVAULT_NAME" "$(keyvault_name)"
      Set-ValidatedEnvVar "KEYVAULT_RG" "$(keyvault_rg)"
      Set-ValidatedEnvVar "DCR_NAME" "$(dcr_name)"
      Set-ValidatedEnvVar "DCR_RG" "$(dcr_rg)"
      Set-ValidatedEnvVar "DIAGNOSTICS_STORAGE" "$(diagnostics_storage)"
      Set-ValidatedEnvVar "DIAGNOSTICS_STORAGE_RG" "$(diagnostics_storage_rg)"

      # Custom Script Storage
      Set-ValidatedEnvVar "SCRIPT_STORAGE_ACCOUNT" "$(script_storage_account)"
      Set-ValidatedEnvVar "SCRIPT_STORAGE_CONTAINER" "$(script_storage_container)"
      Set-ValidatedEnvVar "SCRIPT_BLOB_NAME_WINDOWS" "$(script_blob_name_windows)"
      Set-ValidatedEnvVar "SCRIPT_BLOB_NAME_LINUX" "$(script_blob_name_linux)"
      Set-ValidatedEnvVar "SCRIPT_STORAGE_KEY" "$(script_storage_key)"

      # Shutdown
      Set-ValidatedEnvVar "shutdown_enabled" "$(shutdown_enabled)"
      Set-ValidatedEnvVar "shutdown_time" "$(shutdown_time)"
      Set-ValidatedEnvVar "shutdown_timezone" "$(shutdown_timezone)"

      # Tags
      $tagsInput = '${{ parameters.tags_json_override }}'
      if ('${{ parameters.action }}' -eq 'apply') {
          if ([string]::IsNullOrWhiteSpace($tagsInput)) { throw "❌ Missing mandatory tags for apply" }
          $env:default_tags_json = $tagsInput
          Write-Host "🏷️ Tags loaded for apply"
      } else {
          if ([string]::IsNullOrWhiteSpace($tagsInput) -or $tagsInput -eq "Use Variable Group") {
              $env:default_tags_json = "{}"
              Write-Host "🏷️ Using existing tags for modify"
          } else {
              $env:default_tags_json = $tagsInput
              Write-Host "🏷️ Updated tags loaded for modify"
          }
      }

      Write-Host ""
      Write-Host "🐍 Executing Terraform generator (v2.5)..."
      $pythonProcess = Start-Process -FilePath "python" -ArgumentList "$(tfWorkingDirectory)/core/generate-tf-v2.5.py" -Wait -PassThru -NoNewWindow
      if ($pythonProcess.ExitCode -ne 0) {
          throw "❌ Python script failed with exit code $($pythonProcess.ExitCode)"
      }
      Write-Host "✅ Python generator completed successfully"

      # Immediately copy the generated .tf to persistent state directory
      $tfFile = "$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
      $stateTargetPath = "C:/TerraformState/Project/${{ parameters.project }}/${{ parameters.environment }}"
      $timestamp = (Get-Date -Format "yyyy-MM-dd-HHmm")

      New-Item -Path $stateTargetPath -ItemType Directory -Force | Out-Null

      if (Test-Path $tfFile) {
          $backupFile = "$stateTargetPath/main-${{ parameters.environment }}-$timestamp.tf"
          Copy-Item $tfFile $backupFile -Force
          Write-Host "🕒 Immediate backup created: $backupFile"

          Copy-Item $tfFile "$stateTargetPath/main-${{ parameters.environment }}.tf" -Force
          Write-Host "📦 Active Terraform file saved: $stateTargetPath/main-${{ parameters.environment }}.tf"
      } else {
          Write-Warning "⚠️ Generated .tf file not found at expected path: $tfFile"
      }
  displayName: "Run Python Script (Generate TF + Immediate Copy)"
  condition: and(succeeded(), or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify')))

# Step 5: Prepare Modify
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $tfFile = "$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
      if ("${{ parameters.action }}" -eq "modify" -and !(Test-Path $tfFile)) {
          throw "❌ Terraform configuration missing. Run 'apply' first."
      }
      Write-Host "✅ Modify check passed."
  displayName: "Prepare for Modify Operation"
  condition: and(succeeded(), eq('${{ parameters.action }}', 'modify'))

# Step 6: Validate Terraform Configuration
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"
      Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
      $tfFile = "main-${{ parameters.environment }}.tf".ToLower()
      if (!(Test-Path $tfFile)) { throw "Missing Terraform configuration file" }
      Write-Host "🔍 Validating Terraform configuration..."
      terraform init
      terraform validate
      terraform fmt
      Write-Host "✅ Terraform validated and ready for deployment"
  displayName: "Validate Terraform Configuration"
  condition: succeeded()

# Step 7a: Terraform Plan (Preview)
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"
      Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
      terraform plan -out=tfplan
      terraform show tfplan > tfplan.txt
      Write-Host "📄 Terraform plan saved as tfplan.txt"
  displayName: "Terraform Plan (Preview)"
  condition: and(succeeded(), or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify')))

# Step 7b: Manual Approval (Pause for Review)
- task: ManualValidation@0
  displayName: "🧍 Manual Approval Required Before Apply"
  inputs:
    notifyUsers: |
      user1@yourcompany.com
      user2@yourcompany.com
    instructions: |
      Please review tfplan.txt before approving.
      - Approve = Proceed with Apply
      - Reject = Abort deployment
  condition: and(succeeded(), or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify')))

# Step 7c: Terraform Apply (After Approval + Backup)
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = "Stop"
      Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
      terraform apply -auto-approve tfplan

      $stateTargetPath = "$(TF_STATE_PATH)"
      $timestamp = (Get-Date -Format "yyyy-MM-dd-HHmm")
      New-Item -Path $stateTargetPath -ItemType Directory -Force | Out-Null

      $tfFile = "main-${{ parameters.environment }}.tf".ToLower()
      $backupFile = "$stateTargetPath/main-${{ parameters.environment }}-$timestamp.tf"

      if (Test-Path "$stateTargetPath/$tfFile") {
          Copy-Item "$stateTargetPath/$tfFile" "$backupFile" -Force
          Write-Host "🕒 Backup created: $backupFile"
      }

      Copy-Item $tfFile "$stateTargetPath/" -Force
      if (Test-Path "terraform.tfstate") {
          Copy-Item "terraform.tfstate" "$stateTargetPath/" -Force
      }
      if (Test-Path ".terraform.lock.hcl") {
          Copy-Item ".terraform.lock.hcl" "$stateTargetPath/" -Force
      }

      Write-Host "🎉 Terraform Apply completed successfully!"
  displayName: "Terraform Apply (After Manual Approval)"
  condition: and(succeeded(), or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify')))

# Step 8: Publish Build Artifacts
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(tfWorkingDirectory)/Project/${{ parameters.project }}/'
    ArtifactName: 'TerraformFiles-${{ parameters.environment }}-$(Build.BuildNumber)'
    publishLocation: 'Container'
  displayName: "Upload Terraform Files as Build Artifacts"
  condition: succeeded()

# Step 9: Post-Deployment Verification (Custom Script Extensions)
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "🔍 Validating Custom Script Extensions post-deployment..."
      $vms = az vm list --query "[].{Name:name,RG:resourceGroup}" -o json | ConvertFrom-Json
      foreach ($vm in $vms) {
          $ext = az vm extension list -g $vm.RG --vm-name $vm.Name -o json | ConvertFrom-Json
          $csx = $ext | Where-Object { $_.publisher -like "*Microsoft.Compute*" -and $_.type -like "*CustomScript*" }
          if ($csx) {
              $uri = $csx.settings.fileUris[0]
              Write-Host "✅ $($vm.Name): Custom Script detected → $uri"
              if ($uri -match "sig=.*") {
                  Write-Host "🔐 SAS token present → Verified"
              } else {
                  Write-Warning "⚠️ SAS token missing for $($vm.Name)"
              }
          } else {
              Write-Warning "⚠️ No Custom Script Extension found on $($vm.Name)"
          }
      }
      Write-Host "✅ Post-deployment validation completed."
  displayName: "Post-Deployment Verification (Custom Script SAS Validation)"
  condition: succeeded()