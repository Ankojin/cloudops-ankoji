trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: "apply"
    values:
      - apply
      - modify
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "DEV"
    values:
      - DEV
      - SIT
  - name: project
    displayName: "Project Name"
    type: string
    default: "BaaS-Platform"
  - name: tags_json_override
    displayName: "⚠️ REQUIRED: Mandatory Tags (JSON Format) - See description below"
    type: string
    default: '{"Company": "BAB", "Department": "Information Technology", "ProjectName": "pilot-test", "ApplicationName": "pilot-test", "StartDate": "2025-11-08", "EndDate": "2025-11-08", "Region": "Sweden Central", "ApproverName": "pilot-test", "RequesterName": "CloudOps Team", "BusinessOwner": "pilot-test", "TechnicalOwner": "pilot-test", "CostCenter": "pilot-test", "ServiceClass": "pilot-test", "ManagedBy": "CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

steps:
# Step 1: Setup Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
    addToPath: true
    architecture: 'x64'
  displayName: 'Setup Python $(pythonVersion)'

# Step 2: Set Environment Variables
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Setting environment variables for ${{ parameters.environment }}..."
      
      # All infrastructure variables come from Variable Groups
      $env:PROJECT_NAME = "${{ parameters.project }}"
      $env:ENVIRONMENT = "${{ parameters.environment }}"
      $env:SUBSCRIPTION_ID = "$(subscription_id)"
      $env:LOCATION = "$(location)"
      $env:VNET_NAME = "$(vnet_name)"
      $env:VNET_RG = "$(vnet_rg)"
      $env:TF_STATE_PATH = "$(tfStateDirectory)/$($env:PROJECT_NAME)/$($env:ENVIRONMENT)"
      
      Write-Host "##vso[task.setvariable variable=PROJECT_NAME]$($env:PROJECT_NAME)"
      Write-Host "##vso[task.setvariable variable=ENVIRONMENT]$($env:ENVIRONMENT)"
      Write-Host "##vso[task.setvariable variable=SUBSCRIPTION_ID]$($env:SUBSCRIPTION_ID)"
      Write-Host "##vso[task.setvariable variable=LOCATION_USED]$($env:LOCATION)"
      Write-Host "##vso[task.setvariable variable=VNET_NAME_USED]$($env:VNET_NAME)"
      Write-Host "##vso[task.setvariable variable=VNET_RG_USED]$($env:VNET_RG)"
      Write-Host "##vso[task.setvariable variable=TF_STATE_PATH]$($env:TF_STATE_PATH)"
      
      Write-Host "✅ Using Project: $($env:PROJECT_NAME)"
      Write-Host "✅ Using Environment: $($env:ENVIRONMENT)"
      Write-Host "✅ Using Subscription: $($env:SUBSCRIPTION_ID)"
      Write-Host "✅ Using Location: $($env:LOCATION)"
      Write-Host "✅ Using VNet: $($env:VNET_NAME) in RG: $($env:VNET_RG)"
      Write-Host "📁 Terraform state will be stored at: $($env:TF_STATE_PATH)"
      
      # Create state directory structure
      New-Item -Path $env:TF_STATE_PATH -ItemType Directory -Force
      Write-Host "📁 Created state directory: $($env:TF_STATE_PATH)"
  displayName: "Set Environment Variables from Variable Groups"

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Logging into Azure..."
      az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure login failed! Exiting."
          exit 1
      }
      Write-Host "Azure login successful."
  displayName: "Azure Login"

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Local state management - no storage container needed"
      Write-Host "State files will be managed locally at: $(TF_STATE_PATH)"
      Write-Host "This step is disabled for local state management"
  displayName: "Local State Management (No Storage Container Needed)"
  condition: false

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Running Python script for Terraform configuration..."
      Set-Location "$(tfWorkingDirectory)"
      
      # Set environment variables for Python script - all from Variable Groups
      $env:ENVIRONMENT = "${{ parameters.environment }}"
      $env:PROJECT_NAME = "${{ parameters.project }}"
      $env:SUBSCRIPTION_ID = "$(subscription_id)"
      $env:TF_STATE_PATH = "$(TF_STATE_PATH)"
      $env:VNET_NAME = "$(vnet_name)"
      $env:VNET_RG = "$(vnet_rg)"
      $env:LOCATION = "$(location)"
      $env:SUBNET_RG = "$(subnet_rg)"
      
      # Handle JSON configuration with proper escaping
      $env:SUBNETS_CONFIG = '$(subnets_config)'
      
      $env:KEYVAULT_NAME = "$(keyvault_name)"
      $env:KEYVAULT_RG = "$(keyvault_rg)"
      $env:DCR_NAME = "$(dcr_name)"
      $env:DCR_RG = "$(dcr_rg)"
      $env:DIAGNOSTICS_STORAGE = "$(diagnostics_storage)"
      $env:DIAGNOSTICS_STORAGE_RG = "$(diagnostics_storage_rg)"
      $env:SCRIPT_STORAGE_ACCOUNT = "$(script_storage_account)"
      $env:SCRIPT_STORAGE_CONTAINER = "$(script_storage_container)"
      $env:SCRIPT_BLOB_NAME_LINUX = "$(script_blob_name_linux)"
      $env:SCRIPT_BLOB_NAME_WINDOWS = "$(script_blob_name_windows)"
      
      # Key Vault Configuration for Windows script domain join
      $env:KEYVAULT_NAME = "$(keyvault_name)"
      $env:KEYVAULT_RG = "$(keyvault_rg)"
      
      # Handle mandatory tags from GUI JSON input
      $tagsInput = '${{ parameters.tags_json_override }}'
      if ($tagsInput -and $tagsInput -ne "" -and $tagsInput -ne "Use Variable Group") {
          Write-Host "🏷️ Using mandatory tags from GUI input"
          $env:default_tags_json = $tagsInput
      } else {
          Write-Host "❌ ERROR: Mandatory tags are required!"
          Write-Host "📋 Please provide all mandatory tags in JSON format through the pipeline GUI"
          Write-Host "💡 The tags field must contain all 14 mandatory tags"
          exit 1
      }
      
      # Fallback to legacy default_tags (should not be used)
      $env:DEFAULT_TAGS = "$(default_tags)"
      
      # Auto Shutdown Configuration
      $env:shutdown_enabled = "$(shutdown_enabled)"
      $env:shutdown_time = "$(shutdown_time)"
      $env:shutdown_timezone = "$(shutdown_timezone)"
      
      Write-Host "🔧 VM sizes and OS images will be read from CSV file"
      Write-Host "💾 Storage standards are hardcoded in Python script for consistency"
      Write-Host "📁 State will be stored locally at: $(TF_STATE_PATH)"
      Write-Host "🌐 Using VNet: $($env:VNET_NAME) in RG: $($env:VNET_RG)"
      Write-Host "🏷️ Tags source: GUI input (mandatory)"
      Write-Host "⚙️ Infrastructure config: Variable Groups"
      
      python "$(tfWorkingDirectory)/core/generate-tf-v2-enhanced.py"
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Error: Python script failed to execute."
          exit 1
      }
      Write-Host "Listing files in the working directory after script execution:"
      Get-ChildItem "$(tfWorkingDirectory)/Project/$($env:PROJECT_NAME)/" -Force
  displayName: "Run Python Script (Tags from GUI, Infrastructure from Variable Groups)"
  condition: or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify'))

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Validating Terraform configuration with local state..."
      Set-Location "$(tfWorkingDirectory)/Project/$(PROJECT_NAME)/"
      
      # Copy existing state file to working directory if it exists
      if (Test-Path "$(TF_STATE_PATH)/terraform.tfstate") {
          Write-Host "📄 Copying existing state file from $(TF_STATE_PATH)/"
          Copy-Item "$(TF_STATE_PATH)/terraform.tfstate" "./" -Force
          if (Test-Path "$(TF_STATE_PATH)/.terraform.lock.hcl") {
              Copy-Item "$(TF_STATE_PATH)/.terraform.lock.hcl" "./" -Force
          }
      } else {
          Write-Host "📄 No existing state file found. This will be a new deployment."
      }
      
      # Initialize with local backend
      terraform init
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform initialization failed! Exiting."
          exit 1
      }
        
      terraform validate
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform validation failed! Exiting."
          exit 1
      }
      Write-Host "Terraform configuration is valid."
  displayName: "Validate Terraform Configuration with Local State"

- task: Bash@3
  displayName: "Remove Manual State Management (No Longer Needed)"
  condition: false  # Disabled - using proper remote backend now
  inputs:
    targetType: 'inline'
    script: |
      echo "Manual state file management is now replaced by proper Terraform backend"

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Executing Terraform ${{ parameters.action }} with local state..."
      Set-Location "$(tfWorkingDirectory)/Project/$(PROJECT_NAME)/"
      
      # Copy existing state file to working directory if it exists (for modify operations)
      if ("${{ parameters.action }}" -eq "modify" -and (Test-Path "$(TF_STATE_PATH)/terraform.tfstate")) {
          Write-Host "📄 Copying existing state file for modify operation"
          Copy-Item "$(TF_STATE_PATH)/terraform.tfstate" "./" -Force
          if (Test-Path "$(TF_STATE_PATH)/.terraform.lock.hcl") {
              Copy-Item "$(TF_STATE_PATH)/.terraform.lock.hcl" "./" -Force
          }
      }
      
      # Initialize with local backend
      terraform init
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform initialization failed! Exiting."
          exit 1
      }
        
      terraform fmt
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform format failed! Exiting."
          exit 1
      }
      
      terraform validate
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform validation failed! Exiting."
          exit 1
      }
      
      terraform plan -out=tfplan
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform plan failed! Exiting."
          exit 1
      }
      
      terraform apply -auto-approve tfplan
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform apply failed! Exiting."
          exit 1
      }
      
      # Copy state file back to persistent location on agent
      Write-Host "📄 Saving state file to persistent location: $(TF_STATE_PATH)/"
      New-Item -Path "$(TF_STATE_PATH)" -ItemType Directory -Force | Out-Null
      Copy-Item "terraform.tfstate" "$(TF_STATE_PATH)/" -Force
      if (Test-Path ".terraform.lock.hcl") {
          Copy-Item ".terraform.lock.hcl" "$(TF_STATE_PATH)/" -Force
      }
      
      Write-Host "✅ State file saved successfully to: $(TF_STATE_PATH)/terraform.tfstate"
  displayName: "Terraform Apply/Modify with Local State Management"
  condition: or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify'))

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(tfWorkingDirectory)/Project/$(PROJECT_NAME)/'
    ArtifactName: 'TerraformFiles-${{ parameters.environment }}'
    publishLocation: 'Container'
  displayName: "Upload Terraform Files as Build Artifacts"
  condition: or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify'))