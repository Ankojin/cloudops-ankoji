trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    type: string
    default: apply
    values: [apply, modify]
  - name: environment
    type: string
    default: DEV
    values: [DEV, SIT]
  - name: project
    type: string
    default: pilot-test
  - name: tags_json_override
    type: string
    default: '{"Company":"BAB","Department":"IT"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment,'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment,'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

stages:
# =========================
#  Stage 1: PLAN
# =========================
- stage: TerraformPlan
  displayName: "Terraform Plan Stage"
  jobs:
  - job: PlanJob
    displayName: "Generate + Validate + Plan"
    pool:
      name: cloudops-agent
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'
      displayName: "Setup Python"

    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          $env:PROJECT_NAME="${{ parameters.project }}"
          $env:ENVIRONMENT="${{ parameters.environment }}"
          $env:TF_STATE_PATH="$(tfStateDirectory)/$($env:PROJECT_NAME)/$($env:ENVIRONMENT)"
          New-Item -Path $env:TF_STATE_PATH -ItemType Directory -Force | Out-Null
          Write-Host "📁 Ensured TF State Directory: $($env:TF_STATE_PATH)"
      displayName: "Set Env Vars"

    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
          if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
          Write-Host "✅ Azure login successful."
      displayName: "Azure Login"

    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)"
          Write-Host "🐍 Running Terraform Generator..."
          python "$(tfWorkingDirectory)/core/generate-tf-v2.5.py"
          if ($LASTEXITCODE -ne 0) { throw "Python failed" }
          $tfFile="$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
          $dst="C:/TerraformState/Project/${{ parameters.project }}/${{ parameters.environment }}"
          $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
          New-Item -Path $dst -ItemType Directory -Force | Out-Null
          if (Test-Path $tfFile) {
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}.tf" -Force
              Write-Host "📦 Copied TF to $dst"
          }
      displayName: "Generate TF + Copy Immediately"

    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
          terraform init
          terraform validate
          terraform fmt
          terraform plan -out=tfplan
          terraform show tfplan > tfplan.txt
          Write-Host "✅ Plan complete."
      displayName: "Validate & Plan"

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(tfWorkingDirectory)/Project/${{ parameters.project }}/tfplan.txt'
        ArtifactName: 'TerraformPlan-${{ parameters.environment }}'
      displayName: "Publish Plan Artifact"

# =========================
#  Stage 2: APPLY
# =========================
- stage: TerraformApply
  displayName: "Terraform Apply Stage (Requires Approval)"
  dependsOn: TerraformPlan
  condition: succeeded()
  environment:
    name: 'vm-deploy'      # <-- must exist in DevOps Environments with approvers
  jobs:
  - job: ApplyJob
    displayName: "Run Terraform Apply After Approval"
    pool:
      name: cloudops-agent
    steps:
    - checkout: self
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
          terraform apply -auto-approve tfplan
          $dst="$(TF_STATE_PATH)"
          $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
          New-Item -Path $dst -ItemType Directory -Force | Out-Null
          $tf="main-${{ parameters.environment }}.tf".ToLower()
          if (Test-Path $tf) {
              Copy-Item $tf "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
              Copy-Item $tf "$dst/" -Force
          }
          if (Test-Path "terraform.tfstate"){Copy-Item "terraform.tfstate" "$dst/" -Force}
          if (Test-Path ".terraform.lock.hcl"){Copy-Item ".terraform.lock.hcl" "$dst/" -Force}
          Write-Host "🎉 Apply completed successfully!"
      displayName: "Terraform Apply"

    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔍 Verifying Custom Script Extensions..."
          $vms=az vm list --query "[].{Name:name,RG:resourceGroup}" -o json|ConvertFrom-Json
          foreach($v in $vms){
            $ext=az vm extension list -g $v.RG --vm-name $v.Name -o json|ConvertFrom-Json
            $csx=$ext|?{$_.publisher -like "*Microsoft.Compute*" -and $_.type -like "*CustomScript*"}
            if($csx){Write-Host "✅ $($v.Name): $($csx.settings.fileUris[0])"}
            else{Write-Warning "⚠️ No Custom Script for $($v.Name)"}
          }
      displayName: "Post-Deployment Verification"