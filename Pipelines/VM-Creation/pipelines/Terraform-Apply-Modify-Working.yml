trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: "apply"
    values:
      - apply
      - modify
  - name: environment
    displayName: "Target Environment"
    type: string
    default: "DEV"
    values:
      - DEV
      - SIT
  - name: project
    displayName: "Project Name"
    type: string
    default: "pilot-test"
  - name: tags_json_override
    displayName: "Tags (JSON Format) - REQUIRED for Apply | OPTIONAL for Modify"
    type: string
    default: '{"Company": "BAB", "Department": "Information Technology", "ProjectName": "pilot-test", "ApplicationName": "pilot-test", "StartDate": "2025-11-08", "EndDate": "2025-11-08", "Region": "Sweden Central", "ApproverName": "pilot-test", "RequesterName": "CloudOps Team", "BusinessOwner": "pilot-test", "TechnicalOwner": "pilot-test", "CostCenter": "pilot-test", "ServiceClass": "pilot-test", "ManagedBy": "CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

steps:
# Step 1: Setup Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
    addToPath: true
    architecture: 'x64'
  displayName: 'Setup Python $(pythonVersion)'

# Step 2: Set Environment Variables
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Setting environment variables for ${{ parameters.environment }}..."
      
      # All infrastructure variables come from Variable Groups
      $env:PROJECT_NAME = "${{ parameters.project }}"
      $env:ENVIRONMENT = "${{ parameters.environment }}"
      $env:SUBSCRIPTION_ID = "$(subscription_id)"
      $env:LOCATION = "$(location)"
      $env:VNET_NAME = "$(vnet_name)"
      $env:VNET_RG = "$(vnet_rg)"
      $env:TF_STATE_PATH = "$(tfStateDirectory)/$($env:PROJECT_NAME)/$($env:ENVIRONMENT)"
      
      Write-Host "##vso[task.setvariable variable=PROJECT_NAME]$($env:PROJECT_NAME)"
      Write-Host "##vso[task.setvariable variable=ENVIRONMENT]$($env:ENVIRONMENT)"
      Write-Host "##vso[task.setvariable variable=SUBSCRIPTION_ID]$($env:SUBSCRIPTION_ID)"
      Write-Host "##vso[task.setvariable variable=LOCATION_USED]$($env:LOCATION)"
      Write-Host "##vso[task.setvariable variable=VNET_NAME_USED]$($env:VNET_NAME)"
      Write-Host "##vso[task.setvariable variable=VNET_RG_USED]$($env:VNET_RG)"
      Write-Host "##vso[task.setvariable variable=TF_STATE_PATH]$($env:TF_STATE_PATH)"
      
      Write-Host "✅ Using Project: $($env:PROJECT_NAME)"
      Write-Host "✅ Using Environment: $($env:ENVIRONMENT)"
      Write-Host "✅ Using Subscription: $($env:SUBSCRIPTION_ID)"
      Write-Host "✅ Using Location: $($env:LOCATION)"
      Write-Host "✅ Using VNet: $($env:VNET_NAME) in RG: $($env:VNET_RG)"
      Write-Host "📁 Terraform state will be stored at: $($env:TF_STATE_PATH)"
      
      # Create state directory structure
      New-Item -Path $env:TF_STATE_PATH -ItemType Directory -Force
      Write-Host "📁 Created state directory: $($env:TF_STATE_PATH)"
  displayName: "Set Environment Variables from Variable Groups"

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Logging into Azure..."
      az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
      if ($LASTEXITCODE -ne 0) {
          Write-Error "Azure login failed! Exiting."
          exit 1
      }
      Write-Host "Azure login successful."
  displayName: "Azure Login"

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    errorActionPreference: 'stop'
    failOnStderr: true
    script: |
      # Set strict error handling
      $ErrorActionPreference = "Stop"
      
      Write-Host "🔧 Running Python script for Terraform configuration..."
      Set-Location "$(tfWorkingDirectory)"
      
      # Function to validate and set environment variables with error checking
      function Set-ValidatedEnvVar {
          param($Name, $Value, $Required = $true)
          
          if ([string]::IsNullOrWhiteSpace($Value) -and $Required) {
              Write-Error "❌ MISSING REQUIRED VARIABLE: $Name is not defined in variable groups"
              throw "Required variable $Name is missing or empty"
          }
          
          if (![string]::IsNullOrWhiteSpace($Value)) {
              Set-Item -Path "env:$Name" -Value $Value
              Write-Host "✅ SET: $Name"
          } else {
              Write-Host "⚠️  SKIP: $Name (empty/optional)"
          }
      }
      
      Write-Host "📋 Validating and setting environment variables from Variable Groups..."
      
      # Core parameters (always available)
      Set-ValidatedEnvVar "ENVIRONMENT" "${{ parameters.environment }}" $true
      Set-ValidatedEnvVar "PROJECT_NAME" "${{ parameters.project }}" $true
      
      # Required Azure configuration
      Set-ValidatedEnvVar "SUBSCRIPTION_ID" "$(subscription_id)" $true
      Set-ValidatedEnvVar "TF_STATE_PATH" "$(TF_STATE_PATH)" $true
      Set-ValidatedEnvVar "LOCATION" "$(location)" $true
      
      # Required networking configuration
      Set-ValidatedEnvVar "VNET_NAME" "$(vnet_name)" $true
      Set-ValidatedEnvVar "VNET_RG" "$(vnet_rg)" $true
      Set-ValidatedEnvVar "SUBNET_RG" "$(subnet_rg)" $true
      
      # Required Key Vault configuration
      Set-ValidatedEnvVar "KEYVAULT_NAME" "$(keyvault_name)" $true
      Set-ValidatedEnvVar "KEYVAULT_RG" "$(keyvault_rg)" $true
      
      # Required monitoring configuration
      Set-ValidatedEnvVar "DCR_NAME" "$(dcr_name)" $true
      Set-ValidatedEnvVar "DCR_RG" "$(dcr_rg)" $true
      Set-ValidatedEnvVar "DIAGNOSTICS_STORAGE" "$(diagnostics_storage)" $true
      Set-ValidatedEnvVar "DIAGNOSTICS_STORAGE_RG" "$(diagnostics_storage_rg)" $true
      
      # Required script storage configuration
      Set-ValidatedEnvVar "SCRIPT_STORAGE_ACCOUNT" "$(script_storage_account)" $true
      Set-ValidatedEnvVar "SCRIPT_STORAGE_CONTAINER" "$(script_storage_container)" $true
      Set-ValidatedEnvVar "SCRIPT_BLOB_NAME_LINUX" "$(script_blob_name_linux)" $true
      
      # Optional auto shutdown configuration
      Set-ValidatedEnvVar "shutdown_enabled" "$(shutdown_enabled)" $false
      Set-ValidatedEnvVar "shutdown_time" "$(shutdown_time)" $false
      Set-ValidatedEnvVar "shutdown_timezone" "$(shutdown_timezone)" $false
      
      # Handle mandatory tags from GUI JSON input - different logic for apply vs modify
      $tagsInput = '${{ parameters.tags_json_override }}'
      if ('${{ parameters.action }}' -eq 'apply') {
          # Apply: Tags are mandatory
          if ([string]::IsNullOrWhiteSpace($tagsInput) -or $tagsInput -eq "Use Variable Group") {
              Write-Error "❌ ERROR: Mandatory tags are required for new VM creation!"
              Write-Host "📋 Please provide all mandatory tags in JSON format through the pipeline GUI"
              Write-Host "💡 The tags field must contain all 14 mandatory tags"
              throw "Mandatory tags JSON is required but not provided for apply action"
          }
          Write-Host "🏷️ Using mandatory tags from GUI input for new VM creation"
          $env:default_tags_json = $tagsInput
      } elseif ('${{ parameters.action }}' -eq 'modify') {
          # Modify: Tags are optional - use existing tags if not provided
          if ([string]::IsNullOrWhiteSpace($tagsInput) -or $tagsInput -eq "Use Variable Group") {
              Write-Host "🏷️ No new tags provided for modify action - will preserve existing VM tags"
              $env:default_tags_json = "{}"  # Empty JSON to preserve existing tags
          } else {
              Write-Host "🏷️ Using updated tags from GUI input for VM modification"
              $env:default_tags_json = $tagsInput
          }
      }
      
      Write-Host ""
      Write-Host "📋 Configuration Summary:"
      Write-Host "📁 State location: $($env:TF_STATE_PATH)"
      Write-Host "🌐 VNet: $($env:VNET_NAME) in RG: $($env:VNET_RG)"
      Write-Host "🔗 Subnet names: Direct from CSV file"
      Write-Host "🏷️ Tags source: GUI input (mandatory)"
      Write-Host "⚙️ Infrastructure config: Variable Groups"
      Write-Host "💾 Storage standards: Hardcoded in Python script"
      Write-Host ""
      
      Write-Host "🐍 Executing Python script..."
      $pythonProcess = Start-Process -FilePath "python" -ArgumentList "$(tfWorkingDirectory)/core/generate-tf-v2-enhanced.py" -Wait -PassThru -NoNewWindow
      $pythonExitCode = $pythonProcess.ExitCode
      
      if ($pythonExitCode -ne 0) {
          Write-Error "❌ CRITICAL ERROR: Python script failed to execute with exit code $pythonExitCode"
          Write-Host "##vso[task.logissue type=error]Python script execution failed with exit code $pythonExitCode"
          Write-Host "##vso[task.complete result=Failed;]Python script execution failed"
          throw "Python script execution failed - STOPPING PIPELINE"
      }
      
      Write-Host ""
      Write-Host "✅ Python script completed successfully"
      Write-Host "📁 Generated files verification:"
      $projectPath = "$(tfWorkingDirectory)/Project/$($env:PROJECT_NAME)/"
      Write-Host "[DEBUG] Expected project path: $projectPath"
      Write-Host "[DEBUG] Resolved project path: $(Resolve-Path $projectPath -ErrorAction SilentlyContinue)"
      Write-Host "[DEBUG] Current working directory: $(Get-Location)"
      
      if (Test-Path $projectPath) {
          $tfFile = "$projectPath/main-${{ parameters.environment }}.tf".ToLower()
          Write-Host "[DEBUG] Expected TF file path: $tfFile"
          Write-Host "[DEBUG] Resolved TF file path: $(Resolve-Path $tfFile -ErrorAction SilentlyContinue)"
          
          if (Test-Path $tfFile) {
              Write-Host "✅ Terraform configuration file generated successfully"
              Write-Host "[DEBUG] TF file size: $((Get-Item $tfFile).Length) bytes"
              Get-ChildItem $projectPath -Force | ForEach-Object { Write-Host "  - $($_.Name)" }
          } else {
              Write-Error "❌ CRITICAL: Terraform configuration file not generated: main-${{ parameters.environment }}.tf"
              Write-Host "##vso[task.logissue type=error]Required Terraform file was not generated"
              Write-Host "##vso[task.complete result=Failed;]Terraform file generation failed"
              throw "Required Terraform file was not generated - STOPPING PIPELINE"
          }
      } else {
          Write-Error "❌ CRITICAL: Project directory not created: $projectPath"
          Write-Host "##vso[task.logissue type=error]Project directory was not created"
          Write-Host "##vso[task.complete result=Failed;]Project directory creation failed"
          throw "Project directory was not created - STOPPING PIPELINE"
      }
  displayName: "Run Python Script (Generate New VM Configuration - Apply Only)"
  condition: and(succeeded(), eq('${{ parameters.action }}', 'apply'))

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    errorActionPreference: 'stop'
    failOnStderr: true
    script: |
      # Set strict error handling
      $ErrorActionPreference = "Stop"
      
      Write-Host "🔧 Preparing for modify operation on existing VM infrastructure..."
      Set-Location "$(tfWorkingDirectory)"
      
      # For modify operations, we need to use existing Terraform configuration
      $projectPath = "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
      $tfFile = "$projectPath/main-${{ parameters.environment }}.tf".ToLower()
      
      Write-Host "📁 Checking for existing Terraform configuration..."
      if (!(Test-Path $projectPath)) {
          Write-Error "❌ CRITICAL: Project directory not found: $projectPath"
          Write-Host "📋 REQUIRED: You must run 'apply' action first to create the initial VM before using 'modify'"
          throw "Project directory not found - run 'apply' first"
      }
      
      if (!(Test-Path $tfFile)) {
          Write-Error "❌ CRITICAL: Terraform configuration file not found: $tfFile"
          Write-Host "📋 REQUIRED: You must run 'apply' action first to create the initial VM before using 'modify'"
          throw "Terraform configuration file not found - run 'apply' first"
      }
      
      Write-Host "✅ Found existing Terraform configuration for modification"
      Write-Host "📄 Configuration file: $tfFile"
      
      # Verify state file exists
      $stateFile = "$(TF_STATE_PATH)/terraform.tfstate"
      if (!(Test-Path $stateFile)) {
          Write-Error "❌ CRITICAL: Terraform state file not found: $stateFile"
          Write-Host "📋 REQUIRED: You must run 'apply' action first to create the initial VM state"
          throw "Terraform state file not found - run 'apply' first"
      }
      
      Write-Host "✅ Found existing Terraform state file"
      Write-Host "📄 State file: $stateFile"
      Write-Host ""
      Write-Host "🎯 Ready for modify operation on existing VM infrastructure"
      Write-Host "⚠️  NOTE: Modify will only update VM settings, not recreate resources"
  displayName: "Prepare for Modify Operation (Use Existing Configuration)"
  condition: and(succeeded(), eq('${{ parameters.action }}', 'modify'))

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    errorActionPreference: 'stop'
    failOnStderr: true
    script: |
      # Set strict error handling
      $ErrorActionPreference = "Stop"
      
      Write-Host "🔍 Validating Terraform configuration with local state..."
      Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
      
      # Verify we're in the correct directory
      $currentDir = Get-Location
      Write-Host "📁 Working directory: $currentDir"
      
      if (!(Test-Path "main-${{ parameters.environment }}.tf".ToLower())) {
          Write-Error "❌ Terraform configuration file not found in current directory"
          throw "Missing Terraform configuration file"
      }
      
      # Copy existing state file to working directory if it exists
      $stateSourcePath = "$(TF_STATE_PATH)/terraform.tfstate"
      if (Test-Path $stateSourcePath) {
          Write-Host "📄 Copying existing state file from $(TF_STATE_PATH)/"
          Copy-Item $stateSourcePath "./" -Force
          $lockFile = "$(TF_STATE_PATH)/.terraform.lock.hcl"
          if (Test-Path $lockFile) {
              Copy-Item $lockFile "./" -Force
              Write-Host "📄 Copied lock file"
          }
      } else {
          Write-Host "📄 No existing state file found. This will be a new deployment."
      }
      
      # Copy existing Terraform configuration for consistency (important for modify operations)
      $tfConfigSource = "$(TF_STATE_PATH)/main-${{ parameters.environment }}.tf".ToLower()
      if (Test-Path $tfConfigSource) {
          Copy-Item $tfConfigSource "./" -Force
          Write-Host "📄 Copied existing TF configuration for consistency"
          Write-Host "[DEBUG] Using persistent TF config: $(Resolve-Path $tfConfigSource)"
      } else {
          Write-Host "📄 No existing TF configuration found - using newly generated"
      }
      
      # Initialize with local backend
      Write-Host "🔧 Initializing Terraform..."
      terraform init
      if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform initialization failed with exit code $LASTEXITCODE"
          throw "Terraform init failed"
      }
        
      # Validate configuration
      Write-Host "✅ Validating Terraform configuration..."
      terraform validate
      if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform validation failed with exit code $LASTEXITCODE"
          throw "Terraform validation failed"
      }
      
      Write-Host "✅ Terraform configuration is valid and ready for deployment"
  displayName: "Validate Terraform Configuration with Local State"
  condition: succeeded()

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    errorActionPreference: 'stop'
    failOnStderr: true
    script: |
      # Set strict error handling
      $ErrorActionPreference = "Stop"
      
      Write-Host "🚀 Executing Terraform ${{ parameters.action }} with local state management..."
      Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
      
      # Verify we're in the correct directory with required files
      $currentDir = Get-Location
      Write-Host "📁 Working directory: $currentDir"
      
      $tfFile = "main-${{ parameters.environment }}".ToLower() + ".tf"
      if (!(Test-Path $tfFile)) {
          Write-Error "❌ Terraform configuration file not found: $tfFile"
          throw "Missing Terraform configuration file"
      }
      
      # Copy existing state file to working directory if it exists (for modify operations)
      $stateSourcePath = "$(TF_STATE_PATH)/terraform.tfstate"
      if ("${{ parameters.action }}" -eq "modify" -and (Test-Path $stateSourcePath)) {
          Write-Host "📄 Copying existing state file for modify operation"
          Copy-Item $stateSourcePath "./" -Force
          $lockFile = "$(TF_STATE_PATH)/.terraform.lock.hcl"
          if (Test-Path $lockFile) {
              Copy-Item $lockFile "./" -Force
          }
      }
      
      # Initialize with local backend
      Write-Host "🔧 Initializing Terraform..."
      terraform init
      if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform initialization failed with exit code $LASTEXITCODE"
          throw "Terraform init failed"
      }
        
      # Format code
      Write-Host "📝 Formatting Terraform code..."
      terraform fmt
      if ($LASTEXITCODE -ne 0) {
          Write-Warning "⚠️  Terraform format failed but continuing..."
      }
      
      # Validate configuration
      Write-Host "✅ Validating Terraform configuration..."
      terraform validate
      if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform validation failed with exit code $LASTEXITCODE"
          throw "Terraform validation failed"
      }
      
      # Create plan
      Write-Host "📋 Creating Terraform plan..."
      terraform plan -out=tfplan
      if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform plan failed with exit code $LASTEXITCODE"
          throw "Terraform plan failed"
      }
      
      # Apply changes
      Write-Host "⚡ Applying Terraform plan..."
      terraform apply -auto-approve tfplan
      if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform apply failed with exit code $LASTEXITCODE"
          throw "Terraform apply failed"
      }
      
      # Save state file back to persistent location on agent
      Write-Host "📄 Saving state file to persistent location..."
      $stateTargetPath = "$(TF_STATE_PATH)"
      Write-Host "[DEBUG] Expected state path: $stateTargetPath"
      Write-Host "[DEBUG] Resolved state path: $(Resolve-Path $stateTargetPath -ErrorAction SilentlyContinue)"
      Write-Host "[DEBUG] Current working directory: $(Get-Location)"
      
      New-Item -Path $stateTargetPath -ItemType Directory -Force | Out-Null
      
      # Save Terraform configuration file for future modify operations
      $tfFileName = "main-${{ parameters.environment }}.tf".ToLower()
      $projectPath = "$(tfWorkingDirectory)/Project/$($env:PROJECT_NAME)/"
      $tfSourcePath = "$projectPath$tfFileName"
      
      Write-Host "[DEBUG] Looking for TF file at: $tfSourcePath"
      
      if (Test-Path $tfSourcePath) {
          Copy-Item $tfSourcePath "$stateTargetPath/" -Force
          Write-Host "✅ Terraform configuration saved to: $stateTargetPath/$tfFileName"
          Write-Host "[DEBUG] TF config source: $tfSourcePath"
          Write-Host "[DEBUG] TF config size: $((Get-Item $tfSourcePath).Length) bytes"
          
          # Verify the copy was successful
          $copiedTfPath = "$stateTargetPath/$tfFileName"
          if (Test-Path $copiedTfPath) {
              $copiedTfSize = (Get-Item $copiedTfPath).Length
              Write-Host "[DEBUG] Copied TF file size: $copiedTfSize bytes"
              Write-Host "✅ Terraform configuration copy verified successful"
          } else {
              Write-Warning "⚠️  Terraform configuration copy may have failed"
          }
      } else {
          Write-Warning "⚠️  Terraform configuration file not found at: $tfSourcePath"
          Write-Host "[DEBUG] Available files in project directory:"
          if (Test-Path $projectPath) {
              Get-ChildItem $projectPath | ForEach-Object { Write-Host "  - $($_.Name)" }
          } else {
              Write-Host "  - Project directory does not exist: $projectPath"
          }
      }
      
      if (Test-Path "terraform.tfstate") {
          $stateFileSize = (Get-Item "terraform.tfstate").Length
          Copy-Item "terraform.tfstate" "$stateTargetPath/" -Force
          Write-Host "✅ State file saved to: $stateTargetPath/terraform.tfstate"
          Write-Host "[DEBUG] State file size: $stateFileSize bytes"
          
          # Verify the copy was successful
          $copiedStatePath = "$stateTargetPath/terraform.tfstate"
          if (Test-Path $copiedStatePath) {
              $copiedFileSize = (Get-Item $copiedStatePath).Length
              Write-Host "[DEBUG] Copied state file size: $copiedFileSize bytes"
              Write-Host "✅ State file copy verified successful"
          } else {
              Write-Warning "⚠️  State file copy may have failed"
          }
      } else {
          Write-Warning "⚠️  No state file found to save"
      }
      
      if (Test-Path ".terraform.lock.hcl") {
          Copy-Item ".terraform.lock.hcl" "$stateTargetPath/" -Force
          Write-Host "✅ Lock file saved"
      }
      
      Write-Host ""
      Write-Host "🎉 Terraform deployment completed successfully!"
      Write-Host "📊 Final state saved to: $stateTargetPath/"
  displayName: "Terraform Apply/Modify with Local State Management"
  condition: and(succeeded(), or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify')))

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(tfWorkingDirectory)/Project/${{ parameters.project }}/'
    ArtifactName: 'TerraformFiles-${{ parameters.environment }}-$(Build.BuildNumber)'
    publishLocation: 'Container'
  displayName: "Upload Terraform Files as Build Artifacts"
  condition: and(succeeded(), or(eq('${{ parameters.action }}', 'apply'), eq('${{ parameters.action }}', 'modify')))