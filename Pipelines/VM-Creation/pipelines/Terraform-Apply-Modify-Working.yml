trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: apply
    values:
      - apply
      - modify

  - name: environment
    displayName: "Target Environment"
    type: string
    default: DEV
    values:
      - DEV
      - SIT

  - name: project
    displayName: "Project Name"
    type: string
    default: pilot-test

  - name: tags_json_override
    displayName: "Tags (JSON Format)"
    type: string
    default: '{"Company":"BAB","Department":"Information Technology","ProjectName":"pilot-test","ApplicationName":"pilot-test","Region":"Sweden Central","ApproverName":"pilot-test","RequesterName":"CloudOps Team","BusinessOwner":"pilot-test","TechnicalOwner":"pilot-test","CostCenter":"pilot-test","ServiceClass":"pilot-test","ManagedBy":"CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

stages:
# =========================
#  STAGE 1: TERRAFORM PLAN
# =========================
- stage: TerraformPlan
  displayName: "Terraform Plan Stage"
  jobs:
  - job: PlanJob
    displayName: "Generate + Validate + Plan"
    pool:
      name: cloudops-agent
    steps:

    # Step 1: Setup Python
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'
      displayName: "Setup Python $(pythonVersion)"

    # Step 2: Azure Login
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔐 Logging into Azure..."
          az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
          if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
          Write-Host "✅ Azure login successful."
      displayName: "Azure Login"

    # Step 3: Set & Validate Environment Variables (Full Original Logic)
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        errorActionPreference: 'stop'
        failOnStderr: true
        script: |
          Write-Host "🔧 Validating and setting environment variables from Variable Groups..."

          function Set-ValidatedEnvVar {
              param($Name, $Value, $Required = $true)
              if ([string]::IsNullOrWhiteSpace($Value) -and $Required) {
                  Write-Error "❌ MISSING REQUIRED VARIABLE: $Name is not defined in variable groups"
                  throw "Required variable $Name is missing or empty"
              }
              if (![string]::IsNullOrWhiteSpace($Value)) {
                  Set-Item -Path "env:$Name" -Value $Value
                  Write-Host "✅ SET: $Name"
              } else {
                  Write-Host "⚠️ SKIP: $Name (empty/optional)"
              }
          }

          # Core environment setup
          Set-ValidatedEnvVar "ENVIRONMENT" "${{ parameters.environment }}"
          Set-ValidatedEnvVar "PROJECT_NAME" "${{ parameters.project }}"
          Set-ValidatedEnvVar "SUBSCRIPTION_ID" "$(subscription_id)"
          Set-ValidatedEnvVar "LOCATION" "$(location)"
          Set-ValidatedEnvVar "TF_STATE_PATH" "$(tfStateDirectory)/${{ parameters.project }}/${{ parameters.environment }}"

          # Networking
          Set-ValidatedEnvVar "VNET_NAME" "$(vnet_name)"
          Set-ValidatedEnvVar "VNET_RG" "$(vnet_rg)"
          Set-ValidatedEnvVar "SUBNET_RG" "$(subnet_rg)"

          # Key Vault + DCR
          Set-ValidatedEnvVar "KEYVAULT_NAME" "$(keyvault_name)"
          Set-ValidatedEnvVar "KEYVAULT_RG" "$(keyvault_rg)"
          Set-ValidatedEnvVar "DCR_NAME" "$(dcr_name)"
          Set-ValidatedEnvVar "DCR_RG" "$(dcr_rg)"

          # Diagnostics + Custom Script Storage
          Set-ValidatedEnvVar "DIAGNOSTICS_STORAGE" "$(diagnostics_storage)"
          Set-ValidatedEnvVar "DIAGNOSTICS_STORAGE_RG" "$(diagnostics_storage_rg)"
          Set-ValidatedEnvVar "SCRIPT_STORAGE_ACCOUNT" "$(script_storage_account)"
          Set-ValidatedEnvVar "SCRIPT_STORAGE_CONTAINER" "$(script_storage_container)"
          Set-ValidatedEnvVar "SCRIPT_BLOB_NAME_WINDOWS" "$(script_blob_name_windows)"
          Set-ValidatedEnvVar "SCRIPT_BLOB_NAME_LINUX" "$(script_blob_name_linux)"
          Set-ValidatedEnvVar "SCRIPT_STORAGE_KEY" "$(script_storage_key)"

          # Shutdown config
          Set-ValidatedEnvVar "shutdown_enabled" "$(shutdown_enabled)"
          Set-ValidatedEnvVar "shutdown_time" "$(shutdown_time)"
          Set-ValidatedEnvVar "shutdown_timezone" "$(shutdown_timezone)"

          # Tag handling
          $tagsInput = '${{ parameters.tags_json_override }}'
          if ('${{ parameters.action }}' -eq 'apply') {
              if ([string]::IsNullOrWhiteSpace($tagsInput)) { throw "❌ Missing mandatory tags for apply" }
              $env:default_tags_json = $tagsInput
              Write-Host "🏷️ Tags loaded for apply"
          } else {
              if ([string]::IsNullOrWhiteSpace($tagsInput) -or $tagsInput -eq "Use Variable Group") {
                  $env:default_tags_json = "{}"
                  Write-Host "🏷️ Using existing tags for modify"
              } else {
                  $env:default_tags_json = $tagsInput
                  Write-Host "🏷️ Updated tags loaded for modify"
              }
          }
      displayName: "Set & Validate Environment Variables"

    # Step 4: Python Generator + Copy TF Files
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)"
          Write-Host "🐍 Running Terraform Generator..."
          python "$(tfWorkingDirectory)/core/generate-tf-v2.5.py"
          if ($LASTEXITCODE -ne 0) { throw "Python script failed" }

          $tfFile="$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
          $dst="C:/TerraformState/Project/${{ parameters.project }}/${{ parameters.environment }}"
          $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
          New-Item -Path $dst -ItemType Directory -Force | Out-Null
          if (Test-Path $tfFile) {
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}.tf" -Force
              Write-Host "📦 Copied TF file to $dst (timestamp + latest)"
          }
      displayName: "Run Python + Copy TF"

    # Step 5: Terraform Validate & Plan
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
          terraform init
          terraform validate
          terraform fmt
          terraform plan -out=tfplan
          terraform show tfplan > tfplan.txt
          Write-Host "✅ Terraform plan complete."
      displayName: "Terraform Validate + Plan"

# =========================
#  STAGE 2: APPLY (WITH APPROVAL)
# =========================
- stage: TerraformApply
  displayName: "Terraform Apply Stage (Requires Approval)"
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    displayName: "Run Terraform Apply After Approval"
    environment: 'vm-deploy'     # GUI approval
    pool:
      name: cloudops-agent
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # Terraform Apply + Copy
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
                terraform apply -auto-approve tfplan

                $dst="$(TF_STATE_PATH)"
                $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
                New-Item -Path $dst -ItemType Directory -Force | Out-Null

                $tf="main-${{ parameters.environment }}.tf".ToLower()
                if (Test-Path $tf) {
                    Copy-Item $tf "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
                    Copy-Item $tf "$dst/" -Force
                }
                if (Test-Path "terraform.tfstate"){Copy-Item "terraform.tfstate" "$dst/" -Force}
                if (Test-Path ".terraform.lock.hcl"){Copy-Item ".terraform.lock.hcl" "$dst/" -Force}
                Write-Host "🎉 Terraform Apply completed successfully!"
            displayName: "Terraform Apply"

          # Post Validation
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "🔍 Checking Custom Script Extensions..."
                $vms=az vm list --query "[].{Name:name,RG:resourceGroup}" -o json|ConvertFrom-Json
                foreach($v in $vms){
                  $ext=az vm extension list -g $v.RG --vm-name $v.Name -o json|ConvertFrom-Json
                  $csx=$ext|?{$_.publisher -like "*Microsoft.Compute*" -and $_.type -like "*CustomScript*"}
                  if($csx){Write-Host "✅ $($v.Name): $($csx.settings.fileUris[0])"}
                  else{Write-Warning "⚠️ No Custom Script Extension for $($v.Name)"}
                }
              displayName: "Post-Deployment Verification"