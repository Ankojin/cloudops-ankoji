trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: apply
    values:
      - apply
      - modify

  - name: environment
    displayName: "Target Environment"
    type: string
    default: DEV
    values:
      - DEV
      - SIT

  - name: project
    displayName: "Project Name"
    type: string
    default: pilot-test

  - name: tags_json_override
    displayName: "Tags (JSON Format)"
    type: string
    default: '{"Company":"BAB","Department":"Information Technology","ProjectName":"pilot-test","ApplicationName":"pilot-test","Region":"Sweden Central","ApproverName":"pilot-test","RequesterName":"CloudOps Team","BusinessOwner":"pilot-test","TechnicalOwner":"pilot-test","CostCenter":"pilot-test","ServiceClass":"pilot-test","ManagedBy":"CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

stages:
# =========================
#  STAGE 1: TERRAFORM PLAN
# =========================
- stage: TerraformPlan
  displayName: "Terraform Plan Stage"
  jobs:
  - job: PlanJob
    displayName: "Generate + Validate + Plan"
    pool:
      name: cloudops-agent
    steps:

    # Step 1: Setup Python
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'
      displayName: "Setup Python $(pythonVersion)"

    # Step 2: Set Environment Variables
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          $env:PROJECT_NAME="${{ parameters.project }}"
          $env:ENVIRONMENT="${{ parameters.environment }}"
          $env:TF_STATE_PATH="$(tfStateDirectory)/$($env:PROJECT_NAME)/$($env:ENVIRONMENT)"
          New-Item -Path $env:TF_STATE_PATH -ItemType Directory -Force | Out-Null
          Write-Host "📁 Ensured TF State Directory: $($env:TF_STATE_PATH)"
      displayName: "Set Environment Variables"

    # Step 3: Azure Login
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
          if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
          Write-Host "✅ Azure login successful."
      displayName: "Azure Login"

    # Step 4: Python Script Execution + Immediate TF Copy
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)"
          Write-Host "🐍 Running Terraform Generator..."
          python "$(tfWorkingDirectory)/core/generate-tf-v2.5.py"
          if ($LASTEXITCODE -ne 0) { throw "Python script failed" }

          $tfFile="$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
          $dst="C:/TerraformState/Project/${{ parameters.project }}/${{ parameters.environment }}"
          $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
          New-Item -Path $dst -ItemType Directory -Force | Out-Null
          if (Test-Path $tfFile) {
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}.tf" -Force
              Write-Host "📦 Copied TF file to $dst (timestamp + latest)"
          }
      displayName: "Run Python + Copy TF to State Path"

    # Step 5: Validate and Plan Terraform
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
          terraform init
          terraform validate
          terraform fmt
          terraform plan -out=tfplan
          terraform show tfplan > tfplan.txt
          Write-Host "✅ Terraform Plan complete."
      displayName: "Validate & Plan Terraform"

    # Step 6: Publish Plan Artifact
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(tfWorkingDirectory)/Project/${{ parameters.project }}/tfplan.txt'
        ArtifactName: 'TerraformPlan-${{ parameters.environment }}'
      displayName: "Publish Terraform Plan Artifact"

# =========================
#  STAGE 2: TERRAFORM APPLY
# =========================
- stage: TerraformApply
  displayName: "Terraform Apply Stage (Requires Approval)"
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob                 # Deployment job supports environment approvals
    displayName: "Run Terraform Apply After Approval"
    environment: 'vm-deploy'             # <-- must exist in DevOps Environments with approvers
    pool:
      name: cloudops-agent
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          # Step 1: Terraform Apply
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
                terraform apply -auto-approve tfplan

                $dst="$(TF_STATE_PATH)"
                $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
                New-Item -Path $dst -ItemType Directory -Force | Out-Null

                $tf="main-${{ parameters.environment }}.tf".ToLower()
                if (Test-Path $tf) {
                    Copy-Item $tf "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
                    Copy-Item $tf "$dst/" -Force
                }
                if (Test-Path "terraform.tfstate"){Copy-Item "terraform.tfstate" "$dst/" -Force}
                if (Test-Path ".terraform.lock.hcl"){Copy-Item ".terraform.lock.hcl" "$dst/" -Force}
                Write-Host "🎉 Terraform Apply completed successfully!"
            displayName: "Terraform Apply"

          # Step 2: Post-Deployment Validation
          - task: PowerShell@2
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "🔍 Checking Custom Script Extensions..."
                $vms=az vm list --query "[].{Name:name,RG:resourceGroup}" -o json|ConvertFrom-Json
                foreach($v in $vms){
                  $ext=az vm extension list -g $v.RG --vm-name $v.Name -o json|ConvertFrom-Json
                  $csx=$ext|?{$_.publisher -like "*Microsoft.Compute*" -and $_.type -like "*CustomScript*"}
                  if($csx){Write-Host "✅ $($v.Name): $($csx.settings.fileUris[0])"}
                  else{Write-Warning "⚠️ No Custom Script Extension found for $($v.Name)"}
                }
                Write-Host "✅ Post-deployment validation done."
            displayName: "Post-Deployment Verification"