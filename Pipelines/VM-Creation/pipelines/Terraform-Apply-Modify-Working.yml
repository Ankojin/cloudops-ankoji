trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: "apply"
    values: [apply, modify]

  - name: environment
    displayName: "Target Environment"
    type: string
    default: "DEV"
    values: [DEV, SIT]

  - name: project
    displayName: "Project Name"
    type: string
    default: "pilot-test"

  - name: tags_json_override
    displayName: "Tags (JSON Format)"
    type: string
    default: '{"Company":"BAB","Department":"Information Technology","ProjectName":"pilot-test","ApplicationName":"pilot-test","Region":"Sweden Central","ApproverName":"pilot-test","RequesterName":"CloudOps Team","BusinessOwner":"pilot-test","TechnicalOwner":"pilot-test","CostCenter":"pilot-test","ServiceClass":"pilot-test","ManagedBy":"CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

steps:

# Step 1 – Python
- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
    architecture: 'x64'
  displayName: 'Setup Python $(pythonVersion)'

# Step 2 – Env Vars
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $env:PROJECT_NAME="${{ parameters.project }}"
      $env:ENVIRONMENT="${{ parameters.environment }}"
      $env:TF_STATE_PATH="$(tfStateDirectory)/$($env:PROJECT_NAME)/$($env:ENVIRONMENT)"
      New-Item -Path $env:TF_STATE_PATH -ItemType Directory -Force | Out-Null
      Write-Host "📁 TF state dir ensured → $($env:TF_STATE_PATH)"
  displayName: "Set Environment Variables"

# Step 3 – Azure Login
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
      if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
      Write-Host "✅ Azure login successful."
  displayName: "Azure Login"

# Step 4 – Python Generator + Immediate TF Copy
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Set-Location "$(tfWorkingDirectory)"
      Write-Host "🐍 Running Terraform generator (v2.5)…"
      python "$(tfWorkingDirectory)/core/generate-tf-v2.5.py"
      if ($LASTEXITCODE -ne 0) { throw "❌ Python script failed" }

      $tfFile="$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
      $target="C:/TerraformState/Project/${{ parameters.project }}/${{ parameters.environment }}"
      $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
      New-Item -Path $target -ItemType Directory -Force | Out-Null
      if (Test-Path $tfFile) {
          Copy-Item $tfFile "$target/main-${{ parameters.environment }}-$ts.tf" -Force
          Copy-Item $tfFile "$target/main-${{ parameters.environment }}.tf" -Force
          Write-Host "📦 Copied TF file to $target (with backup)"
      }
  displayName: "Run Python and Copy TF Immediately"
  condition: and(succeeded(), or(eq('${{ parameters.action }}','apply'),eq('${{ parameters.action }}','modify')))

# Step 5 – Modify Check
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      $tfFile="$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
      if ("${{ parameters.action }}" -eq "modify" -and !(Test-Path $tfFile)) {
          throw "❌ Missing TF config; run apply first."
      }
  displayName: "Prepare Modify"
  condition: and(succeeded(),eq('${{ parameters.action }}','modify'))

# Step 6 – Validate TF
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
      terraform init
      terraform validate
      terraform fmt
      Write-Host "✅ Terraform validated."
  displayName: "Validate Terraform"
  condition: succeeded()

# Step 7a – Plan
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
      terraform plan -out=tfplan
      terraform show tfplan > tfplan.txt
      Write-Host "📄 Plan saved → tfplan.txt"
  displayName: "Terraform Plan (Preview)"
  condition: and(succeeded(),or(eq('${{ parameters.action }}','apply'),eq('${{ parameters.action }}','modify')))

# Step 7b+7c – Apply (Requires Environment Approval)
- job: TerraformApply
  displayName: "Terraform Apply (Requires Approval)"
  environment:
    name: 'vm-deploy'   # must exist in DevOps GUI with approvers
  pool:
    name: cloudops-agent
  steps:
    - checkout: self
    - task: PowerShell@2
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
          terraform apply -auto-approve tfplan

          $dst="$(TF_STATE_PATH)"
          $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
          New-Item -Path $dst -ItemType Directory -Force | Out-Null

          $tf="main-${{ parameters.environment }}.tf".ToLower()
          $bak="$dst/main-${{ parameters.environment }}-$ts.tf"
          if (Test-Path "$dst/$tf") {
              Copy-Item "$dst/$tf" "$bak" -Force
              Write-Host "🕒 Backup → $bak"
          }
          Copy-Item $tf "$dst/" -Force
          if (Test-Path "terraform.tfstate"){Copy-Item "terraform.tfstate" "$dst/" -Force}
          if (Test-Path ".terraform.lock.hcl"){Copy-Item ".terraform.lock.hcl" "$dst/" -Force}
          Write-Host "🎉 Apply completed successfully!"
      displayName: "Run Terraform Apply (Post-Approval)"

# Step 8 – Artifacts
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(tfWorkingDirectory)/Project/${{ parameters.project }}/'
    ArtifactName: 'TerraformFiles-${{ parameters.environment }}-$(Build.BuildNumber)'
  displayName: "Publish TF Artifacts"
  condition: succeeded()

# Step 9 – Post-Deployment Verification
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "🔍 Checking Custom Script Extensions..."
      $vms=az vm list --query "[].{Name:name,RG:resourceGroup}" -o json|ConvertFrom-Json
      foreach($v in $vms){
        $ext=az vm extension list -g $v.RG --vm-name $v.Name -o json|ConvertFrom-Json
        $csx=$ext|?{$_.publisher -like "*Microsoft.Compute*" -and $_.type -like "*CustomScript*"}
        if($csx){$uri=$csx.settings.fileUris[0];Write-Host "✅ $($v.Name): $uri"}
        else{Write-Warning "⚠️ No Custom Script found for $($v.Name)"}
      }
      Write-Host "✅ Post-deployment validation done."
  displayName: "Post-Deployment Verification"
  condition: succeeded()