trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: apply
    values:
      - apply
      - modify

  - name: environment
    displayName: "Target Environment"
    type: string
    default: DEV
    values:
      - DEV
      - SIT

  - name: project
    displayName: "Project Name"
    type: string
    default: pilot-test

  - name: tags_json_override
    displayName: "Tags (JSON Format)"
    type: string
    default: '{"Company":"BAB","Department":"Information Technology","ProjectName":"pilot-test","ApplicationName":"pilot-test","Region":"Sweden Central","ApproverName":"pilot-test","RequesterName":"CloudOps Team","BusinessOwner":"pilot-test","TechnicalOwner":"pilot-test","CostCenter":"pilot-test","ServiceClass":"pilot-test","ManagedBy":"CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

stages:

# =========================
#  STAGE 1: TERRAFORM PLAN
# =========================
- stage: TerraformPlan
  displayName: "Terraform Plan Stage"
  jobs:
  - job: PlanJob
    displayName: "Generate + Validate + Plan"
    pool:
      name: cloudops-agent
    steps:

    # Step 1: Setup Python
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'
      displayName: "Setup Python $(pythonVersion)"

    # Step 2: Set Environment Variables from Variable Groups
    - task: PowerShell@2
      displayName: "Set Environment Variables from Variable Groups"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Setting environment variables for ${{ parameters.environment }}..."

          $env:PROJECT_NAME = "${{ parameters.project }}"
          $env:ENVIRONMENT = "${{ parameters.environment }}"
          $env:SUBSCRIPTION_ID = "$(subscription_id)"
          $env:LOCATION = "$(location)"
          $env:VNET_NAME = "$(vnet_name)"
          $env:VNET_RG = "$(vnet_rg)"
          $env:TF_STATE_PATH = "$(tfStateDirectory)/$($env:PROJECT_NAME)/$($env:ENVIRONMENT)"

          # ✅ Re-export secure and critical variables to Python runtime
          $env:SUBSCRIPTION_ID = "$(subscription_id)"
          $env:LOCATION = "$(location)"
          $env:VNET_NAME = "$(vnet_name)"
          $env:VNET_RG = "$(vnet_rg)"
          $env:SUBNET_RG = "$(subnet_rg)"
          $env:KEYVAULT_NAME = "$(keyvault_name)"
          $env:KEYVAULT_RG = "$(keyvault_rg)"
          $env:DCR_NAME = "$(dcr_name)"
          $env:DCR_RG = "$(dcr_rg)"
          $env:DIAGNOSTICS_STORAGE = "$(diagnostics_storage)"
          $env:DIAGNOSTICS_STORAGE_RG = "$(diagnostics_storage_rg)"
          $env:SCRIPT_STORAGE_ACCOUNT = "$(script_storage_account)"
          $env:SCRIPT_STORAGE_CONTAINER = "$(script_storage_container)"
          $env:SCRIPT_BLOB_NAME_WINDOWS = "$(script_blob_name_windows)"
          $env:SCRIPT_BLOB_NAME_LINUX = "$(script_blob_name_linux)"
          $env:shutdown_enabled = "$(shutdown_enabled)"
          $env:shutdown_time = "$(shutdown_time)"
          $env:shutdown_timezone = "$(shutdown_timezone)"

          Write-Host "✅ Using Project: $($env:PROJECT_NAME)"
          Write-Host "✅ Using Environment: $($env:ENVIRONMENT)"
          Write-Host "✅ Using Subscription: $($env:SUBSCRIPTION_ID)"
          Write-Host "✅ Using Location: $($env:LOCATION)"
          Write-Host "✅ Using VNet: $($env:VNET_NAME) in RG: $($env:VNET_RG)"
          Write-Host "📁 Terraform state will be stored at: $($env:TF_STATE_PATH)"

          New-Item -Path $env:TF_STATE_PATH -ItemType Directory -Force | Out-Null
          Write-Host "📁 Created state directory: $($env:TF_STATE_PATH)"

    # Step 3: Azure Login
    - task: PowerShell@2
      displayName: "Azure Login (Service Principal)"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔐 Logging into Azure..."
          if (!(Get-Command az -ErrorAction SilentlyContinue)) {
            Write-Error "❌ Azure CLI not installed on agent."
            exit 1
          }
          az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
          if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
          az account show
          Write-Host "✅ Azure login successful."

    # Step 4: Validate Environment Variables
    - task: PowerShell@2
      displayName: "Validate Environment Variables"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔧 Validating required variables..."
          function Set-ValidatedEnvVar {
              param($Name, $Value, $Required = $true)
              if ([string]::IsNullOrWhiteSpace($Value) -and $Required) {
                  Write-Error "❌ Missing required variable: $Name"
                  throw "Variable $Name missing or empty"
              }
              if (![string]::IsNullOrWhiteSpace($Value)) {
                  Set-Item -Path "env:$Name" -Value $Value
                  Write-Host "✅ SET: $Name"
              } else {
                  Write-Host "⚠️ SKIP: $Name (optional)"
              }
          }

          Set-ValidatedEnvVar "SUBSCRIPTION_ID" "$(subscription_id)"
          Set-ValidatedEnvVar "LOCATION" "$(location)"
          Set-ValidatedEnvVar "VNET_NAME" "$(vnet_name)"
          Set-ValidatedEnvVar "VNET_RG" "$(vnet_rg)"
          Set-ValidatedEnvVar "SUBNET_RG" "$(subnet_rg)"
          Set-ValidatedEnvVar "KEYVAULT_NAME" "$(keyvault_name)"
          Set-ValidatedEnvVar "KEYVAULT_RG" "$(keyvault_rg)"
          Set-ValidatedEnvVar "DCR_NAME" "$(dcr_name)"
          Set-ValidatedEnvVar "DCR_RG" "$(dcr_rg)"
          Set-ValidatedEnvVar "DIAGNOSTICS_STORAGE" "$(diagnostics_storage)"
          Set-ValidatedEnvVar "DIAGNOSTICS_STORAGE_RG" "$(diagnostics_storage_rg)"
          Set-ValidatedEnvVar "SCRIPT_STORAGE_ACCOUNT" "$(script_storage_account)"
          Set-ValidatedEnvVar "SCRIPT_STORAGE_CONTAINER" "$(script_storage_container)"
          Set-ValidatedEnvVar "SCRIPT_BLOB_NAME_WINDOWS" "$(script_blob_name_windows)"
          Set-ValidatedEnvVar "SCRIPT_BLOB_NAME_LINUX" "$(script_blob_name_linux)"
          Set-ValidatedEnvVar "shutdown_enabled" "$(shutdown_enabled)"
          Set-ValidatedEnvVar "shutdown_time" "$(shutdown_time)"
          Set-ValidatedEnvVar "shutdown_timezone" "$(shutdown_timezone)"

    # Step 5: Verify CLI
    - task: PowerShell@2
      displayName: "Verify Azure CLI Availability"
      inputs:
        targetType: 'inline'
        script: |
          if (!(Get-Command az -ErrorAction SilentlyContinue)) {
            Write-Error "❌ Azure CLI missing."
            exit 1
          }
          Write-Host "✅ Azure CLI detected and ready for SAS generation."

    # Step 6: Preflight Blob Verification + Diagnostics
    - task: PowerShell@2
      displayName: "Preflight: Verify Script Blob Exists (with Diagnostics)"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔎 Checking blob access..."
          $account   = "$(script_storage_account)"
          $container = "$(script_storage_container)"
          $blobWin   = "$(script_blob_name_windows)"
          $blobLinux = "$(script_blob_name_linux)"
          $verified  = $false

          # Function to run az CLI and capture stdout/stderr safely
          function Test-Blob {
              param($BlobName)
              try {
                  Write-Host "🔹 Checking blob: $BlobName"
                  $result = az storage blob show `
                      --account-name $account `
                      --container-name $container `
                      --name $BlobName `
                      --auth-mode login `
                      --output json 2>&1

                  if ($LASTEXITCODE -eq 0) {
                      Write-Host "✅ Verified blob: $BlobName"
                      return $true
                  } else {
                      Write-Warning "⚠️ Blob check failed for $BlobName"
                      Write-Warning "🔧 CLI Output: $result"
                      return $false
                  }
              }
              catch {
                  Write-Warning "⚠️ Blob verification threw exception for $BlobName:"
                  Write-Warning "💬 Exception: $($_.Exception.Message)"
                  return $false
              }
          }

          # Check both blobs independently
          $winOK = $false
          $linOK = $false

          if ($blobWin -and $blobWin -ne "") { $winOK = Test-Blob -BlobName $blobWin }
          if ($blobLinux -and $blobLinux -ne "") { $linOK = Test-Blob -BlobName $blobLinux }

          if ($winOK -or $linOK) {
              Write-Host "✅ One or more blobs verified successfully."
          }
          else {
              Write-Warning "⚠️ No accessible blobs found. SAS generation may fail."
              Write-Host ""
              Write-Host "🩺 Diagnostic Hints:"
              Write-Host "  • Ensure blob names and container are correct."
              Write-Host "  • Confirm service principal has **Storage Blob Data Reader** on $account."
              Write-Host "  • If the storage account is in another subscription, run 'az account show' to verify context."
              Write-Host "  • If using private endpoints or firewalls, ensure agent IP is allowed."
          }

          Write-Host "✅ Preflight blob diagnostic check complete."

    # Step 7: Python Terraform Generator
    - task: PowerShell@2
      displayName: "Run Python + Copy TF"
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)"
          Write-Host "🐍 Running Terraform Generator (v2.5, CLI SAS mode)..."

          python "$(tfWorkingDirectory)/core/generate-tf-v2.5.py"
          if ($LASTEXITCODE -ne 0) { throw "Python script failed" }

          $tfFile="$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
          $dst="C:/TerraformState/Project/${{ parameters.project }}/${{ parameters.environment }}"
          $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
          New-Item -Path $dst -ItemType Directory -Force | Out-Null
          if (Test-Path $tfFile) {
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}.tf" -Force
              Write-Host "📦 Copied TF file to $dst (timestamp + latest)"
          } else {
              Write-Error "❌ Terraform file not found: $tfFile"
              exit 1
          }

          if (Select-String -Path $tfFile -Pattern "sig=") {
              Write-Host "🔐 SAS tokens detected — CLI SAS mode verified."
          } else {
              Write-Warning "⚠️ No SAS tokens found — verify blob access or CLI login."
          }

          Write-Host "✅ Terraform configuration generation complete."

    # Step 8: Terraform Validate + Plan
    - task: PowerShell@2
      displayName: "Terraform Validate + Plan"
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
          terraform init
          terraform validate
          terraform fmt
          terraform plan -out=tfplan
          terraform show tfplan > tfplan.txt
          Write-Host "✅ Terraform plan completed successfully."

# =========================
#  STAGE 2: APPLY (WITH APPROVAL)
# =========================
- stage: TerraformApply
  displayName: "Terraform Apply Stage (Requires Approval)"
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    displayName: "Run Terraform Apply After Approval"
    environment: 'vm-deploy'
    pool:
      name: cloudops-agent
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: PowerShell@2
            displayName: "Terraform Apply"
            inputs:
              targetType: 'inline'
              script: |
                Set-Location "$(tfWorkingDirectory)/Project/${{ parameters.project }}/"
                terraform apply -auto-approve tfplan

                $dst="$(TF_STATE_PATH)"
                $ts=(Get-Date -Format 'yyyy-MM-dd-HHmm')
                New-Item -Path $dst -ItemType Directory -Force | Out-Null

                $tf="main-${{ parameters.environment }}.tf".ToLower()
                if (Test-Path $tf) {
                    Copy-Item $tf "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
                    Copy-Item $tf "$dst/" -Force
                }
                if (Test-Path "terraform.tfstate"){Copy-Item "terraform.tfstate" "$dst/" -Force}
                if (Test-Path ".terraform.lock.hcl"){Copy-Item ".terraform.lock.hcl" "$dst/" -Force}
                Write-Host "🎉 Terraform Apply completed successfully!"

          - task: PowerShell@2
            displayName: "Post-Deployment Verification"
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "🔍 Checking Custom Script Extensions..."
                $vms = az vm list --query "[].{Name:name,RG:resourceGroup}" -o json | ConvertFrom-Json
                foreach ($v in $vms) {
                  $ext = az vm extension list -g $v.RG --vm-name $v.Name -o json | ConvertFrom-Json
                  $csx = $ext | ? { $_.publisher -like "*Microsoft.Compute*" -and $_.type -like "*CustomScript*" }
                  if ($csx) {
                    Write-Host "✅ $($v.Name): $($csx.settings.fileUris[0])"
                  } else {
                    Write-Warning "⚠️ No Custom Script Extension found for $($v.Name)"
                  }
                }