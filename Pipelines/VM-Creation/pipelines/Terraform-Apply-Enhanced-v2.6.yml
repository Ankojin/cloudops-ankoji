trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: apply
    values: [apply, modify]

  - name: environment
    displayName: "Target Environment"
    type: string
    default: DEV
    values: [DEV, SIT]

  - name: project
    displayName: "Project Name"
    type: string
    default: pilot-test

  - name: tags_json_override
    displayName: "Tags (JSON Format)"
    type: string
    default: '{"Company":"BAB","Department":"Information Technology","ProjectName":"pilot-test","ApplicationName":"pilot-test","Region":"Sweden Central","ApproverName":"pilot-test","RequesterName":"CloudOps Team","BusinessOwner":"pilot-test","TechnicalOwner":"pilot-test","CostCenter":"pilot-test","ServiceClass":"pilot-test","ManagedBy":"CloudOps Team"}'


variables:
  - name: tfWorkingDirectory
    value: '$(Build.SourcesDirectory)\Pipelines\VM-Creation'

  - name: tfStateDirectory
    value: 'C:\TerraformState\Project'

  - group: TerraformVariables

  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV

  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT

  - name: pythonVersion
    value: "3.9"

stages:
# ===================================================
#  STAGE 1 — PLAN (Always runs)
# ===================================================
- stage: TerraformPlan
  displayName: "Terraform Plan Stage"

  jobs:
  - job: PlanJob
    displayName: "Generate + Validate + Plan"
    pool:
      name: cloudops-agent

    steps:

    - task: UsePythonVersion@0
      displayName: "Setup Python $(pythonVersion)"
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'

    # ---------------------------------------------
    # Set Environment Variables
    # ---------------------------------------------
    - task: PowerShell@2
      displayName: "Set Environment Variables"
      inputs:
        targetType: inline
        script: |
          Write-Host "Setting environment variables..."

          $env:PROJECT_NAME   = "${{ parameters.project }}"
          $env:ENVIRONMENT    = "${{ parameters.environment }}"
          $env:SUBSCRIPTION_ID = "$(subscription_id)"
          $env:LOCATION        = "$(location)"
          $env:VNET_NAME       = "$(vnet_name)"
          $env:VNET_RG         = "$(vnet_rg)"
          $env:SUBNET_RG       = "$(subnet_rg)"
          $env:KEYVAULT_NAME   = "$(keyvault_name)"
          $env:KEYVAULT_RG     = "$(keyvault_rg)"
          $env:DCR_NAME        = "$(dcr_name)"
          $env:DCR_RG          = "$(dcr_rg)"
          $env:DIAGNOSTICS_STORAGE    = "$(diagnostics_storage)"
          $env:DIAGNOSTICS_STORAGE_RG = "$(diagnostics_storage_rg)"
          $env:SCRIPT_STORAGE_ACCOUNT  = "$(script_storage_account)"
          $env:SCRIPT_STORAGE_CONTAINER = "$(script_storage_container)"
          $env:SCRIPT_BLOB_NAME_WINDOWS = "$(script_blob_name_windows)"
          $env:SCRIPT_BLOB_NAME_LINUX   = "$(script_blob_name_linux)"
          $env:SCRIPT_STORAGE_KEY        = "$(script_storage_key)"
          $env:shutdown_enabled = "$(shutdown_enabled)"
          $env:shutdown_time    = "$(shutdown_time)"
          $env:shutdown_timezone = "$(shutdown_timezone)"

          $tfState = "$(tfStateDirectory)\$($env:PROJECT_NAME)\$($env:ENVIRONMENT)"
          New-Item -Path $tfState -ItemType Directory -Force | Out-Null
          Write-Host "TF State Directory: $tfState"

    # ---------------------------------------------
    # Azure Login
    # ---------------------------------------------
    - task: PowerShell@2
      displayName: "Azure Login"
      inputs:
        targetType: inline
        script: |
          Write-Host "Logging into Azure..."
          az login `
            --service-principal `
            -u "$(ARM_CLIENT_ID)" `
            -p "$(ARM_CLIENT_SECRET)" `
            --tenant "$(ARM_TENANT_ID)"

          if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }

    # ---------------------------------------------
    # SAS TOKEN GENERATION
    # ---------------------------------------------
    - task: PowerShell@2
      displayName: "Generate SAS URLs"
      inputs:
        targetType: inline
        script: |
          Write-Host "Generating SAS URLs..."

          $account   = "$(script_storage_account)"
          $container = "$(script_storage_container)"
          $key       = "$(script_storage_key)"
          $expiry    = (Get-Date).AddHours(24).ToString("yyyy-MM-ddTHH:mmZ")
          $env:AZURE_STORAGE_KEY = $key

          function Make-SafeSas {
            param([string]$Blob)
            if (-not $Blob) { return $null }

            Write-Host "Creating SAS for $Blob..."

            $sas = az storage blob generate-sas `
                  --account-name $account `
                  --container-name $container `
                  --name $Blob `
                  --permissions r `
                  --expiry $expiry `
                  --auth-mode key `
                  --https-only -o tsv

            if (-not $sas) { return $null }

            return ("https://{0}.blob.core.windows.net/{1}/{2}?{3}" -f `
                    $account, $container, $Blob, $sas)
          }

          $sasWin   = Make-SafeSas "$(script_blob_name_windows)"
          $sasLinux = Make-SafeSas "$(script_blob_name_linux)"

          if ($sasWin)   { Write-Host "##vso[task.setvariable variable=SAS_URL_WINDOWS;issecret=true]$sasWin" }
          if ($sasLinux) { Write-Host "##vso[task.setvariable variable=SAS_URL_LINUX;issecret=true]$sasLinux" }

    # ---------------------------------------------
    # Python Generator
    # ---------------------------------------------
    - task: PowerShell@2
      displayName: "Run Python + Copy TF"
      inputs:
        targetType: inline
        script: |
          Set-Location "$(tfWorkingDirectory)"

          $env:PROJECT_NAME = "${{ parameters.project }}"
          $env:ENVIRONMENT = "${{ parameters.environment }}"
          $env:SAS_URL_WINDOWS = "$(SAS_URL_WINDOWS)"
          $env:SAS_URL_LINUX   = "$(SAS_URL_LINUX)"
          $env:DEFAULT_TAGS_JSON = "${{ parameters.tags_json_override }}"

          python "$(tfWorkingDirectory)\core\generate-tf-v2.6.py"
          if ($LASTEXITCODE -ne 0) { throw "Python failed" }

          $source = "$(tfWorkingDirectory)\Project\${{ parameters.project }}\main-${{ parameters.environment }}.tf"
          $dest   = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}"

          Copy-Item $source "$dest\main-${{ parameters.environment }}.tf" -Force
          Write-Host "TF file copied → $dest"
          Write-Host "DEBUG: Python sees PROJECT_NAME = $env:PROJECT_NAME"
          Write-Host "DEBUG: Python sees ENVIRONMENT = $env:ENVIRONMENT"

    # ---------------------------------------------
    # Terraform Plan
    # ---------------------------------------------
    - task: PowerShell@2
      displayName: "Terraform Validate + Plan"
      inputs:
        targetType: inline
        script: |
            $tfProject = "$(tfWorkingDirectory)\Project\${{ parameters.project }}"
            $tfState   = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}"

            # Always run terraform init in the directory with main.tf
            Set-Location $tfProject
            terraform init
            if ($LASTEXITCODE -ne 0) { throw "Terraform init failed" }

            terraform validate
            if ($LASTEXITCODE -ne 0) { throw "Terraform validate failed" }

            terraform plan -out "$tfState\tfplan"
            if ($LASTEXITCODE -ne 0 -or !(Test-Path "$tfState\tfplan")) {
              throw "Terraform plan failed or tfplan file not created."
            }

            terraform show "$tfState\tfplan" > "$tfState\tfplan.txt"
            Write-Host "Plan saved to → $tfState"

    # Modify Mode Summary
    - ${{ if eq(parameters.action, 'modify') }}:
      - task: PowerShell@2
        displayName: "Show Modify Summary"
        inputs:
          targetType: inline
          script: |
              $planFile = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}\tfplan.txt"
              $stateFile = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}\terraform.tfstate"

              if (Test-Path $planFile) {
                Write-Host "MODIFY SUMMARY:"
                $planContent = Get-Content $planFile
                $planSummary = $planContent | Select-String "Plan:" -Context 2,2
                $addCount = ($planContent | Select-String "  + create" | Measure-Object).Count
                $changeCount = ($planContent | Select-String "  ~ update" | Measure-Object).Count
                $destroyCount = ($planContent | Select-String "  - destroy" | Measure-Object).Count
                Write-Host "Resources to add: $addCount"
                Write-Host "Resources to change: $changeCount"
                Write-Host "Resources to destroy: $destroyCount"
              } else {
                Write-Warning "tfplan.txt not found."
              }

                if (Test-Path $stateFile) {
                  Write-Host "terraform.tfstate file exists. Verifying usage in modify task..."
                  $stateContent = Get-Content $stateFile -Raw
                  if ($addCount -eq 0 -and $changeCount -eq 0 -and $destroyCount -eq 0) {
                    Write-Host "No changes detected. Existing tfstate is being used."
                  } else {
                    Write-Host "Changes detected. tfstate will be updated after apply."
                  }
                } else {
                  Write-Error "terraform.tfstate file not found. Modify mode requires an existing state file. Failing pipeline."
                  exit 1
                }

# ===================================================

    # ---------------------------------------------
    # Terraform Apply (Backup + Retry)
    # ---------------------------------------------
    - task: PowerShell@2
      displayName: "Terraform Apply (Backup + Retry)"
      inputs:
        targetType: inline
        script: |
            $project = "${{ parameters.project }}"
            $envName = "${{ parameters.environment }}"
            $tfState = "$(tfStateDirectory)\$project\$envName"

            $tf       = "$tfState\main-$envName.tf"
            $planFile = "$tfState\tfplan"
            $state    = "$tfState\terraform.tfstate"
            $backup   = "$tfState\backups"

            if (!(Test-Path $backup)) {
              New-Item -Path $backup -ItemType Directory -Force | Out-Null
            }

            # Backup existing state
            if (Test-Path $state) {
              $b = "$backup\terraform-$(Get-Date -Format 'yyyyMMdd-HHmmss').tfstate.bak"
              Copy-Item $state $b -Force
            }

            Set-Location $tfState
            terraform init

            Write-Host "Running terraform apply..."
            terraform apply -auto-approve "$planFile"
            if ($LASTEXITCODE -ne 0) {
              throw "Terraform Apply failed."
            }

            Write-Host "Terraform Apply Completed."