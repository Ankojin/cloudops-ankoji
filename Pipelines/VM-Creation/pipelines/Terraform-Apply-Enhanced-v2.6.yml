trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: apply
    values: [apply, modify]

  - name: environment
    displayName: "Target Environment"
    type: string
    default: DEV
    values: [DEV, SIT]

  - name: project
    displayName: "Project Name"
    type: string
    default: pilot-test

  - name: tags_json_override
    displayName: "Tags (JSON Format)"
    type: string
    default: '{"Company":"BAB","Department":"Information Technology","ProjectName":"pilot-test","ApplicationName":"pilot-test","Region":"Sweden Central","ApproverName":"pilot-test","RequesterName":"CloudOps Team","BusinessOwner":"pilot-test","TechnicalOwner":"pilot-test","CostCenter":"pilot-test","ServiceClass":"pilot-test","ManagedBy":"CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: '$(Build.SourcesDirectory)\Pipelines\VM-Creation'
  - name: tfStateDirectory
    value: 'C:\TerraformState\Project'
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

stages:
# ===================================================
#  STAGE 1 — TERRAFORM PLAN
# ===================================================
- stage: TerraformPlan
  displayName: "Terraform Plan Stage"

  jobs:
  - job: PlanJob
    displayName: "Generate + Validate + Plan"
    pool:
      name: cloudops-agent

    steps:

    # Python
    - task: UsePythonVersion@0
      displayName: "Setup Python $(pythonVersion)"
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'

    # Mandatory Environment Variables
    - task: PowerShell@2
      displayName: "Set Environment Variables from Variable Groups"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Setting environment variables..."

          $env:PROJECT_NAME = "${{ parameters.project }}"
          $env:ENVIRONMENT = "${{ parameters.environment }}"
          $env:SUBSCRIPTION_ID = "$(subscription_id)"
          $env:LOCATION = "$(location)"
          $env:VNET_NAME = "$(vnet_name)"
          $env:VNET_RG = "$(vnet_rg)"
          $env:SUBNET_RG = "$(subnet_rg)"
          $env:KEYVAULT_NAME = "$(keyvault_name)"
          $env:KEYVAULT_RG = "$(keyvault_rg)"
          $env:DCR_NAME = "$(dcr_name)"
          $env:DCR_RG = "$(dcr_rg)"
          $env:DIAGNOSTICS_STORAGE = "$(diagnostics_storage)"
          $env:DIAGNOSTICS_STORAGE_RG = "$(diagnostics_storage_rg)"
          $env:SCRIPT_STORAGE_ACCOUNT = "$(script_storage_account)"
          $env:SCRIPT_STORAGE_CONTAINER = "$(script_storage_container)"
          $env:SCRIPT_BLOB_NAME_WINDOWS = "$(script_blob_name_windows)"
          $env:SCRIPT_BLOB_NAME_LINUX = "$(script_blob_name_linux)"
          $env:SCRIPT_STORAGE_KEY = "$(script_storage_key)"
          $env:shutdown_enabled = "$(shutdown_enabled)"
          $env:shutdown_time = "$(shutdown_time)"
          $env:shutdown_timezone = "$(shutdown_timezone)"

          Write-Host "PROJECT_NAME=$env:PROJECT_NAME"
          Write-Host "ENVIRONMENT=$env:ENVIRONMENT"

          $tfState = "$(tfStateDirectory)\$($env:PROJECT_NAME)\$($env:ENVIRONMENT)"
          New-Item -Path $tfState -ItemType Directory -Force | Out-Null

    # Azure Login
    - task: PowerShell@2
      displayName: "Azure Login"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔐 Logging into Azure..."
          az login `
            --service-principal `
            -u "$(ARM_CLIENT_ID)" `
            -p "$(ARM_CLIENT_SECRET)" `
            --tenant "$(ARM_TENANT_ID)"

          if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
          Write-Host "Azure login OK."

    # =====================================================
    # 🔑 SAS TOKEN GENERATION
    # =====================================================
    - task: PowerShell@2
      displayName: "Generate SAS URLs for Custom Script Blobs"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔑 Generating SAS tokens for Custom Script blobs..."

          $account   = "$(script_storage_account)"
          $container = "$(script_storage_container)"
          $key       = "$(script_storage_key)"
          $expiry    = (Get-Date).AddHours(24).ToString("yyyy-MM-ddTHH:mmZ")

          $env:AZURE_STORAGE_KEY = $key

          $winBlob   = "$(script_blob_name_windows)"
          $linuxBlob = "$(script_blob_name_linux)"

          Write-Host "📌 DEBUG:"
          Write-Host "  Windows Blob: $winBlob"
          Write-Host "  Linux Blob:   $linuxBlob"

          function Generate-SasUrl {
            param([string]$BlobName)

            if (-not $BlobName) {
              Write-Warning "❌ Blob name is empty — cannot generate SAS."
              return $null
            }

            Write-Host "DEBUG: az storage blob generate-sas --account-name $account --container-name $container --name ${BlobName} --permissions r --expiry $expiry --auth-mode key --https-only -o tsv"
            try {
              Write-Host "⏳ Generating SAS for blob: ${BlobName}"

              $sas = az storage blob generate-sas `
                      --account-name   $account `
                      --container-name $container `
                      --name           $BlobName `
                      --permissions    r `
                      --expiry         $expiry `
                      --auth-mode      key `
                      --https-only `
                      -o tsv

              if (-not $sas) {
                Write-Warning "⚠️ Empty SAS returned for ${BlobName}"
                return $null
              }

              # SAFE string builder (no variable interpolation issues)
              $url = ("https://{0}.blob.core.windows.net/{1}/{2}?{3}" -f `
                        $account, $container, $BlobName, $sas)

              Write-Host "✔️ SAS URL generated for ${BlobName}:"
              Write-Host "   $url"

              return $url
            }
            catch {
              Write-Warning "❌ SAS generation failed for ${BlobName}: ${_}"
              return $null
            }
          }

          $sasWin   = Generate-SasUrl -BlobName $winBlob
          $sasLinux = Generate-SasUrl -BlobName $linuxBlob

          if ($sasWin) {
            Write-Host "##vso[task.setvariable variable=SAS_URL_WINDOWS;issecret=true]$sasWin"
          }
          if ($sasLinux) {
            Write-Host "##vso[task.setvariable variable=SAS_URL_LINUX;issecret=true]$sasLinux"
          }

          Write-Host "📦 SAS generation complete."

    # =====================================================
    # 🐍 PYTHON GENERATOR
    # =====================================================
    - task: PowerShell@2
      displayName: "Run Python + Copy TF"
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)"

          $env:PROJECT_NAME = "${{ parameters.project }}"
          $env:ENVIRONMENT = "${{ parameters.environment }}"
          $env:SAS_URL_WINDOWS = "$(SAS_URL_WINDOWS)"
          $env:SAS_URL_LINUX = "$(SAS_URL_LINUX)"

          python "$(tfWorkingDirectory)\core\generate-tf-v2.6.py"
          if ($LASTEXITCODE -ne 0) { throw "Python failed" }

          $tfFile = "$(tfWorkingDirectory)\Project\${{ parameters.project }}\main-${{ parameters.environment }}.tf"
          $dst = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}"
          $ts = (Get-Date -Format 'yyyy-MM-dd-HHmm')

          if (Test-Path $tfFile) {
            Copy-Item $tfFile "$dst\main-${{ parameters.environment }}-$ts.tf" -Force
            Copy-Item $tfFile "$dst\main-${{ parameters.environment }}.tf" -Force
            Write-Host "📦 TF copied to state folder"
          }

    # =====================================================
    # TERRAFORM PLAN
    # =====================================================
    - task: PowerShell@2
      displayName: "Terraform Validate + Plan"
      inputs:
        targetType: 'inline'
        script: |
          $tfProjectPath = "$(tfWorkingDirectory)\Project\${{ parameters.project }}"
          $tfStatePath   = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}"

          if (!(Test-Path $tfProjectPath)) {
            throw "❌ Missing project folder: $tfProjectPath"
          }

          Set-Location $tfProjectPath

          terraform init
          terraform validate

          terraform plan -out "$tfStatePath\tfplan"
          terraform show "$tfStatePath\tfplan" > "$tfStatePath\tfplan.txt"

          Write-Host "📄 Plan saved to: $tfStatePath"

    - ${{ if eq(parameters.action, 'modify') }}:
      - task: PowerShell@2
        displayName: "Show Modify Summary"
        inputs:
          targetType: 'inline'
          script: |
            $path = "$(tfStateDirectory)\${{ parameters.project }}\${{ parameters.environment }}\tfplan.txt"
            if (Test-Path $path) {
              Write-Host "🔍 Modify Summary:"
              Get-Content $path | Select-String -Pattern "Plan:" -Context 2,2
            }
# ===================================================
#  STAGE 2 — APPLY (ENHANCED v2.6)
# ===================================================
- stage: TerraformApply
  displayName: "Terraform Apply Stage (Requires Approval)"
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    displayName: "Apply Terraform"
    environment: 'vm-deploy'
    pool:
      name: cloudops-agent

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          # =====================================================
          # Azure Login for this job (fresh environment)
          # =====================================================
          - task: PowerShell@2
            displayName: "Azure Login"
            inputs:
              targetType: 'inline'
              script: |
                Write-Host "🔐 Logging into Azure..."
                az login `
                  --service-principal `
                  -u "$(ARM_CLIENT_ID)" `
                  -p "$(ARM_CLIENT_SECRET)" `
                  --tenant "$(ARM_TENANT_ID)"

                if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
                Write-Host "Azure login OK."

          # =====================================================
          # TERRAFORM APPLY WITH RETRY + BACKUP + SUMMARY
          # =====================================================
          - task: PowerShell@2
            displayName: "Terraform Apply (Enhanced)"
            inputs:
              targetType: 'inline'
              script: |
                $project = "${{ parameters.project }}"
                $envName = "${{ parameters.environment }}"
                $tfStatePath = "$(tfStateDirectory)\$project\$envName"

                Write-Host "📁 Using TF state path: $tfStatePath"

                if (!(Test-Path $tfStatePath)) {
                  throw "❌ Missing Terraform state directory: $tfStatePath"
                }

                $tfFile  = Join-Path $tfStatePath "main-$envName.tf"
                $planFile = Join-Path $tfStatePath "tfplan"
                $tfstateFile = Join-Path $tfStatePath "terraform.tfstate"
                $backupDir = Join-Path $tfStatePath "backups"

                if (!(Test-Path $tfFile)) { throw "❌ Missing TF file: $tfFile" }
                if (!(Test-Path $planFile)) { throw "❌ Missing tfplan file: $planFile" }

                # =====================================================
                # Create backup directory if missing
                # =====================================================
                if (!(Test-Path $backupDir)) {
                  New-Item -Path $backupDir -ItemType Directory -Force | Out-Null
                }

                # =====================================================
                # Backup existing terraform.tfstate (if any)
                # =====================================================
                if (Test-Path $tfstateFile) {
                  $timestamp = (Get-Date -Format 'yyyyMMdd-HHmmss')
                  $backupFile = Join-Path $backupDir "terraform-$timestamp.tfstate.bak"
                  Copy-Item $tfstateFile $backupFile -Force
                  Write-Host "🟩 State backup created: $backupFile"
                } else {
                  Write-Host "ℹ️ No existing tfstate to back up."
                }

                Write-Host "📌 Switching to state directory..."
                Set-Location $tfStatePath

                # =====================================================
                # Retry Logic for Terraform Apply
                # =====================================================
                $maxRetries = 3
                $retry = 0
                $success = $false

                while ($retry -lt $maxRetries -and -not $success) {
                  try {
                    Write-Host "🚀 Attempt $(retry + 1)/$maxRetries: terraform apply tfplan"
                    terraform apply -auto-approve "tfplan"
                    if ($LASTEXITCODE -eq 0) {
                      $success = $true
                      Write-Host "✔️ Terraform Apply succeeded."
                    } else {
                      throw "Terraform apply failed with exit code $LASTEXITCODE"
                    }
                  }
                  catch {
                    Write-Warning "⚠️ Terraform apply failed: $_"
                    $retry++
                    if ($retry -lt $maxRetries) {
                      Write-Host "🔁 Retrying in 15 seconds..."
                      Start-Sleep -Seconds 15
                    }
                  }
                }

                if (-not $success) {
                  throw "❌ Terraform apply failed after $maxRetries attempts."
                }

                # =====================================================
                # APPLY SUMMARY (extract from tfstate)
                # =====================================================
                if (Test-Path $tfstateFile) {
                  Write-Host "📄 **Terraform Apply Summary**"
                  Write-Host "--------------------------------"

                  terraform show -json $tfstateFile | `
                    ConvertFrom-Json | `
                    Select-Object -ExpandProperty values | `
                    Select-Object resources | `
                    Out-String | Write-Host
                }

                Write-Host "🎉 Terraform Apply complete!"