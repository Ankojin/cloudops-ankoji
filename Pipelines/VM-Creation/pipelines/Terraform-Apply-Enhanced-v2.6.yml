trigger:
- none

pool:
  name: cloudops-agent

parameters:
  - name: action
    displayName: "Action to Perform"
    type: string
    default: apply
    values: [apply, modify]

  - name: environment
    displayName: "Target Environment"
    type: string
    default: DEV
    values: [DEV, SIT]

  - name: project
    displayName: "Project Name"
    type: string
    default: pilot-test

  - name: tags_json_override
    displayName: "Tags (JSON Format)"
    type: string
    default: '{"Company":"BAB","Department":"Information Technology","ProjectName":"pilot-test","ApplicationName":"pilot-test","Region":"Sweden Central","ApproverName":"pilot-test","RequesterName":"CloudOps Team","BusinessOwner":"pilot-test","TechnicalOwner":"pilot-test","CostCenter":"pilot-test","ServiceClass":"pilot-test","ManagedBy":"CloudOps Team"}'

variables:
  - name: tfWorkingDirectory
    value: "$(Build.SourcesDirectory)/Pipelines/VM-Creation"
  - name: tfStateDirectory
    value: "C:/TerraformState/Project"
  - group: TerraformVariables
  - ${{ if eq(parameters.environment, 'DEV') }}:
    - group: VM-Creation-DEV
  - ${{ if eq(parameters.environment, 'SIT') }}:
    - group: VM-Creation-SIT
  - name: pythonVersion
    value: "3.9"

stages:
# =========================
#  STAGE 1: TERRAFORM PLAN
# =========================
- stage: TerraformPlan
  displayName: "Terraform Plan Stage"
  jobs:
  - job: PlanJob
    displayName: "Generate + Validate + Plan"
    pool:
      name: cloudops-agent
    steps:

    - task: UsePythonVersion@0
      displayName: "Setup Python $(pythonVersion)"
      inputs:
        versionSpec: '$(pythonVersion)'
        architecture: 'x64'

    - task: PowerShell@2
      displayName: "Set Environment Variables from Variable Groups"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "Setting environment variables for ${{ parameters.environment }}..."
          $env:PROJECT_NAME = "${{ parameters.project }}"
          $env:ENVIRONMENT = "${{ parameters.environment }}"
          $env:SUBSCRIPTION_ID = "$(subscription_id)"
          $env:LOCATION = "$(location)"
          $env:VNET_NAME = "$(vnet_name)"
          $env:VNET_RG = "$(vnet_rg)"
          $env:SUBNET_RG = "$(subnet_rg)"
          $env:KEYVAULT_NAME = "$(keyvault_name)"
          $env:KEYVAULT_RG = "$(keyvault_rg)"
          $env:DCR_NAME = "$(dcr_name)"
          $env:DCR_RG = "$(dcr_rg)"
          $env:DIAGNOSTICS_STORAGE = "$(diagnostics_storage)"
          $env:DIAGNOSTICS_STORAGE_RG = "$(diagnostics_storage_rg)"
          $env:SCRIPT_STORAGE_ACCOUNT = "$(script_storage_account)"
          $env:SCRIPT_STORAGE_CONTAINER = "$(script_storage_container)"
          $env:SCRIPT_BLOB_NAME_WINDOWS = "$(script_blob_name_windows)"
          $env:SCRIPT_BLOB_NAME_LINUX = "$(script_blob_name_linux)"
          $env:SCRIPT_STORAGE_KEY = "$(script_storage_key)"
          $env:shutdown_enabled = "$(shutdown_enabled)"
          $env:shutdown_time = "$(shutdown_time)"
          $env:shutdown_timezone = "$(shutdown_timezone)"

          Write-Host "✅ Using Project: $($env:PROJECT_NAME)"
          Write-Host "✅ Using Environment: $($env:ENVIRONMENT)"
          New-Item -Path "$(tfStateDirectory)/$($env:PROJECT_NAME)/$($env:ENVIRONMENT)" -ItemType Directory -Force | Out-Null

    - task: PowerShell@2
      displayName: "Azure Login"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔐 Logging into Azure..."
          az login --service-principal -u "$(ARM_CLIENT_ID)" -p "$(ARM_CLIENT_SECRET)" --tenant "$(ARM_TENANT_ID)"
          if ($LASTEXITCODE -ne 0) { throw "Azure login failed" }
          Write-Host "✅ Azure login successful."

    # =====================
    # 🔑 SAS TOKEN GENERATION
    # =====================
    - task: PowerShell@2
      displayName: "Generate SAS URLs for Custom Script Blobs"
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "🔑 Generating SAS tokens for Custom Script blobs..."
          
          # Input values from pipeline variables
          $account   = "$(script_storage_account)"
          $container = "$(script_storage_container)"
          $key       = "$(script_storage_key)"
          $expiry    = (Get-Date).AddHours(24).ToString("yyyy-MM-ddTHH:mmZ")

          if (-not $account -or -not $container -or -not $key) {
              Write-Error "❌ Missing SCRIPT_STORAGE_ACCOUNT, SCRIPT_STORAGE_CONTAINER, or SCRIPT_STORAGE_KEY"
              exit 1
          }

          # Required for az CLI key access
          $env:AZURE_STORAGE_KEY = $key

          function Generate-SasUrl {
            param(
              [string]$BlobName
            )
            
            if ([string]::IsNullOrWhiteSpace($BlobName)) {
                Write-Warning "⚠️ Blob name empty — skipping"
                return $null
            }

            try {
                Write-Host "🔄 Generating SAS token for: $BlobName"

                $sas = az storage blob generate-sas `
                    --account-name $account `
                    --container-name $container `
                    --name $BlobName `
                    --permissions r `
                    --expiry $expiry `
                    --auth-mode key `
                    --https-only `
                    -o tsv

                if (-not $sas) {
                    Write-Warning "⚠️ az CLI returned empty SAS for $BlobName"
                    return $null
                }

                $url = "https://$account.blob.core.windows.net/$container/$BlobName?$sas"

                Write-Host "✔️ SAS URL generated for $BlobName:"
                Write-Host $url

                return $url
            }
            catch {
                Write-Warning ("⚠️ Failed SAS generation for {0}: {1}" -f $BlobName, $_)
                return $null
            }
          }

          # Blob names from variables
          $winBlob   = "$(script_blob_name_windows)"
          $linuxBlob = "$(script_blob_name_linux)"

          # Generate SAS URLs
          $sasWin   = Generate-SasUrl -BlobName $winBlob
          $sasLinux = Generate-SasUrl -BlobName $linuxBlob

          # Export to pipeline variables (secret)
          if ($sasWin) {
            Write-Host "##vso[task.setvariable variable=SAS_URL_WINDOWS;issecret=true]$sasWin"
            Write-Host "🔐 Stored SAS_URL_WINDOWS"
          }
          if ($sasLinux) {
            Write-Host "##vso[task.setvariable variable=SAS_URL_LINUX;issecret=true]$sasLinux"
            Write-Host "🔐 Stored SAS_URL_LINUX"
          }

          Write-Host "📦 SAS generation complete."

    # =====================
    # 🐍 PYTHON GENERATOR
    # =====================
    - task: PowerShell@2
      displayName: "Run Python + Copy TF"
      inputs:
        targetType: 'inline'
        script: |
          Set-Location "$(tfWorkingDirectory)"
          Write-Host "🐍 Running Terraform Generator..."
          $env:PROJECT_NAME = "${{ parameters.project }}"
          $env:ENVIRONMENT  = "${{ parameters.environment }}"
          $env:SAS_URL_WINDOWS = "$(SAS_URL_WINDOWS)"
          $env:SAS_URL_LINUX   = "$(SAS_URL_LINUX)"
          python "$(tfWorkingDirectory)/core/generate-tf-v2.6.py"
          if ($LASTEXITCODE -ne 0) { throw "Python script failed" }

          $tfFile = "$(tfWorkingDirectory)/Project/${{ parameters.project }}/main-${{ parameters.environment }}.tf".ToLower()
          $dst = "C:/TerraformState/Project/${{ parameters.project }}/${{ parameters.environment }}"
          $ts = (Get-Date -Format 'yyyy-MM-dd-HHmm')
          if (Test-Path $tfFile) {
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
              Copy-Item $tfFile "$dst/main-${{ parameters.environment }}.tf" -Force
              Write-Host "📦 Copied TF file to $dst"
          }

    - task: PowerShell@2
      displayName: "Terraform Validate + Plan"
      inputs:
        targetType: 'inline'
        script: |
          # Compute project directory again (variables do not persist between tasks)
          $tfProjectPath = Join-Path "$(tfWorkingDirectory)" "Project/${{ parameters.project }}"

          if (Test-Path $tfProjectPath) {
              Write-Host "📁 Working directory set to: $tfProjectPath"
              Set-Location $tfProjectPath
          } else {
              Write-Error "❌ Terraform project path not found: $tfProjectPath"
              exit 1
          }

          terraform init
          terraform validate
          terraform plan -out=tfplan

          # Generate tfplan.txt inside same directory
          terraform show tfplan > "$tfProjectPath/tfplan.txt"
          Write-Host "📄 tfplan.txt saved to $tfProjectPath"

          Write-Host "✅ Terraform plan complete."


    # ✅ Enhancement: Show Modify Summary only if action=modify
    - ${{ if eq(parameters.action, 'modify') }}:
      - task: PowerShell@2
        displayName: "Show Modify Summary"
        inputs:
          targetType: 'inline'
          script: |
            $tfPlanPath = "$(tfWorkingDirectory)/Project/${{ parameters.project }}/tfplan.txt"
            if (Test-Path $tfPlanPath) {
              Write-Host "🔍 Terraform Modify Summary:"
              Get-Content $tfPlanPath | Select-String -Pattern "Plan:" -Context 2,2
            } else {
              Write-Warning "⚠️ tfplan.txt not found for modify summary"
            }

# =========================
#  STAGE 2: APPLY (WITH APPROVAL)
# =========================
- stage: TerraformApply
  displayName: "Terraform Apply Stage (Requires Approval)"
  dependsOn: TerraformPlan
  condition: succeeded()

  jobs:
  - deployment: ApplyJob
    displayName: "Run Terraform Apply After Approval"
    environment: 'vm-deploy'
    pool:
      name: cloudops-agent

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: PowerShell@2
            displayName: "Terraform Apply"
            inputs:
              targetType: 'inline'
              script: |
                # Rebuild tfProjectPath (variables do NOT persist between tasks)
                $tfProjectPath = Join-Path "$(tfWorkingDirectory)" "Project/${{ parameters.project }}"

                if (Test-Path $tfProjectPath) {
                    Write-Host "📁 Working directory set to: $tfProjectPath"
                    Set-Location $tfProjectPath
                } else {
                    Write-Error "❌ Terraform project path not found: $tfProjectPath"
                    exit 1
                }

                terraform apply -auto-approve tfplan

                # Persist Terraform state + tf + lock files
                $dst = "$(TF_STATE_PATH)"
                $ts  = (Get-Date -Format 'yyyy-MM-dd-HHmm')
                New-Item -Path $dst -ItemType Directory -Force | Out-Null

                $tf = "main-${{ parameters.environment }}.tf".ToLower()

                if (Test-Path $tf) {
                    Copy-Item $tf "$dst/main-${{ parameters.environment }}-$ts.tf" -Force
                    Copy-Item $tf "$dst/" -Force
                }

                if (Test-Path "terraform.tfstate") {
                    Copy-Item "terraform.tfstate" "$dst/" -Force
                }

                if (Test-Path ".terraform.lock.hcl") {
                    Copy-Item ".terraform.lock.hcl" "$dst/" -Force
                }

                Write-Host "🎉 Terraform Apply completed successfully!"