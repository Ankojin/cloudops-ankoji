trigger: none

pool:
  name: cloudops-agent

parameters:
  - name: time_zone
    displayName: 'Time Zone (applies to all VMs)'
    type: string
    default: 'Arab Standard Time'

variables:
- group: TerraformVariables
- group: cloud-subs

jobs:
- job: ConfigureMultipleResourceGroups
  displayName: "Configure Auto-Shutdown for Multiple Resource Groups (CSV)"
  pool:
    name: cloudops-agent

  steps:
  # =============================
  # 🔹 Terraform Install
  # =============================
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'
    displayName: 'Install Terraform'

  # =============================
  # 🔹 Setup Terraform State Directory
  # =============================
  - powershell: |
      $stateBaseDir = "C:\TerraformState\autoshutdown"
      
      Write-Host "Setting up Terraform state directory..."
      Write-Host "Base Directory: $stateBaseDir`n"
      
      # Create base directory if it doesn't exist
      if (-not (Test-Path $stateBaseDir)) {
        Write-Host "Creating state directory: $stateBaseDir"
        New-Item -ItemType Directory -Path $stateBaseDir -Force | Out-Null
        Write-Host "✅ Directory created successfully"
      } else {
        Write-Host "✅ State directory already exists"
      }
      
      Write-Host "`nState files will be stored at: $stateBaseDir"
      Write-Host "Naming format: <Subscription>-<ResourceGroup>.tfstate"
      Write-Host "Each resource group will have its own isolated state file.`n"
      Write-Host "========================================="
    displayName: 'Setup Terraform State Directory'

  # =============================
  # 🔹 Process CSV Configuration
  # =============================
  - powershell: |
      Write-Host "========================================="
      Write-Host "Azure VM Auto-Shutdown Configuration"
      Write-Host "Multiple Resource Groups (CSV) Mode"
      Write-Host "=========================================`n"

      # Debug: Show available subscription environment variables
      Write-Host "🔍 Available Subscription Environment Variables:"
      Write-Host "  BAB_DEV_SUBSCRIPTION_ID: $(if ($env:BAB_DEV_SUBSCRIPTION_ID) { 'Set' } else { 'NOT SET' })"
      Write-Host "  BAB_SIT_SUBSCRIPTION_ID: $(if ($env:BAB_SIT_SUBSCRIPTION_ID) { 'Set' } else { 'NOT SET' })"
      Write-Host "  BAB_CORE_SUBSCRIPTION_ID: $(if ($env:BAB_CORE_SUBSCRIPTION_ID) { 'Set' } else { 'NOT SET' })"
      Write-Host ""

      function Format-VMNames {
        param([string]$vmNamesString)
        
        if ([string]::IsNullOrWhiteSpace($vmNamesString)) {
          return ""
        }
        
        # Split by comma, trim whitespace, and remove empty entries
        $vmNames = $vmNamesString -split ',' | ForEach-Object { $_.Trim() } | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
        
        if ($vmNames.Count -eq 0) {
          return ""
        }
        
        # Join back with commas (no spaces for Terraform)
        return ($vmNames -join ',')
      }

      function Get-SubscriptionId {
        param([string]$SubscriptionName)
        
        Write-Host "    🔍 Resolving subscription: '$SubscriptionName'"
        
        $subId = ""
        switch ($SubscriptionName.Trim()) {
          "BAB_DEV" {
            $subId = $env:BAB_DEV_SUBSCRIPTION_ID -replace '"', ''
            Write-Host "    ✅ Resolved BAB_DEV subscription: $subId"
          }
          "BAB_SIT" {
            $subId = $env:BAB_SIT_SUBSCRIPTION_ID -replace '"', ''
            Write-Host "    ✅ Resolved BAB_SIT subscription: $subId"
          }
          "BAB_CORE" {
            $subId = $env:BAB_CORE_SUBSCRIPTION_ID -replace '"', ''
            Write-Host "    ✅ Resolved BAB_CORE subscription: $subId"
          }
          default {
            Write-Error "    ❌ Unknown subscription: '$SubscriptionName'"
            Write-Host "    Available subscriptions: BAB_DEV, BAB_SIT, BAB_CORE"
            return $null
          }
        }
        
        if ([string]::IsNullOrWhiteSpace($subId)) {
          Write-Error "Subscription ID for $SubscriptionName is empty!"
          return $null
        }
        
        return $subId
      }

      # Read CSV file
      $csvPath = "$(System.DefaultWorkingDirectory)/Pipelines/autoshutdown/multiple_csv.csv"
      
      Write-Host "📂 Reading CSV file from: $csvPath`n"
      
      if (-not (Test-Path $csvPath)) {
        Write-Error "❌ CSV file not found at $csvPath"
        Write-Host "`nPlease ensure the file exists with the following format:"
        Write-Host "Subscription,ResourceGroupName,DBVMs,DBShutdownTime,AppVMs,AppShutdownTime"
        Write-Host "BAB_DEV,rg-dev-app,sql-dev-01,2200,web-dev-01,2000"
        Write-Host "BAB_SIT,rg-sit-app,db-vm-02,2200,,2000"
        Write-Host ""
        Write-Host "💡 Multiple rows with same Subscription+ResourceGroup will be grouped together"
        Write-Host "💡 Each row can specify either DB VMs, App VMs, or both"
        Write-Host "💡 VMs can be comma-separated: VM1,VM2,VM3"
        exit 1
      }

      try {
        # Read CSV with better error handling
        $csvContent = Get-Content $csvPath -ErrorAction Stop
        if ($csvContent.Count -eq 0) {
          Write-Error "❌ CSV file is empty!"
          exit 1
        }
        
        Write-Host "📄 CSV file contains $($csvContent.Count) lines (including header)"
        
        try {
          $rows = $csvContent | ConvertFrom-Csv -ErrorAction Stop
        }
        catch {
          Write-Error "❌ Failed to parse CSV content: $_"
          Write-Host "Please check CSV format. Expected format:"
          Write-Host "Subscription,ResourceGroupName,DBVMs,DBShutdownTime,AppVMs,AppShutdownTime"
          exit 1
        }
        
        if ($rows.Count -eq 0) {
          Write-Error "❌ No data rows found in CSV (only header)!"
          exit 1
        }
        
        # Validate CSV columns
        $requiredColumns = @('Subscription', 'ResourceGroupName', 'DBVMs', 'DBShutdownTime', 'AppVMs', 'AppShutdownTime')
        $criticalColumns = @('Subscription', 'ResourceGroupName')
        $firstRow = $rows[0]
        $actualColumns = $firstRow.PSObject.Properties.Name
        
        Write-Host "📋 CSV Columns Found: $($actualColumns -join ', ')"
        
        # Check for critical columns
        $missingCriticalColumns = $criticalColumns | Where-Object { $_ -notin $actualColumns }
        if ($missingCriticalColumns.Count -gt 0) {
          Write-Error "❌ Missing critical CSV columns: $($missingCriticalColumns -join ', ')"
          Write-Host "Critical columns are required for processing."
          exit 1
        }
        
        # Check for optional columns
        $missingOptionalColumns = $requiredColumns | Where-Object { $_ -notin $actualColumns -and $_ -notin $criticalColumns }
        if ($missingOptionalColumns.Count -gt 0) {
          Write-Host "ℹ️ Missing optional CSV columns: $($missingOptionalColumns -join ', ')"
          Write-Host "ℹ️ Will use default values for missing columns"
        } else {
          Write-Host "✅ All expected columns are present"
        }
        
        Write-Host "Found $($rows.Count) resource group(s) in CSV`n"
        
        # Show all CSV rows for debugging
        Write-Host "📋 CSV Content Preview:"
        for ($i = 0; $i -lt $rows.Count; $i++) {
          $row = $rows[$i]
          Write-Host "  Row $($i + 1): Subscription='$($row.Subscription)', RG='$($row.ResourceGroupName)', DBVMs='$($row.DBVMs)', AppVMs='$($row.AppVMs)'"
        }
        Write-Host ""
        Write-Host "ℹ️ Processing: VMs will be grouped by Subscription + Resource Group"
        Write-Host "ℹ️ Multiple rows with same RG will be combined into single Terraform run"
        Write-Host ""

        # Group and process VMs by subscription and resource group
        $resourceGroups = @{}
        $skippedRows = @()
        
        foreach ($row in $rows) {
          Write-Host "Processing CSV row: Subscription='$($row.Subscription)', ResourceGroup='$($row.ResourceGroupName)'"
          
          # Validate critical required fields only
          if ([string]::IsNullOrWhiteSpace($row.Subscription)) {
            Write-Warning "⚠️ Skipping row - Subscription is empty (this is required)"
            $skippedRows += "Row with empty Subscription"
            continue
          }
          
          if ([string]::IsNullOrWhiteSpace($row.ResourceGroupName)) {
            Write-Warning "⚠️ Skipping row - ResourceGroupName is empty (this is required)"
            $skippedRows += "Row with empty ResourceGroupName"
            continue
          }
          
          # Get subscription ID
          Write-Host "  🔍 Looking up subscription: '$($row.Subscription)'"
          $subscriptionId = Get-SubscriptionId -SubscriptionName $row.Subscription.Trim()
          if ($null -eq $subscriptionId) {
            Write-Warning "⚠️ Skipping $($row.ResourceGroupName) - Invalid subscription: '$($row.Subscription)'"
            $skippedRows += "$($row.Subscription)/$($row.ResourceGroupName) - Invalid subscription"
            continue
          }
          Write-Host "  ✅ Subscription ID resolved: $subscriptionId"
          
          # Create unique key for grouping
          $rgKey = "$($row.Subscription.Trim())|$($row.ResourceGroupName.Trim())"
          
          # Initialize resource group entry if not exists
          if (-not $resourceGroups.ContainsKey($rgKey)) {
            $resourceGroups[$rgKey] = @{
              subscription = $row.Subscription.Trim()
              subscription_id = $subscriptionId
              name = $row.ResourceGroupName.Trim()
              db_vms = @()
              app_vms = @()
              db_shutdown_times = @()
              app_shutdown_times = @()
            }
          }
          
          # Process DB VMs
          $dbVMsRaw = if ($row.PSObject.Properties.Name -contains 'DBVMs') { 
            if ($null -eq $row.DBVMs) { "" } else { $row.DBVMs.ToString().Trim() }
          } else { "" }
          
          $appVMsRaw = if ($row.PSObject.Properties.Name -contains 'AppVMs') { 
            if ($null -eq $row.AppVMs) { "" } else { $row.AppVMs.ToString().Trim() }
          } else { "" }
          
          # Process shutdown times
          $dbShutdownTime = if ($row.PSObject.Properties.Name -contains 'DBShutdownTime') { 
            if ($null -eq $row.DBShutdownTime) { "" } else { $row.DBShutdownTime.ToString().Trim() }
          } else { "" }
          
          $appShutdownTime = if ($row.PSObject.Properties.Name -contains 'AppShutdownTime') { 
            if ($null -eq $row.AppShutdownTime) { "" } else { $row.AppShutdownTime.ToString().Trim() }
          } else { "" }
          
          # Add VMs to the resource group
          if (-not [string]::IsNullOrWhiteSpace($dbVMsRaw)) {
            $dbVmList = Format-VMNames -vmNamesString $dbVMsRaw
            if (-not [string]::IsNullOrWhiteSpace($dbVmList)) {
              $resourceGroups[$rgKey].db_vms += $dbVmList -split ','
              $resourceGroups[$rgKey].db_shutdown_times += if ([string]::IsNullOrWhiteSpace($dbShutdownTime)) { "2200" } else { $dbShutdownTime }
            }
          }
          
          if (-not [string]::IsNullOrWhiteSpace($appVMsRaw)) {
            $appVmList = Format-VMNames -vmNamesString $appVMsRaw
            if (-not [string]::IsNullOrWhiteSpace($appVmList)) {
              $resourceGroups[$rgKey].app_vms += $appVmList -split ','
              $resourceGroups[$rgKey].app_shutdown_times += if ([string]::IsNullOrWhiteSpace($appShutdownTime)) { "2000" } else { $appShutdownTime }
            }
          }
          
          Write-Host "  ✅ Added to resource group: $rgKey"
        }
        
        # Convert to final configuration array
        $config = @()
        foreach ($rgKey in $resourceGroups.Keys) {
          $rg = $resourceGroups[$rgKey]
          
          # Get most common shutdown times (or use defaults)
          $dbShutdownTime = if ($rg.db_shutdown_times.Count -gt 0) { 
            ($rg.db_shutdown_times | Group-Object | Sort-Object Count -Descending | Select-Object -First 1).Name 
          } else { "2200" }
          
          $appShutdownTime = if ($rg.app_shutdown_times.Count -gt 0) { 
            ($rg.app_shutdown_times | Group-Object | Sort-Object Count -Descending | Select-Object -First 1).Name 
          } else { "2000" }
          
          # Remove duplicates and join VMs
          $uniqueDbVms = ($rg.db_vms | Sort-Object | Get-Unique) -join ','
          $uniqueAppVms = ($rg.app_vms | Sort-Object | Get-Unique) -join ','
          
          $config += @{
            subscription = $rg.subscription
            subscription_id = $rg.subscription_id
            name = $rg.name
            db_vms = $uniqueDbVms
            db_shutdown = $dbShutdownTime
            app_vms = $uniqueAppVms
            app_shutdown = $appShutdownTime
          }
          
          Write-Host "📦 Consolidated Resource Group: $($rg.subscription)/$($rg.name)"
          if ($uniqueDbVms) {
            Write-Host "  🗄️ DB VMs ($($rg.db_vms.Count)): $uniqueDbVms (Shutdown: $dbShutdownTime)"
          }
          if ($uniqueAppVms) {
            Write-Host "  📱 App VMs ($($rg.app_vms.Count)): $uniqueAppVms (Shutdown: $appShutdownTime)"
          }
          if (-not $uniqueDbVms -and -not $uniqueAppVms) {
            Write-Host "  ℹ️ No VMs specified, but resource group will be processed"
          }
        }
        
        if ($config.Count -eq 0) {
          Write-Warning "⚠️ No resource groups were processed from CSV!"
          Write-Host "This could be due to:"
          Write-Host "  - All rows having invalid subscription names"
          Write-Host "  - All rows missing required Subscription or ResourceGroupName values"
          Write-Host "  - CSV file format issues"
          if ($skippedRows.Count -gt 0) {
            Write-Host "`nSkipped rows:"
            foreach ($skipped in $skippedRows) {
              Write-Host "  ❌ $skipped"
            }
          }
          Write-Host "ℹ️ The pipeline will continue but no resources will be configured."
          exit 1
        }
        
        Write-Host "`n✅ Processed $($config.Count) unique resource group(s) from $($rows.Count) CSV rows"
        if ($skippedRows.Count -gt 0) {
          Write-Host "⚠️ Skipped $($skippedRows.Count) row(s) due to issues"
        }
        
        # Group by subscription for summary
        $groupedBySubscription = $config | Group-Object -Property subscription
        foreach ($group in $groupedBySubscription) {
          Write-Host "  📦 $($group.Name): $($group.Count) resource group(s)"
        }
        Write-Host ""
        
      }
      catch {
        Write-Error "❌ Failed to parse CSV file: $_"
        Write-Host "`nExpected CSV format:"
        Write-Host "Subscription,ResourceGroupName,DBVMs,DBShutdownTime,AppVMs,AppShutdownTime"
        Write-Host "BAB_DEV,rg-dev-app,sql-dev-01,2200,web-dev-01,2000"
        Write-Host "BAB_SIT,rg-sit-app,db-vm-02,2200,,2000"
        Write-Host ""
        Write-Host "💡 Rows with same Subscription+ResourceGroup are grouped together"
        exit 1
      }

      # Process each resource group
      $successCount = 0
      $failedRGs = @()
      $processedRGs = @()
      $stateBaseDir = "C:\TerraformState\autoshutdown"
      
      # Ensure state directory exists and is accessible
      Write-Host "`n🔧 Validating Terraform State Directory..."
      if (-not (Test-Path $stateBaseDir)) {
        Write-Host "Creating state directory: $stateBaseDir"
        try {
          New-Item -ItemType Directory -Path $stateBaseDir -Force | Out-Null
          Write-Host "✅ State directory created successfully"
        }
        catch {
          Write-Error "❌ Failed to create state directory: $_"
          exit 1
        }
      } else {
        Write-Host "✅ State directory exists: $stateBaseDir"
      }
      
      # Test write permissions
      $testFile = "$stateBaseDir\write-test-$(Get-Date -Format 'yyyyMMdd-HHmmss').tmp"
      try {
        "test" | Out-File -FilePath $testFile -Force
        Remove-Item $testFile -Force
        Write-Host "✅ Write permissions confirmed for state directory"
      }
      catch {
        Write-Error "❌ No write permissions to state directory: $_"
        exit 1
      }
      
      Write-Host "📁 State files will be saved to: $stateBaseDir"
      Write-Host "📝 Naming format: <Subscription>-<ResourceGroup>.tfstate`n"
      
      # Setup Azure CLI authentication for import operations
      Write-Host "🔐 Setting up Azure CLI authentication for imports..."
      try {
        # Login using service principal
        az login --service-principal `
          --username $env:ARM_CLIENT_ID `
          --password $env:ARM_CLIENT_SECRET `
          --tenant $env:ARM_TENANT_ID `
          --output none
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ Azure CLI authentication successful"
        } else {
          Write-Warning "⚠️ Azure CLI authentication failed - imports may not work"
        }
      }
      catch {
        Write-Warning "⚠️ Azure CLI setup failed: $_ - imports may not work"
      }
      Write-Host ""

      foreach ($rg in $config) {
        Write-Host "`n========================================="
        Write-Host "Processing: $($rg.name)"
        Write-Host "Subscription: $($rg.subscription)"
        Write-Host "=========================================`n"
        
        # Define state file path for this resource group
        $sanitizedRgName = $rg.name -replace '[^a-zA-Z0-9-_]', '_'
        $stateFileName = "$($rg.subscription)-$sanitizedRgName.tfstate"
        $stateFile = Join-Path $stateBaseDir $stateFileName
        $stateFilePath = $stateFile -replace '\\', '/'
        
        Write-Host "💾 State Configuration:"
        Write-Host "  Directory: $stateBaseDir"
        Write-Host "  File Name: $stateFileName"
        Write-Host "  Full Path: $stateFile"
        Write-Host "  Terraform Path: $stateFilePath"
        
        # Check if state file exists
        if (Test-Path $stateFile) {
          $fileInfo = Get-Item $stateFile
          Write-Host "⚠️ Existing state file found"
          Write-Host "  Last Modified: $($fileInfo.LastWriteTime)"
          Write-Host "  Size: $([math]::Round($fileInfo.Length / 1KB, 2)) KB"
        } else {
          Write-Host "✅ New state file will be created"
        }
        Write-Host ""
        
        $hasDbVms = -not [string]::IsNullOrWhiteSpace($rg.db_vms)
        $hasAppVms = -not [string]::IsNullOrWhiteSpace($rg.app_vms)
        
        Write-Host "Configuration:"
        if ($hasDbVms) {
          Write-Host "  📊 DB VMs: $($rg.db_vms)"
          Write-Host "  🕐 DB Shutdown Time: $($rg.db_shutdown)"
        }
        if ($hasAppVms) {
          Write-Host "  📱 App VMs: $($rg.app_vms)"
          Write-Host "  🕐 App Shutdown Time: $($rg.app_shutdown)"
        }
        Write-Host ""
        
        # Change to Terraform directory
        Set-Location "$(System.DefaultWorkingDirectory)/Pipelines/autoshutdown"
        
        # Initialize Terraform with unique state file
        Write-Host "🔧 Initializing Terraform..."
        Write-Host "  Backend: local"
        Write-Host "  State Path: $stateFilePath"
        $env:ARM_SUBSCRIPTION_ID = $rg.subscription_id
        
        # Ensure the state file directory exists (in case of nested paths)
        $stateFileDir = Split-Path $stateFile -Parent
        if (-not (Test-Path $stateFileDir)) {
          New-Item -ItemType Directory -Path $stateFileDir -Force | Out-Null
          Write-Host "  ✅ Created state file directory: $stateFileDir"
        }
        
        terraform init -reconfigure -backend-config="path=$stateFilePath"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform init failed for $($rg.name)"
          Write-Host "  State file path: $stateFilePath"
          Write-Host "  Working directory: $(Get-Location)"
          $failedRGs += "$($rg.subscription)/$($rg.name)"
          continue
        }
        Write-Host "✅ Terraform initialized successfully"
        
        # Verify state file was created/updated
        if (Test-Path $stateFile) {
          Write-Host "✅ State file confirmed at: $stateFile"
        } else {
          Write-Warning "⚠️ State file not found after init - this may be expected for new configurations"
        }
        Write-Host ""
        
        # Validate
        Write-Host "🔍 Running terraform validate..."
        terraform validate
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform validation failed for $($rg.name)"
          $failedRGs += "$($rg.subscription)/$($rg.name)"
          continue
        }
        Write-Host "✅ Validation passed`n"
        
        # Plan
        Write-Host "📋 Running terraform plan..."
        $planFile = "tfplan-$($rg.subscription)-$($rg.name -replace '[^a-zA-Z0-9-]', '_').tfplan"
        $fullPlanPath = Join-Path (Get-Location) $planFile
        
        Write-Host "Plan file: $planFile"
        Write-Host "Full path: $fullPlanPath"
        
        terraform plan -out="$planFile" `
          -var="subscription_id=$($rg.subscription_id)" `
          -var="tenant_id=$env:ARM_TENANT_ID" `
          -var="client_id=$env:ARM_CLIENT_ID" `
          -var="client_secret=$env:ARM_CLIENT_SECRET" `
          -var="resource_group_name=$($rg.name)" `
          -var="db_vm_names=$($rg.db_vms)" `
          -var="db_shutdown_time=$($rg.db_shutdown)" `
          -var="app_vm_names=$($rg.app_vms)" `
          -var="app_shutdown_time=$($rg.app_shutdown)" `
          -var="time_zone=${{ parameters.time_zone }}"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform plan failed for $($rg.name)"
          $failedRGs += "$($rg.subscription)/$($rg.name)"
          continue
        }
        Write-Host "✅ Plan created successfully`n"
        
        # Check for and import existing auto-shutdown schedules
        Write-Host "🔍 Checking for existing auto-shutdown schedules..."
        
        # Set Azure CLI context to the correct subscription
        Write-Host "  🔄 Setting Azure CLI subscription context..."
        az account set --subscription $rg.subscription_id
        if ($LASTEXITCODE -ne 0) {
          Write-Warning "  ⚠️ Failed to set subscription context - proceeding without imports"
        } else {
          Write-Host "  ✅ Azure CLI context set to: $($rg.subscription)"
        }
        
        # Get list of VMs that need auto-shutdown
        $allVMs = @()
        if ($rg.db_vms) {
          $allVMs += ($rg.db_vms -split ',') | ForEach-Object { @{name = $_.Trim(); type = "db"} }
        }
        if ($rg.app_vms) {
          $allVMs += ($rg.app_vms -split ',') | ForEach-Object { @{name = $_.Trim(); type = "app"} }
        }
        
        # Track what we find
        $importedSchedules = 0
        $disabledSchedules = 0
        $newSchedules = 0
        
        foreach ($vm in $allVMs) {
          $vmName = $vm.name
          $vmType = $vm.type
          
          # Build the expected Azure resource ID for the auto-shutdown schedule
          $scheduleResourceId = "/subscriptions/$($rg.subscription_id)/resourceGroups/$($rg.name)/providers/Microsoft.DevTestLab/schedules/shutdown-computevm-$vmName"
          
          # Build the Terraform resource address
          $terraformResource = if ($vmType -eq "db") { 
            "azurerm_dev_test_global_vm_shutdown_schedule.db_shutdown[`"$vmName`"]" 
          } else { 
            "azurerm_dev_test_global_vm_shutdown_schedule.app_shutdown[`"$vmName`"]" 
          }
          
          Write-Host "  🔍 Checking VM: $vmName ($vmType)"
          
          # Check if the schedule already exists in Azure
          $existingSchedule = $null
          try {
            $existingSchedule = az resource show --ids $scheduleResourceId --output json 2>$null
            $azExitCode = $LASTEXITCODE
          }
          catch {
            $azExitCode = 1
          }
          
          if ($azExitCode -eq 0 -and $existingSchedule) {
            # Parse the existing schedule details
            $scheduleDetails = $existingSchedule | ConvertFrom-Json
            $isEnabled = $scheduleDetails.properties.status -eq "Enabled"
            $currentTime = $scheduleDetails.properties.dailyRecurrence.time
            
            Write-Host "    ⚠️ Auto-shutdown schedule already exists in Azure"
            Write-Host "    📊 Current Status: $(if ($isEnabled) { '✅ Enabled' } else { '❌ Disabled' })"
            Write-Host "    🕐 Current Time: $currentTime"
            
            if (-not $isEnabled) {
              Write-Host "    🔧 Existing schedule is DISABLED - will import and enable it"
              Write-Host "    ℹ️ This will activate auto-shutdown for this VM"
            } else {
              Write-Host "    ℹ️ Existing schedule is already enabled - will import and update if needed"
            }
            
            Write-Host "    📥 Importing existing schedule into Terraform state..."
            
            # Import the existing resource into Terraform state
            try {
              terraform import $terraformResource $scheduleResourceId 2>$null
              $importExitCode = $LASTEXITCODE
            }
            catch {
              $importExitCode = 1
            }
            
            if ($importExitCode -eq 0) {
              Write-Host "    ✅ Successfully imported existing schedule"
              $importedSchedules++
              if (-not $isEnabled) {
                Write-Host "    🔄 Terraform will enable the auto-shutdown schedule on apply"
                $disabledSchedules++
              }
            } else {
              Write-Host "    ⚠️ Import failed (resource may already be in state)"
              Write-Host "    ℹ️ This is normal if the resource was previously imported"
            }
          } else {
            Write-Host "    ✅ No existing schedule found, will create new enabled schedule"
            $newSchedules++
          }
        }
        
        Write-Host ""
        
        # Summary of import actions
        if ($allVMs.Count -gt 0) {
          Write-Host "📋 Auto-Shutdown Schedule Analysis:"
          Write-Host "  🔍 Total VMs Checked: $($allVMs.Count)"
          Write-Host "  📥 Existing Schedules Imported: $importedSchedules"
          Write-Host "  🆕 New Schedules to Create: $newSchedules"
          if ($disabledSchedules -gt 0) {
            Write-Host "  🔧 Disabled Schedules to Enable: $disabledSchedules"
            Write-Host "  ⚠️ IMPORTANT: $disabledSchedules VM(s) had DISABLED auto-shutdown that will be ENABLED"
          }
          Write-Host "  ✅ All schedules will be ENABLED with specified shutdown times"
          Write-Host ""
        }
        
        # Re-run plan after any imports to get accurate changes
        if ($allVMs.Count -gt 0) {
          Write-Host "🔄 Re-running plan after imports..."
          
          terraform plan -out="$planFile" `
            -var="subscription_id=$($rg.subscription_id)" `
            -var="tenant_id=$env:ARM_TENANT_ID" `
            -var="client_id=$env:ARM_CLIENT_ID" `
            -var="client_secret=$env:ARM_CLIENT_SECRET" `
            -var="resource_group_name=$($rg.name)" `
            -var="db_vm_names=$($rg.db_vms)" `
            -var="db_shutdown_time=$($rg.db_shutdown)" `
            -var="app_vm_names=$($rg.app_vms)" `
            -var="app_shutdown_time=$($rg.app_shutdown)" `
            -var="time_zone=${{ parameters.time_zone }}"
          
          if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ Terraform re-plan failed for $($rg.name)"
            $failedRGs += "$($rg.subscription)/$($rg.name)"
            continue
          }
          Write-Host "✅ Updated plan created after imports`n"
        }
        
        # Verify plan file exists before applying
        if (-not (Test-Path $planFile)) {
          Write-Error "❌ Plan file not found: $planFile"
          $failedRGs += "$($rg.subscription)/$($rg.name)"
          continue
        }
        
        Write-Host "✅ Plan file verified: $planFile"
        
        # Apply
        Write-Host "🚀 Running terraform apply..."
        terraform apply -auto-approve "$planFile"
        
        if ($LASTEXITCODE -ne 0) {
          Write-Error "❌ Terraform apply failed for $($rg.name)"
          $failedRGs += "$($rg.subscription)/$($rg.name)"
          Remove-Item "$planFile" -ErrorAction SilentlyContinue
          continue
        }
        
        # Show outputs
        Write-Host "`n📊 Configuration Results:"
        $terraformOutput = terraform output -json | ConvertFrom-Json
        Write-Host "  DB VMs: $($terraformOutput.db_vms_configured.value.count)"
        Write-Host "  App VMs: $($terraformOutput.app_vms_configured.value.count)"
        Write-Host "  Total VMs: $($terraformOutput.total_vms_configured.value)"
        
        # Verify state file was created/updated after apply
        Write-Host "`n💾 State File Verification:"
        if (Test-Path $stateFile) {
          $fileInfo = Get-Item $stateFile
          Write-Host "✅ State file successfully saved to agent server"
          Write-Host "  📁 Location: $stateFile"
          Write-Host "  📊 Size: $([math]::Round($fileInfo.Length / 1KB, 2)) KB"
          Write-Host "  🕐 Last Modified: $($fileInfo.LastWriteTime)"
          Write-Host "  🔒 Attributes: $($fileInfo.Attributes)"
          
          # Verify file is not empty and contains valid Terraform state
          if ($fileInfo.Length -gt 100) {
            Write-Host "  ✅ State file appears to contain valid data"
          } else {
            Write-Warning "  ⚠️ State file is very small - may be empty or incomplete"
          }
        } else {
          Write-Error "  ❌ State file not found after apply: $stateFile"
          Write-Host "  This indicates the state was not properly saved to the agent server"
        }
        
        $successCount++
        $processedRGs += @{
          subscription = $rg.subscription
          name = $rg.name
          status = "Success"
          db_vms = if ($hasDbVms) { $rg.db_vms } else { "None" }
          app_vms = if ($hasAppVms) { $rg.app_vms } else { "None" }
          state_file = $stateFile
        }
        
        Write-Host "`n✅ Successfully configured $($rg.name) in $($rg.subscription)"
        
        # Clean up plan file
        Remove-Item "$planFile" -ErrorAction SilentlyContinue
      }

      # Display Summary
      Write-Host "`n========================================="
      Write-Host "📊 EXECUTION SUMMARY"
      Write-Host "=========================================`n"
      Write-Host "Total Resource Groups: $($config.Count)"
      Write-Host "✅ Successfully Configured: $successCount"
      Write-Host "❌ Failed: $($failedRGs.Count)"
      Write-Host ""
      
      if ($processedRGs.Count -gt 0) {
        Write-Host "Successfully Configured Resource Groups:"
        $groupedSuccess = $processedRGs | Group-Object -Property subscription
        foreach ($group in $groupedSuccess) {
          Write-Host "`n  📦 $($group.Name):"
          foreach ($rg in $group.Group) {
            Write-Host "    ✅ $($rg.name)"
            Write-Host "       - DB VMs: $($rg.db_vms)"
            Write-Host "       - App VMs: $($rg.app_vms)"
            Write-Host "       - State File: $($rg.state_file)"
            
            # Verify each state file still exists
            if (Test-Path $rg.state_file) {
              $stateFileInfo = Get-Item $rg.state_file
              Write-Host "       - State Size: $([math]::Round($stateFileInfo.Length / 1KB, 2)) KB"
              Write-Host "       - State Status: ✅ Saved to Agent Server"
            } else {
              Write-Host "       - State Status: ❌ File Missing"
            }
          }
        }
        Write-Host ""
      }
      
      if ($failedRGs.Count -gt 0) {
        Write-Host "Failed Resource Groups:"
        foreach ($rgName in $failedRGs) {
          Write-Host "  ❌ $rgName"
        }
        Write-Host ""
        Write-Warning "⚠️ Some resource groups failed to configure. Please review the logs above."
        exit 1
      }
      
      Write-Host "`n� Terraform State Files Management:"
      Write-Host "📁 Agent Server Path: $stateBaseDir"
      Write-Host "📊 Total State Files Created: $successCount"
      Write-Host "📝 File Naming Pattern: <Subscription>-<ResourceGroup>.tfstate"
      Write-Host ""
      
      # List all state files in the directory
      if (Test-Path $stateBaseDir) {
        $stateFiles = Get-ChildItem -Path $stateBaseDir -Filter "*.tfstate" | Sort-Object Name
        Write-Host "📋 State Files on Agent Server:"
        foreach ($file in $stateFiles) {
          $ageInHours = [math]::Round((((Get-Date) - $file.LastWriteTime).TotalHours), 1)
          Write-Host "  📄 $($file.Name) ($([math]::Round($file.Length / 1KB, 1)) KB, $ageInHours hours old)"
        }
        Write-Host ""
      }
      
      Write-Host "✅ All resource groups configured successfully!"
      Write-Host "✅ All Terraform state files saved to agent server: $stateBaseDir"
      Write-Host "`n=========================================`n"
    
    displayName: 'Configure Auto-Shutdown from CSV'
    workingDirectory: $(System.DefaultWorkingDirectory)
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      BAB_DEV_SUBSCRIPTION_ID: $(BAB_DEV_SUBSCRIPTION_ID)
      BAB_SIT_SUBSCRIPTION_ID: $(BAB_SIT_SUBSCRIPTION_ID)
      BAB_CORE_SUBSCRIPTION_ID: $(BAB_CORE_SUBSCRIPTION_ID)