trigger: none

pool:
  name: cloudops-agent

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'
  - name: resource_group_name
    displayName: 'Resource Group Name'
    type: string
    default: '<your-default-resource-group>'
  - name: shutdown_time
    displayName: 'Shutdown Time (HHmm)'
    type: string
    default: '2000'
  - name: time_zone
    displayName: 'Time Zone'
    type: string
    default: 'Arab Standard Time'

variables:
- group: TerraformVariables   # Contains: ARM_CLIENT_ID, ARM_CLIENT_SECRET, ARM_TENANT_ID
- group: cloud-subs           # Contains: BAB_DEV_SUBSCRIPTION_ID, BAB_SIT_SUBSCRIPTION_ID, BAB_CORE_SUBSCRIPTION_ID

steps:
# --- Select subscription ID based on input parameter ---
- ${{ if eq(parameters.subscriptionName, 'BAB_DEV') }}:
  - script: echo "##vso[task.setvariable variable=subscription_id]$(BAB_DEV_SUBSCRIPTION_ID)"
    displayName: 'Set Subscription ID for BAB_DEV'

- ${{ if eq(parameters.subscriptionName, 'BAB_SIT') }}:
  - script: echo "##vso[task.setvariable variable=subscription_id]$(BAB_SIT_SUBSCRIPTION_ID)"
    displayName: 'Set Subscription ID for BAB_SIT'

- ${{ if eq(parameters.subscriptionName, 'BAB_CORE') }}:
  - script: echo "##vso[task.setvariable variable=subscription_id]$(BAB_CORE_SUBSCRIPTION_ID)"
    displayName: 'Set Subscription ID for BAB_CORE'

# --- Install Terraform ---
- task: TerraformInstaller@0
  displayName: 'Install Terraform'
  inputs:
    terraformVersion: 'latest'

# --- Terraform Commands with Global Environment ---
- job: Terraform_AutoShutdown
  displayName: "Terraform - Enable Auto Shutdown"
  pool:
    name: cloudops-agent

  # env:
  #   ARM_CLIENT_ID: $(ARM_CLIENT_ID)
  #   ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
  #   ARM_TENANT_ID: $(ARM_TENANT_ID)
  #   ARM_SUBSCRIPTION_ID: $(subscription_id)

  steps:
    - script: terraform init -input=false
      displayName: 'Terraform Init'
      workingDirectory: Pipelines/autoshutdown

    - script: terraform validate
      displayName: 'Terraform Validate'
      workingDirectory: Pipelines/autoshutdown

    - script: |
        terraform plan -out=tfplan \
          -var="subscription_id=$(subscription_id)" \
          -var="resource_group_name=${{ parameters.resource_group_name }}" \
          -var="shutdown_time=${{ parameters.shutdown_time }}" \
          -var="time_zone=${{ parameters.time_zone }}"
      displayName: 'Terraform Plan'
      workingDirectory: Pipelines/autoshutdown

    - script: terraform apply -auto-approve tfplan
      displayName: 'Terraform Apply'
      workingDirectory: Pipelines/autoshutdown
