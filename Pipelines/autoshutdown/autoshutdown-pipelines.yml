trigger: none

pool:
  name: cloudops-agent

parameters:
  - name: subscriptionName
    displayName: 'Source Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'

  - name: resource_group_name
    displayName: 'Resource Group Name'
    type: string
    default: '<your-default-resource-group>'

  - name: shutdown_time
    displayName: 'Shutdown Time (HHmm)'
    type: string
    default: '2000'

  - name: time_zone
    displayName: 'Time Zone'
    type: string
    default: 'Arab Standard Time'

variables:
- group: TerraformVariables
- group: cloud-subs

jobs:
- job: TerraformAutoShutdown
  displayName: "Terraform Apply Azure VM Auto-Shutdown"
  pool:
    name: cloudops-agent

  steps:
  # =============================
  # 🔹 Select Subscription (strip quotes)
  # =============================
  - ${{ if eq(parameters.subscriptionName, 'BAB_DEV') }}:
    - script: |
        set "subscription_id=$(BAB_DEV_SUBSCRIPTION_ID)"
        set "subscription_id=%subscription_id:"=%"
        echo "##vso[task.setvariable variable=subscription_id]%subscription_id%"
      displayName: 'Set Subscription ID for BAB_DEV (clean)'

  - ${{ if eq(parameters.subscriptionName, 'BAB_SIT') }}:
    - script: |
        set "subscription_id=$(BAB_SIT_SUBSCRIPTION_ID)"
        set "subscription_id=%subscription_id:"=%"
        echo "##vso[task.setvariable variable=subscription_id]%subscription_id%"
      displayName: 'Set Subscription ID for BAB_SIT (clean)'

  - ${{ if eq(parameters.subscriptionName, 'BAB_CORE') }}:
    - script: |
        set "subscription_id=$(BAB_CORE_SUBSCRIPTION_ID)"
        set "subscription_id=%subscription_id:"=%"
        echo "##vso[task.setvariable variable=subscription_id]%subscription_id%"
      displayName: 'Set Subscription ID for BAB_CORE (clean)'

  # =============================
  # 🔹 Debug Subscription ID
  # =============================
  - script: |
      echo Selected Subscription ID: $(subscription_id)
    displayName: 'Debug Subscription ID'

  # =============================
  # 🔹 Terraform Install
  # =============================
  - task: TerraformInstaller@0
    inputs:
      terraformVersion: 'latest'

  # =============================
  # 🔹 Terraform Init
  # =============================
  - script: terraform init
    displayName: 'Terraform Init'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)

  # =============================
  # 🔹 Terraform Validate
  # =============================
  - script: terraform validate
    displayName: 'Terraform Validate'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)

  # =============================
  # 🔹 Terraform Plan
  # =============================
  - script: terraform plan -out=tfplan -var="subscription_id=$(subscription_id)" -var="tenant_id=$(ARM_TENANT_ID)" -var="client_id=$(ARM_CLIENT_ID)" -var="client_secret=$(ARM_CLIENT_SECRET)" -var="resource_group_name=${{ parameters.resource_group_name }}" -var="shutdown_time=${{ parameters.shutdown_time }}" -var="time_zone=${{ parameters.time_zone }}"
    displayName: 'Terraform Plan'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)

  # =============================
  # 🔹 Terraform Apply
  # =============================
  - script: terraform apply -auto-approve tfplan
    displayName: 'Terraform Apply'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)
