trigger: none

pool:
  name: cloudops-agent

parameters:
  - name: subscriptionName
    displayName: 'Subscription (BAB_DEV, BAB_SIT, BAB_CORE)'
    type: string
    default: 'BAB_DEV'

  - name: resource_group_name
    displayName: 'Resource Group Name'
    type: string
    default: '<Enter-resource-group>'

  - name: db_vm_names
    displayName: 'DB VM Names (comma-separated, leave empty if none)'
    type: string
    default: ''

  - name: db_shutdown_time
    displayName: 'DB VMs Shutdown Time (HHmm)'
    type: string
    default: '2200'

  - name: app_vm_names
    displayName: 'App VM Names (comma-separated, leave empty if none)'
    type: string
    default: ''

  - name: app_shutdown_time
    displayName: 'App VMs Shutdown Time (HHmm)'
    type: string
    default: '2000'

  - name: time_zone
    displayName: 'Time Zone'
    type: string
    default: 'Arab Standard Time'

variables:
- group: TerraformVariables
- group: cloud-subs

jobs:
- job: TerraformAutoShutdown
  displayName: "Azure VM Auto-Shutdown"
  pool:
    name: cloudops-agent

  steps:
  # =============================
  # 🔹 Select Subscription
  # =============================
  - ${{ if eq(parameters.subscriptionName, 'BAB_DEV') }}:
    - script: |
        REM Assign and clean subscription ID in CMD
        set "tmp=%BAB_DEV_SUBSCRIPTION_ID%"
        set tmp=%tmp:"=%
        echo ##vso[task.setvariable variable=subscription_id]%tmp%
      displayName: 'Set Subscription ID for BAB_DEV'

  - ${{ if eq(parameters.subscriptionName, 'BAB_SIT') }}:
    - script: |
        set "tmp=%BAB_SIT_SUBSCRIPTION_ID%"
        set tmp=%tmp:"=%
        echo ##vso[task.setvariable variable=subscription_id]%tmp%
      displayName: 'Set Subscription ID for BAB_SIT'

  - ${{ if eq(parameters.subscriptionName, 'BAB_CORE') }}:
    - script: |
        set "tmp=%BAB_CORE_SUBSCRIPTION_ID%"
        set tmp=%tmp:"=%
        echo ##vso[task.setvariable variable=subscription_id]%tmp%
      displayName: 'Set Subscription ID for BAB_CORE'

  # =============================
  # 🔹 Validate Input
  # =============================
  - script: |
      echo Validating configuration...
      if "${{ parameters.db_vm_names }}"=="" if "${{ parameters.app_vm_names }}"=="" (
        echo ERROR: At least one VM name must be provided for DB or App VMs!
        exit /b 1
      )
      echo DB VMs: ${{ parameters.db_vm_names }}
      echo App VMs: ${{ parameters.app_vm_names }}
      echo Validation passed!
    displayName: 'Validate VM Configuration'

  # =============================
  # 🔹 Terraform Install
  # =============================
  - task: TerraformInstaller@0
    inputs:
      terraformVersion: 'latest'

  # =============================
  # 🔹 Terraform Init
  # =============================
  - script: terraform init
    displayName: 'Terraform Init'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)

  # =============================
  # 🔹 Terraform Validate
  # =============================
  - script: terraform validate
    displayName: 'Terraform Validate'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)

  # =============================
  # 🔹 Terraform Plan
  # =============================
  - script: terraform plan -out=tfplan -var="subscription_id=$(subscription_id)" -var="tenant_id=$(ARM_TENANT_ID)" -var="client_id=$(ARM_CLIENT_ID)" -var="client_secret=$(ARM_CLIENT_SECRET)" -var="resource_group_name=${{ parameters.resource_group_name }}" -var="db_vm_names=${{ parameters.db_vm_names }}" -var="db_shutdown_time=${{ parameters.db_shutdown_time }}" -var="app_vm_names=${{ parameters.app_vm_names }}" -var="app_shutdown_time=${{ parameters.app_shutdown_time }}" -var="time_zone=${{ parameters.time_zone }}"
    displayName: 'Terraform Plan'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)

  # =============================
  # 🔹 Terraform Apply
  # =============================
  - script: terraform apply -auto-approve tfplan
    displayName: 'Terraform Apply'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)

  # =============================
  # 🔹 Display Results
  # =============================
  - script: terraform output -json
    displayName: 'Show Configured VMs'
    workingDirectory: Pipelines/autoshutdown
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      ARM_SUBSCRIPTION_ID: $(subscription_id)