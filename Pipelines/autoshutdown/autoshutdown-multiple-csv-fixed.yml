trigger: none

pool:
  name: cloudops-agent

parameters:
  - name: time_zone
    displayName: 'Time Zone (applies to all VMs)'
    type: string
    default: 'Arab Standard Time'

variables:
- group: TerraformVariables
- group: cloud-subs

jobs:
- job: ConfigureMultipleResourceGroups
  displayName: "Configure Auto-Shutdown for Multiple Resource Groups (CSV)"
  pool:
    name: cloudops-agent

  steps:
  # =============================
  # 🔹 Terraform Install
  # =============================
  - task: TerraformInstaller@1
    inputs:
      terraformVersion: 'latest'
    displayName: 'Install Terraform'

  # =============================
  # 🔹 Setup Terraform State Directory
  # =============================
  - powershell: |
      $stateBaseDir = "C:\TerraformState\autoshutdown"
      
      Write-Host "Setting up Terraform state directory..."
      Write-Host "Base Directory: $stateBaseDir`n"
      
      # Create base directory if it doesn't exist
      if (-not (Test-Path $stateBaseDir)) {
        Write-Host "Creating state directory: $stateBaseDir"
        New-Item -ItemType Directory -Path $stateBaseDir -Force | Out-Null
        Write-Host "✅ Directory created successfully"
      } else {
        Write-Host "✅ State directory already exists"
      }
      
      Write-Host "`nState files will be stored at: $stateBaseDir"
      Write-Host "Naming format: <Subscription>-<ResourceGroup>.tfstate"
      Write-Host "Each resource group will have its own isolated state file.`n"
      Write-Host "========================================="
    displayName: 'Setup Terraform State Directory'

  # =============================
  # 🔹 Setup Helper Functions
  # =============================
  - task: PowerShell@2
    displayName: 'Setup Helper Functions'
    inputs:
      targetType: 'filePath'
      filePath: '$(System.DefaultWorkingDirectory)/Pipelines/autoshutdown/create-functions.ps1'
      arguments: '-OutputPath "$(Agent.TempDirectory)/functions.ps1"'
    env:
      BAB_DEV_SUBSCRIPTION_ID: $(BAB_DEV_SUBSCRIPTION_ID)
      BAB_SIT_SUBSCRIPTION_ID: $(BAB_SIT_SUBSCRIPTION_ID)
      BAB_CORE_SUBSCRIPTION_ID: $(BAB_CORE_SUBSCRIPTION_ID)

  # =============================
  # 🔹 Read and Validate CSV
  # =============================
  - powershell: |
      # Load functions
      . "$(Agent.TempDirectory)/functions.ps1"
      
      Write-Host "========================================="
      Write-Host "Azure VM Auto-Shutdown Configuration"
      Write-Host "Multiple Resource Groups (CSV) Mode"
      Write-Host "=========================================`n"

      # Debug: Show available subscription environment variables
      Write-Host "🔍 Available Subscription Environment Variables:"
      Write-Host "  BAB_DEV_SUBSCRIPTION_ID: $(if ($env:BAB_DEV_SUBSCRIPTION_ID) { 'Set' } else { 'NOT SET' })"
      Write-Host "  BAB_SIT_SUBSCRIPTION_ID: $(if ($env:BAB_SIT_SUBSCRIPTION_ID) { 'Set' } else { 'NOT SET' })"
      Write-Host "  BAB_CORE_SUBSCRIPTION_ID: $(if ($env:BAB_CORE_SUBSCRIPTION_ID) { 'Set' } else { 'NOT SET' })"
      Write-Host ""

      # Read CSV file
      $csvPath = "$(System.DefaultWorkingDirectory)/Pipelines/autoshutdown/multiple_csv.csv"
      
      Write-Host "📂 Reading CSV file from: $csvPath`n"
      
      if (-not (Test-Path $csvPath)) {
        Write-Error "❌ CSV file not found at $csvPath"
        Write-Host "`nPlease ensure the file exists with the following format:"
        Write-Host "Subscription,ResourceGroupName,DBVMs,DBShutdownTime,AppVMs,AppShutdownTime"
        Write-Host "BAB_DEV,rg-dev-app,sql-dev-01,2200,web-dev-01,2000"
        Write-Host "BAB_SIT,rg-sit-app,db-vm-02,2200,,2000"
        Write-Host ""
        Write-Host "💡 Multiple rows with same Subscription+ResourceGroup will be grouped together"
        Write-Host "💡 Each row can specify either DB VMs, App VMs, or both"
        Write-Host "💡 VMs can be comma-separated: VM1,VM2,VM3"
        exit 1
      }

      try {
        # Read CSV with better error handling
        $csvContent = Get-Content $csvPath -ErrorAction Stop
        if ($csvContent.Count -eq 0) {
          Write-Error "❌ CSV file is empty!"
          exit 1
        }
        
        Write-Host "📄 CSV file contains $($csvContent.Count) lines (including header)"
        
        try {
          $rows = $csvContent | ConvertFrom-Csv -ErrorAction Stop
        }
        catch {
          Write-Error "❌ Failed to parse CSV content: $_"
          Write-Host "Please check CSV format. Expected format:"
          Write-Host "Subscription,ResourceGroupName,DBVMs,DBShutdownTime,AppVMs,AppShutdownTime"
          exit 1
        }
        
        if ($rows.Count -eq 0) {
          Write-Error "❌ No data rows found in CSV (only header)!"
          exit 1
        }
        
        # Validate CSV columns
        $requiredColumns = @('Subscription', 'ResourceGroupName', 'DBVMs', 'DBShutdownTime', 'AppVMs', 'AppShutdownTime')
        $criticalColumns = @('Subscription', 'ResourceGroupName')
        $firstRow = $rows[0]
        $actualColumns = $firstRow.PSObject.Properties.Name
        
        Write-Host "📋 CSV Columns Found: $($actualColumns -join ', ')"
        
        # Check for critical columns
        $missingCriticalColumns = $criticalColumns | Where-Object { $_ -notin $actualColumns }
        if ($missingCriticalColumns.Count -gt 0) {
          Write-Error "❌ Missing critical CSV columns: $($missingCriticalColumns -join ', ')"
          Write-Host "Critical columns are required for processing."
          exit 1
        }
        
        # Check for optional columns
        $missingOptionalColumns = $requiredColumns | Where-Object { $_ -notin $actualColumns -and $_ -notin $criticalColumns }
        if ($missingOptionalColumns.Count -gt 0) {
          Write-Host "ℹ️ Missing optional CSV columns: $($missingOptionalColumns -join ', ')"
          Write-Host "ℹ️ Will use default values for missing columns"
        } else {
          Write-Host "✅ All expected columns are present"
        }
        
        Write-Host "Found $($rows.Count) resource group(s) in CSV`n"
        
        # Show all CSV rows for debugging
        Write-Host "📋 CSV Content Preview:"
        for ($i = 0; $i -lt $rows.Count; $i++) {
          $row = $rows[$i]
          Write-Host "  Row $($i + 1): Subscription='$($row.Subscription)', RG='$($row.ResourceGroupName)', DBVMs='$($row.DBVMs)', AppVMs='$($row.AppVMs)'"
        }
        Write-Host ""
        Write-Host "ℹ️ Processing: VMs will be grouped by Subscription + Resource Group"
        Write-Host "ℹ️ Multiple rows with same RG will be combined into single Terraform run"
        Write-Host ""
        
        # Save CSV data for next step
        $rows | ConvertTo-Json -Depth 10 | Out-File -FilePath "$(Agent.TempDirectory)/csv_data.json" -Encoding UTF8
        Write-Host "✅ CSV data saved for processing"
        
      }
      catch {
        Write-Error "❌ Failed to parse CSV file: $_"
        Write-Host "`nExpected CSV format:"
        Write-Host "Subscription,ResourceGroupName,DBVMs,DBShutdownTime,AppVMs,AppShutdownTime"
        Write-Host "BAB_DEV,rg-dev-app,sql-dev-01,2200,web-dev-01,2000"
        Write-Host "BAB_SIT,rg-sit-app,db-vm-02,2200,,2000"
        Write-Host ""
        Write-Host "💡 Rows with same Subscription+ResourceGroup are grouped together"
        exit 1
      }
    displayName: 'Read and Validate CSV'
    workingDirectory: $(System.DefaultWorkingDirectory)
    env:
      BAB_DEV_SUBSCRIPTION_ID: $(BAB_DEV_SUBSCRIPTION_ID)
      BAB_SIT_SUBSCRIPTION_ID: $(BAB_SIT_SUBSCRIPTION_ID)
      BAB_CORE_SUBSCRIPTION_ID: $(BAB_CORE_SUBSCRIPTION_ID)

  # =============================
  # 🔹 Process CSV Data
  # =============================
  - powershell: |
      # Load functions and data
      . "$(Agent.TempDirectory)/functions.ps1"
      $rows = Get-Content "$(Agent.TempDirectory)/csv_data.json" | ConvertFrom-Json
      
      Write-Host "🔄 Processing CSV data into resource group configurations..."

      # Group and process VMs by subscription and resource group
      $resourceGroups = @{}
      $skippedRows = @()
      
      foreach ($row in $rows) {
        Write-Host "Processing CSV row: Subscription='$($row.Subscription)', ResourceGroup='$($row.ResourceGroupName)'"
        
        # Validate critical required fields only
        if ([string]::IsNullOrWhiteSpace($row.Subscription)) {
          Write-Warning "⚠️ Skipping row - Subscription is empty (this is required)"
          $skippedRows += "Row with empty Subscription"
          continue
        }
        
        if ([string]::IsNullOrWhiteSpace($row.ResourceGroupName)) {
          Write-Warning "⚠️ Skipping row - ResourceGroupName is empty (this is required)"
          $skippedRows += "Row with empty ResourceGroupName"
          continue
        }
        
        # Get subscription ID
        Write-Host "  🔍 Looking up subscription: '$($row.Subscription)'"
        $subscriptionId = Get-SubscriptionId -SubscriptionName $row.Subscription.Trim()
        if ($null -eq $subscriptionId) {
          Write-Warning "⚠️ Skipping $($row.ResourceGroupName) - Invalid subscription: '$($row.Subscription)'"
          $skippedRows += "$($row.Subscription)/$($row.ResourceGroupName) - Invalid subscription"
          continue
        }
        Write-Host "  ✅ Subscription ID resolved: $subscriptionId"
        
        # Create unique key for grouping
        $rgKey = "$($row.Subscription.Trim())|$($row.ResourceGroupName.Trim())"
        
        # Initialize resource group entry if not exists
        if (-not $resourceGroups.ContainsKey($rgKey)) {
          $resourceGroups[$rgKey] = @{
            subscription = $row.Subscription.Trim()
            subscription_id = $subscriptionId
            name = $row.ResourceGroupName.Trim()
            db_vms = @()
            app_vms = @()
            db_shutdown_times = @()
            app_shutdown_times = @()
          }
        }
        
        # Process DB VMs
        $dbVMsRaw = if ($row.PSObject.Properties.Name -contains 'DBVMs') { 
          if ($null -eq $row.DBVMs) { "" } else { $row.DBVMs.ToString().Trim() }
        } else { "" }
        
        $appVMsRaw = if ($row.PSObject.Properties.Name -contains 'AppVMs') { 
          if ($null -eq $row.AppVMs) { "" } else { $row.AppVMs.ToString().Trim() }
        } else { "" }
        
        # Process shutdown times
        $dbShutdownTime = if ($row.PSObject.Properties.Name -contains 'DBShutdownTime') { 
          if ($null -eq $row.DBShutdownTime) { "" } else { $row.DBShutdownTime.ToString().Trim() }
        } else { "" }
        
        $appShutdownTime = if ($row.PSObject.Properties.Name -contains 'AppShutdownTime') { 
          if ($null -eq $row.AppShutdownTime) { "" } else { $row.AppShutdownTime.ToString().Trim() }
        } else { "" }
        
        # Add VMs to the resource group
        if (-not [string]::IsNullOrWhiteSpace($dbVMsRaw)) {
          $dbVmList = Format-VMNames -vmNamesString $dbVMsRaw
          if (-not [string]::IsNullOrWhiteSpace($dbVmList)) {
            $resourceGroups[$rgKey].db_vms += $dbVmList -split ','
            $resourceGroups[$rgKey].db_shutdown_times += if ([string]::IsNullOrWhiteSpace($dbShutdownTime)) { "2200" } else { $dbShutdownTime }
          }
        }
        
        if (-not [string]::IsNullOrWhiteSpace($appVMsRaw)) {
          $appVmList = Format-VMNames -vmNamesString $appVMsRaw
          if (-not [string]::IsNullOrWhiteSpace($appVmList)) {
            $resourceGroups[$rgKey].app_vms += $appVmList -split ','
            $resourceGroups[$rgKey].app_shutdown_times += if ([string]::IsNullOrWhiteSpace($appShutdownTime)) { "2000" } else { $appShutdownTime }
          }
        }
        
        Write-Host "  ✅ Added to resource group: $rgKey"
      }
      
      # Convert to final configuration array
      $config = @()
      foreach ($rgKey in $resourceGroups.Keys) {
        $rg = $resourceGroups[$rgKey]
        
        # Get most common shutdown times (or use defaults)
        $dbShutdownTime = if ($rg.db_shutdown_times.Count -gt 0) { 
          ($rg.db_shutdown_times | Group-Object | Sort-Object Count -Descending | Select-Object -First 1).Name 
        } else { "2200" }
        
        $appShutdownTime = if ($rg.app_shutdown_times.Count -gt 0) { 
          ($rg.app_shutdown_times | Group-Object | Sort-Object Count -Descending | Select-Object -First 1).Name 
        } else { "2000" }
        
        # Remove duplicates and join VMs
        $uniqueDbVms = ($rg.db_vms | Sort-Object | Get-Unique) -join ','
        $uniqueAppVms = ($rg.app_vms | Sort-Object | Get-Unique) -join ','
        
        $config += @{
          subscription = $rg.subscription
          subscription_id = $rg.subscription_id
          name = $rg.name
          db_vms = $uniqueDbVms
          db_shutdown = $dbShutdownTime
          app_vms = $uniqueAppVms
          app_shutdown = $appShutdownTime
        }
        
        Write-Host "📦 Consolidated Resource Group: $($rg.subscription)/$($rg.name)"
        if ($uniqueDbVms) {
          Write-Host "  🗄️ DB VMs ($($rg.db_vms.Count)): $uniqueDbVms (Shutdown: $dbShutdownTime)"
        }
        if ($uniqueAppVms) {
          Write-Host "  📱 App VMs ($($rg.app_vms.Count)): $uniqueAppVms (Shutdown: $appShutdownTime)"
        }
        if (-not $uniqueDbVms -and -not $uniqueAppVms) {
          Write-Host "  ℹ️ No VMs specified, but resource group will be processed"
        }
      }
      
      if ($config.Count -eq 0) {
        Write-Warning "⚠️ No resource groups were processed from CSV!"
        Write-Host "This could be due to:"
        Write-Host "  - All rows having invalid subscription names"
        Write-Host "  - All rows missing required Subscription or ResourceGroupName values"
        Write-Host "  - CSV file format issues"
        if ($skippedRows.Count -gt 0) {
          Write-Host "`nSkipped rows:"
          foreach ($skipped in $skippedRows) {
            Write-Host "  ❌ $skipped"
          }
        }
        Write-Host "ℹ️ The pipeline will continue but no resources will be configured."
        exit 1
      }
      
      Write-Host "`n✅ Processed $($config.Count) unique resource group(s) from $($rows.Count) CSV rows"
      if ($skippedRows.Count -gt 0) {
        Write-Host "⚠️ Skipped $($skippedRows.Count) row(s) due to issues"
      }
      
      # Group by subscription for summary
      $groupedBySubscription = $config | Group-Object -Property subscription
      foreach ($group in $groupedBySubscription) {
        Write-Host "  📦 $($group.Name): $($group.Count) resource group(s)"
      }
      Write-Host ""
      
      # Save config for next step
      $config | ConvertTo-Json -Depth 10 | Out-File -FilePath "$(Agent.TempDirectory)/config.json" -Encoding UTF8
      Write-Host "✅ Configuration saved for Terraform processing"
    displayName: 'Process CSV Data'
    workingDirectory: $(System.DefaultWorkingDirectory)
    env:
      BAB_DEV_SUBSCRIPTION_ID: $(BAB_DEV_SUBSCRIPTION_ID)
      BAB_SIT_SUBSCRIPTION_ID: $(BAB_SIT_SUBSCRIPTION_ID)
      BAB_CORE_SUBSCRIPTION_ID: $(BAB_CORE_SUBSCRIPTION_ID)

  # =============================
  # 🔹 Setup Azure CLI and State
  # =============================
  - powershell: |
      Write-Host "🔧 Setting up environment for Terraform processing..."
      
      # Setup state directory
      $stateBaseDir = "C:\TerraformState\autoshutdown"
      
      # Ensure state directory exists and is accessible
      Write-Host "`n🔧 Validating Terraform State Directory..."
      if (-not (Test-Path $stateBaseDir)) {
        Write-Host "Creating state directory: $stateBaseDir"
        try {
          New-Item -ItemType Directory -Path $stateBaseDir -Force | Out-Null
          Write-Host "✅ State directory created successfully"
        }
        catch {
          Write-Error "❌ Failed to create state directory: $_"
          exit 1
        }
      } else {
        Write-Host "✅ State directory exists: $stateBaseDir"
      }
      
      # Test write permissions
      $testFile = "$stateBaseDir\write-test-$(Get-Date -Format 'yyyyMMdd-HHmmss').tmp"
      try {
        "test" | Out-File -FilePath $testFile -Force
        Remove-Item $testFile -Force
        Write-Host "✅ Write permissions confirmed for state directory"
      }
      catch {
        Write-Error "❌ No write permissions to state directory: $_"
        exit 1
      }
      
      Write-Host "📁 State files will be saved to: $stateBaseDir"
      Write-Host "📝 Naming format: <Subscription>-<ResourceGroup>.tfstate`n"
      
      # Setup Azure CLI authentication for import operations
      Write-Host "🔐 Setting up Azure CLI authentication for imports..."
      try {
        # Login using service principal
        az login --service-principal `
          --username $env:ARM_CLIENT_ID `
          --password $env:ARM_CLIENT_SECRET `
          --tenant $env:ARM_TENANT_ID `
          --output none
        
        if ($LASTEXITCODE -eq 0) {
          Write-Host "✅ Azure CLI authentication successful"
        } else {
          Write-Warning "⚠️ Azure CLI authentication failed - imports may not work"
        }
      }
      catch {
        Write-Warning "⚠️ Azure CLI setup failed: $_ - imports may not work"
      }
      Write-Host ""
    displayName: 'Setup Azure CLI and State Directory'
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)

  # =============================
  # 🔹 Process Resource Groups
  # =============================
  - task: PowerShell@2
    displayName: 'Configure Auto-Shutdown for Resource Groups'
    inputs:
      filePath: '$(System.DefaultWorkingDirectory)/Pipelines/autoshutdown/process-resource-groups.ps1'
      arguments: '-ConfigPath "$(Agent.TempDirectory)/config.json" -FunctionsPath "$(Agent.TempDirectory)/functions.ps1" -TimeZone "${{ parameters.time_zone }}"'
      workingDirectory: '$(System.DefaultWorkingDirectory)'
    env:
      ARM_CLIENT_ID: $(ARM_CLIENT_ID)
      ARM_CLIENT_SECRET: $(ARM_CLIENT_SECRET)
      ARM_TENANT_ID: $(ARM_TENANT_ID)
      BAB_DEV_SUBSCRIPTION_ID: $(BAB_DEV_SUBSCRIPTION_ID)
      BAB_SIT_SUBSCRIPTION_ID: $(BAB_SIT_SUBSCRIPTION_ID)
      BAB_CORE_SUBSCRIPTION_ID: $(BAB_CORE_SUBSCRIPTION_ID)