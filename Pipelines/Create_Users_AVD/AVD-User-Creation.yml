trigger: none

variables:
- group: cloud-subs

parameters:
- name: csvFilePath
  displayName: 'CSV File Path'
  type: string
  default: 'Pipelines/Create_Users_AVD/users.csv'

- name: groupNames
  displayName: 'Groups (semicolon-separated)'
  type: string
  default: ''

pool:
  name: cloudops-agent

steps:
- task: PowerShell@2
  displayName: 'Validate Inputs'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $csvPath = "$(Build.SourcesDirectory)/${{ parameters.csvFilePath }}"
      $groups = "${{ parameters.groupNames }}"
      
      Write-Host "Validating CSV file..." -ForegroundColor Cyan
      if (-not (Test-Path $csvPath)) {
        Write-Error "CSV file not found: $csvPath"
        exit 1
      }
      
      $users = Import-Csv -Path $csvPath
      if ($users.Count -eq 0) {
        Write-Error "CSV file is empty"
        exit 1
      }
      
      $requiredColumns = @('DisplayName', 'UserPrincipalName', 'Password')
      $csvColumns = $users[0].PSObject.Properties.Name
      $missingColumns = $requiredColumns | Where-Object { $_ -notin $csvColumns }
      
      if ($missingColumns) {
        Write-Error "Missing required columns: $($missingColumns -join ', ')"
        exit 1
      }
      
      Write-Host "Found $($users.Count) users" -ForegroundColor Green
      
      if ([string]::IsNullOrWhiteSpace($groups)) {
        Write-Warning "No groups specified"
      } else {
        Write-Host "Groups: $groups" -ForegroundColor Green
      }

- task: PowerShell@2
  displayName: 'Create Azure AD Users'
  inputs:
    targetType: 'filePath'
    filePath: '$(Build.SourcesDirectory)/Pipelines/Create_Users_AVD/AVD-User-Creation.ps1'
    arguments: '-CsvFilePath "$(Build.SourcesDirectory)/${{ parameters.csvFilePath }}" -GroupNames "${{ parameters.groupNames }}"'
    pwsh: true
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

- task: PublishBuildArtifacts@1
  displayName: 'Publish Logs'
  condition: always()
  inputs:
    PathtoPublish: 'C:\log\user_creation_log.txt'
    ArtifactName: 'UserCreationLogs'
    publishLocation: 'Container'