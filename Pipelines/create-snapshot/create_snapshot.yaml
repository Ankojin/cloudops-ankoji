parameters:
  - name: subscriptionName
    displayName: 'Azure Subscription (type BAB_DEV or BAB_SIT)'
    type: string
    default: 'BAB_DEV'
  - name: resourceGroupName
    displayName: 'Resource Group Name'
    type: string
    default: ''
  - name: excludedVMName
    displayName: 'Excluded VM Name (optional, leave blank if not needed)'
    type: string
    default: ''

trigger: none

pool:
  name: cloudops-agent  # Change to your self-hosted agent pool name

steps:
- task: PowerShell@2
  displayName: 'Azure Login (Service Principal)'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      Write-Host "Logging into Azure..."
      $ErrorActionPreference = 'Stop'
      Import-Module Az.Accounts -Force

      $tenantId = $env:AZURE_TENANT_ID
      $applicationId = $env:AZURE_CLIENT_ID
      $clientSecret = $env:AZURE_CLIENT_SECRET

      $subscriptionMap = @{
        'BAB_DEV' = '43cc4f11-ffb1-4a0d-8420-0ba3746b4248'
        'BAB_SIT' = 'e48414cd-f96d-4414-ae9e-da7fec844f77'
      }

      $paramSubscription = "${{ parameters.subscriptionName }}"
      $subscriptionId = $subscriptionMap[$paramSubscription]

      if (-not $subscriptionId) {
        Write-Error "Invalid subscription selection. Use BAB_DEV or BAB_SIT."
        exit 1
      }

      # Modern login for Az 14.3.0
      $secureSecret = ConvertTo-SecureString $clientSecret -AsPlainText -Force
      Connect-AzAccount -ServicePrincipal `
        -Tenant $tenantId `
        -ApplicationId $applicationId `
        -Password $secureSecret `
        -Subscription $subscriptionId

      Write-Host "Azure login successful. Using subscription $subscriptionId"

- task: PowerShell@2
  displayName: 'Run create-snapshot.ps1'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $ErrorActionPreference = 'Stop'
      $resourceGroup = '${{ parameters.resourceGroupName }}'
      $excludedVM = '${{ parameters.excludedVMName }}'

      if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
        Write-Error "Resource Group Name is required."
        exit 1
      }

      $scriptPath = 'Pipelines/create-snapshot/create-snapshot.ps1'

      if ([string]::IsNullOrWhiteSpace($excludedVM) -or $excludedVM.ToLower() -eq "none") {
        & $scriptPath -ResourceGroupName $resourceGroup
      } else {
        & $scriptPath -ResourceGroupName $resourceGroup -ExcludedVMName $excludedVM
      }