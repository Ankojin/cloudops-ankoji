parameters:
  - name: subscriptionName
    displayName: 'Azure Subscription (type BAB_DEV or BAB_SIT)'
    default: 'BAB_DEV'
  - name: resourceGroupName
    displayName: 'Resource Group Name'
    default: ''
  - name: excludedVMNames
    displayName: 'Excluded VM Names (comma-separated, or "none" for no exclusion)'
    default: ''

trigger: none

pool:
  name: cloudops-agent

steps:
- task: PowerShell@2
  displayName: 'Azure CLI Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      Write-Host "Logging into Azure CLI..."
      $subscriptionMap = @{
        'BAB_DEV' = '43cc4f11-ffb1-4a0d-8420-0ba3746b4248'
        'BAB_SIT' = 'e48414cd-f96d-4414-ae9e-da7fec844f77'
      }
      $paramSubscription = "${{ parameters.subscriptionName }}"
      if (-not $subscriptionMap.ContainsKey($paramSubscription)) {
          Write-Error "Invalid subscription: $paramSubscription"
          exit 1
      }
      $subscriptionId = $subscriptionMap[$paramSubscription]
      az login --service-principal -u $env:AZURE_CLIENT_ID -p $env:AZURE_CLIENT_SECRET --tenant $env:AZURE_TENANT_ID
      az account set --subscription $subscriptionId
      Write-Host "Azure CLI login successful. Using subscription $subscriptionId"

- task: PowerShell@2
  displayName: 'Run create-snapshot.ps1 (Azure CLI)'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $resourceGroup = '${{ parameters.resourceGroupName }}'
      $excludedVMs = '${{ parameters.excludedVMNames }}'
      $scriptPath = 'Pipelines/create-snapshot/create-snapshot.ps1'

      if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
        Write-Error "Resource Group Name is required"
        exit 1
      }

      # Always pass both parameters as strings
      if ($null -eq $excludedVMs) { $excludedVMs = "" }
      Write-Host "DEBUG: Passing ExcludedVMNames='$excludedVMs' to $scriptPath"
      & $scriptPath -ResourceGroupName $resourceGroup -ExcludedVMNames $excludedVMs