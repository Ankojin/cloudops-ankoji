parameters:
  - name: subscriptionId
    displayName: 'BAB_DEV'
    type: string
    default: '43cc4f11-ffb1-4a0d-8420-0ba3746b4248'
    values:
      - value: '43cc4f11-ffb1-4a0d-8420-0ba3746b4248'
        displayName: 'BAB_DEV'
      - value: 'e48414cd-f96d-4414-ae9e-da7fec844f77'
        displayName: 'BAB_SIT'
  - name: resourceGroupName
    displayName: 'Resource Group Name'
    type: string
    default: ''
  - name: excludedVMName
    displayName: 'Excluded VM Name (optional)'
    type: string
    default: ''

trigger: none

pool:
  name: cloudops-agent  # Change to your self-hosted agent pool name

variables:
- group: AZ-Connect  # Library variable group with AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET

steps:
- task: PowerShell@2
  displayName: 'Azure Login (Service Principal)'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Logging into Azure..."
      $ErrorActionPreference = 'Stop'
      $tenantId = $env:AZURE_TENANT_ID
      $clientId = $env:AZURE_CLIENT_ID
      $clientSecret = $env:AZURE_CLIENT_SECRET
      $subscriptionId = "${{ parameters.subscriptionId }}"
      Connect-AzAccount -ServicePrincipal -Tenant $tenantId -ClientId $clientId -ClientSecret $clientSecret -Subscription $subscriptionId
      Write-Host "Azure login successful."

- task: PowerShell@2
  displayName: 'Run create-snapshot.ps1'
  inputs:
    targetType: 'inline'
    script: |
      $ErrorActionPreference = 'Stop'
      $resourceGroup = '${{ parameters.resourceGroupName }}'
      if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
        Write-Error "Resource Group Name is required."
        exit 1
      }
      $excludedVM = '${{ parameters.excludedVMName }}'
      $scriptPath = 'Pipelines/create-snapshot/create-snapshot.ps1'
      if ([string]::IsNullOrWhiteSpace($excludedVM)) {
        & $scriptPath -ResourceGroupName $resourceGroup
      } else {
        & $scriptPath -ResourceGroupName $resourceGroup -ExcludedVMName $excludedVM
      }
    pwsh: true