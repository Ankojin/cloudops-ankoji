variables:
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Azure Subscription (type BAB_DEV or BAB_SIT)'
    default: 'BAB_DEV'
  - name: resourceGroupName
    displayName: 'Resource Group Name'
    default: ''
  - name: excludedVMNames
    displayName: 'Excluded VM Names (comma-separated, or "none" for no exclusion)'
    default: ''

trigger: none

pool:
  name: cloudops-agent

steps:
- task: PowerShell@2
  displayName: 'Azure CLI Login'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\snapshot_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      # Overwrite log at the start of the pipeline
      "" | Out-File -FilePath $LogFile -Encoding utf8

      "[$(Get-Date -Format o)] Logging into Azure CLI with service principal..." | Tee-Object -FilePath $LogFile -Append
      if ('${{ parameters.subscriptionName }}' -eq 'BAB_DEV') {
        $subscriptionId = $env:BAB_DEV_SUBSCRIPTION_ID
      } elseif ('${{ parameters.subscriptionName }}' -eq 'BAB_SIT') {
        $subscriptionId = $env:BAB_SIT_SUBSCRIPTION_ID
      } else {
        "[$(Get-Date -Format o)] Invalid subscription: ${{ parameters.subscriptionName }}" | Tee-Object -FilePath $LogFile -Append
        Write-Error "Invalid subscription: ${{ parameters.subscriptionName }}"
        exit 1
      }

      az login --service-principal `
        -u $env:AZURE_CLIENT_ID `
        -p $env:AZURE_CLIENT_SECRET `
        --tenant $env:AZURE_TENANT_ID | Tee-Object -FilePath $LogFile -Append
      az account set --subscription $subscriptionId | Tee-Object -FilePath $LogFile -Append
      "[$(Get-Date -Format o)] Azure CLI login successful. Using subscription $subscriptionId" | Tee-Object -FilePath $LogFile -Append
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

- task: PowerShell@2
  displayName: 'Snapshot all VMs except excluded'
  inputs:
    targetType: 'inline'
    pwsh: true
    script: |
      $LogFile = "C:\log\snapshot_log.txt"
      if (-not (Test-Path "C:\log")) { New-Item -Path "C:\log" -ItemType Directory | Out-Null }
      "[$(Get-Date -Format o)] Starting snapshot process..." | Tee-Object -FilePath $LogFile -Append

      $ResourceGroup = '${{ parameters.resourceGroupName }}'
      $ExcludedVMs = '${{ parameters.excludedVMNames }}'
      $Date = Get-Date -Format "yyyyMMdd-HHmmss"
      $SnapshotPrefix = "snapshot"

      # Convert excluded list to array
      $Excludes = @()
      if ($ExcludedVMs -and $ExcludedVMs.ToLower() -ne "none") {
        $Excludes = $ExcludedVMs -split ',' | ForEach-Object { $_.Trim() }
      }

      $VMs = az vm list --resource-group $ResourceGroup --query "[].name" -o tsv | ForEach-Object { $_.Trim() }

      foreach ($VM in $VMs) {
        try {
          if ($Excludes -and $Excludes -contains $VM) {
            "[$(Get-Date -Format o)] Skipping excluded VM: $VM" | Tee-Object -FilePath $LogFile -Append
            continue
          }
          if ($ExcludedVMs.ToLower() -eq "none") {
            # Do not skip any VMs
          }

          "[$(Get-Date -Format o)] Processing VM: $VM" | Tee-Object -FilePath $LogFile -Append
          # Get OS disk ID
          $osDiskId = az vm show -g $ResourceGroup -n $VM --query "storageProfile.osDisk.managedDisk.id" -o tsv
          $location = az disk show --ids $osDiskId --query location -o tsv
          $osSnapshotName = "$SnapshotPrefix-$VM-os-$Date"
          az snapshot create -g $ResourceGroup -n $osSnapshotName --source $osDiskId --location $location --sku Standard_LRS | Tee-Object -FilePath $LogFile -Append

          # Get data disks
          $dataDisks = az vm show -g $ResourceGroup -n $VM --query "storageProfile.dataDisks[].managedDisk.id" -o tsv
          $lun = 0
          foreach ($dataDiskId in $dataDisks) {
            $dataSnapshotName = "$SnapshotPrefix-$VM-data$lun-$Date"
            $location = az disk show --ids $dataDiskId --query location -o tsv
            az snapshot create -g $ResourceGroup -n $dataSnapshotName --source $dataDiskId --location $location --sku Standard_LRS | Tee-Object -FilePath $LogFile -Append
            $lun++
          }
          "[$(Get-Date -Format o)] Finished VM: $VM" | Tee-Object -FilePath $LogFile -Append
        } catch {
          "[$(Get-Date -Format o)] ❌ Error processing VM $VM: ${($_)}" | Tee-Object -FilePath $LogFile -Append
        }
      }
      "[$(Get-Date -Format o)] 🎉 Snapshot process completed." | Tee-Object -FilePath $LogFile -Append