variables:
- group: cloud-subs

parameters:
  - name: subscriptionName
    displayName: 'Azure Subscription (type BAB_DEV or BAB_SIT)'
    default: 'BAB_DEV'
  - name: resourceGroupName
    displayName: 'Resource Group Name'
    default: ''
  - name: excludedVMNames
    displayName: 'Excluded VM Names (comma-separated, or "none" for no exclusion)'
    default: ''

trigger: none

pool:
  name: cloudops-agent

steps:
- bash: |
    echo "Logging into Azure CLI with service principal..."
    if [ "${{ parameters.subscriptionName }}" = "BAB_DEV" ]; then
      export SUBSCRIPTION_ID="${BAB_DEV_SUBSCRIPTION_ID}"
    elif [ "${{ parameters.subscriptionName }}" = "BAB_SIT" ]; then
      export SUBSCRIPTION_ID="${BAB_SIT_SUBSCRIPTION_ID}"
    else
      echo "Invalid subscription: ${{ parameters.subscriptionName }}"
      exit 1
    fi

    az login --service-principal \
      -u "$AZURE_CLIENT_ID" \
      -p "$AZURE_CLIENT_SECRET" \
      --tenant "$AZURE_TENANT_ID"
    az account set --subscription "$SUBSCRIPTION_ID"
    echo "Azure CLI login successful. Using subscription $SUBSCRIPTION_ID"
  displayName: 'Azure CLI Login'
  env:
    AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
    AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
    AZURE_TENANT_ID: $(AZURE_TENANT_ID)

- bash: |
    set -e
    RESOURCE_GROUP="${{ parameters.resourceGroupName }}"
    EXCLUDED_VMS="${{ parameters.excludedVMNames }}"
    DATE=$(date +%Y%m%d-%H%M%S)
    SNAPSHOT_PREFIX="snapshot"

    # Convert excluded list to array
    IFS=',' read -ra EXCLUDES <<< "$EXCLUDED_VMS"

    # List all VMs in the resource group
    for VM in $(az vm list --resource-group "$RESOURCE_GROUP" --query "[].name" -o tsv); do
      SKIP=0
      for EX in "${EXCLUDES[@]}"; do
        # Remove spaces and compare, or skip if EXCLUDED_VMS is "none"
        if [[ "$VM" == "${EX// /}" ]] || [[ "$EXCLUDED_VMS" == "none" ]]; then
          SKIP=1
          break
        fi
      done
      if [[ $SKIP -eq 1 ]]; then
        echo "Skipping excluded VM: $VM"
        continue
      fi

      echo "Processing VM: $VM"
      # Get OS disk ID
      OS_DISK_ID=$(az vm show -g "$RESOURCE_GROUP" -n "$VM" --query "storageProfile.osDisk.managedDisk.id" -o tsv)
      LOCATION=$(az disk show --ids "$OS_DISK_ID" --query location -o tsv)
      OS_SNAPSHOT_NAME="${SNAPSHOT_PREFIX}-${VM}-os-${DATE}"
      az snapshot create -g "$RESOURCE_GROUP" -n "$OS_SNAPSHOT_NAME" --source "$OS_DISK_ID" --location "$LOCATION" --sku Standard_LRS

      # Get data disks
      DATA_DISKS=$(az vm show -g "$RESOURCE_GROUP" -n "$VM" --query "storageProfile.dataDisks[].managedDisk.id" -o tsv)
      LUN=0
      for DATA_DISK_ID in $DATA_DISKS; do
        DATA_SNAPSHOT_NAME="${SNAPSHOT_PREFIX}-${VM}-data${LUN}-${DATE}"
        LOCATION=$(az disk show --ids "$DATA_DISK_ID" --query location -o tsv)
        az snapshot create -g "$RESOURCE_GROUP" -n "$DATA_SNAPSHOT_NAME" --source "$DATA_DISK_ID" --location "$LOCATION" --sku Standard_LRS
        ((LUN++))
      done
    done
    echo "🎉 Snapshot process completed."
  displayName: 'Snapshot all VMs except excluded'
- bash: |
    echo "Bash version:"
    bash --version
    which bash
    echo "Current directory: $(pwd)"
  displayName: 'Show Bash Info'