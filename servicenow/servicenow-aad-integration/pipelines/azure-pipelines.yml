trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  serviceNowApiUrl: $(ServiceNowApiUrl)
  azureAdApiUrl: $(AzureAdApiUrl)
  serviceNowApiToken: $(ServiceNowApiToken)
  azureAdApiToken: $(AzureAdApiToken)

stages:
  - stage: Integration
    displayName: 'Integration Stage'
    jobs:
      - job: RunIntegrationScripts
        displayName: 'Run Integration Scripts'
        steps:
          - script: |
              npm install
              npm run create-aad-accounts
              npm run sync-validation
            displayName: 'Install Dependencies and Run Scripts'

  - stage: Deployment
    displayName: 'Deployment Stage'
    jobs:
      - job: DeployIntegrationScripts
        displayName: 'Deploy Integration Scripts'
        steps:
          - script: |
              echo "Deploying integration scripts..."
              # Add deployment commands here
            displayName: 'Deploy Integration Scripts'