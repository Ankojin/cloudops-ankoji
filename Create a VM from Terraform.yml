# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  outputFilePath: './On-Prem-VM-Migration/VM-Migration/main-v2.tf'
steps:
  - script:  |
           echo $(Build.SourcesDirectory)
           ls $(Build.SourcesDirectory)

  - task: PythonScript@0
    inputs:
      scriptSource: 'filePath'
      scriptPath: './On-Prem-VM-Migration/VM-Migration/generate-tf-final-v2.py'
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: $(outputFilePath)
      artifactName: 'Terraform File Output'
      publishLocation: 'Container'
    displayName: 'Publish Terraform Plan Output'

