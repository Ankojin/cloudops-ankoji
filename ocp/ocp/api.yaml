# =============================================================
# ocp/api.yaml
# FastAPI backend — Deployment + Service
# =============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-api
  namespace: capacity-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capacity-api
  template:
    metadata:
      labels:
        app: capacity-api
    spec:
      containers:
      - name: api
        image: your-registry/capacity-api:latest   # <-- replace with your registry
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: capacity-secrets
              key: DATABASE_URL
        resources:
          requests: { cpu: "50m",  memory: "128Mi" }
          limits:   { cpu: "200m", memory: "256Mi" }
        readinessProbe:
          httpGet: { path: /api/v1/health, port: 8000 }
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet: { path: /api/v1/health, port: 8000 }
          initialDelaySeconds: 30
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: capacity-monitor
spec:
  selector:
    app: capacity-api
  ports:
  - port: 8000
    targetPort: 8000
