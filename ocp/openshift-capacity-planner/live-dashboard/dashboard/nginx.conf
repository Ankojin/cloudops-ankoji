server {
  listen 80;
  server_name _;

  # Container Apps embedded DNS (127.0.0.11) resolves service names to the
  # cluster-internal IP (100.100.x.x range). The Azure platform DNS 168.63.129.16
  # returns the VNet private IP which is NOT routable for Container Apps
  # internal service-to-service traffic.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # ── Serve the SPA ─────────────────────────────────────────
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── Proxy /api → FastAPI ──────────────────────────────────
  # ${API_UPSTREAM_HOST} is substituted by envsubst at container startup.
  # Set to just the hostname (no scheme):
  #   Azure Container Apps: bab-aro-ops-api-01.internal.<env-domain>
  #   Docker Compose:       api
  # IMPORTANT: proxy_pass uses https://$variable (NOT $full_url_variable) so
  # nginx does NOT strip the /api/ location prefix from the proxied path.
  # The resolver directive re-resolves the hostname dynamically every 30s.
  location /api/ {
    set $api_host         "${API_UPSTREAM_HOST}";
    proxy_pass            https://$api_host;
    proxy_ssl_verify      off;            # Azure internal TLS uses platform cert, not CA-signed
    proxy_ssl_server_name on;            # send SNI — required for Container Apps TLS terminator
    proxy_ssl_name        $api_host;     # SNI = upstream hostname
    proxy_http_version    1.1;                # uvicorn requires HTTP/1.1 (not 1.0)
    proxy_set_header      Connection "";      # clear Connection header for keepalive
    proxy_set_header      Host              $api_host;    # must send upstream hostname, not dashboard hostname
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_read_timeout    30s;
    proxy_connect_timeout 5s;

    # Allow CORS pre-flight
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  "*";
      add_header Access-Control-Allow-Methods "GET, OPTIONS";
      add_header Access-Control-Allow-Headers "Content-Type";
      return 204;
    }
  }

  # ── Health endpoint ────────────────────────────────────────
  location /healthz {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
