# =============================================================
# ocp/postgres.yaml
# PostgreSQL 15 — StatefulSet + PVC + Service
# =============================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: capacity-monitor
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-premium   # Azure managed disk on ARO
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: capacity-monitor
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: planner
        - name: POSTGRES_DB
          value: capacity
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: capacity-secrets
              key: DB_PASSWORD
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests: { cpu: "100m", memory: "256Mi" }
          limits:   { cpu: "500m", memory: "512Mi" }
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "planner", "-d", "capacity"]
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init-sql
        configMap:
          name: postgres-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: capacity-monitor
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS capacity_snapshots (
      id             SERIAL PRIMARY KEY,
      env            VARCHAR(10)   NOT NULL,
      collected_at   TIMESTAMPTZ   NOT NULL DEFAULT NOW(),
      total_cpu      NUMERIC(10,3),
      total_mem_gib  NUMERIC(10,1),
      cpu_pct        NUMERIC(5,2),
      mem_pct        NUMERIC(5,2),
      node_count     INTEGER,
      ns_count       INTEGER,
      worker_nodes   INTEGER,
      worker_cpu     NUMERIC(10,3),
      worker_mem_gib NUMERIC(10,1),
      pressure       VARCHAR(20),
      master_nodes   INTEGER,
      master_cpu     NUMERIC(10,3),
      master_mem_gib NUMERIC(10,1),
      infra_nodes    INTEGER,
      infra_cpu      NUMERIC(10,3),
      infra_mem_gib  NUMERIC(10,1),
      cpu_used       NUMERIC(10,3),
      mem_used_gib   NUMERIC(10,1),
      pods_running   INTEGER,
      ephem_pod_gib  NUMERIC(10,1),
      raw_summary    JSONB,
      raw_planning   JSONB,
      raw_util       JSONB
    );
    CREATE INDEX IF NOT EXISTS idx_snapshots_env_time
      ON capacity_snapshots (env, collected_at DESC);
    CREATE TABLE IF NOT EXISTS pool_snapshots (
      id SERIAL PRIMARY KEY, snapshot_id INTEGER REFERENCES capacity_snapshots(id) ON DELETE CASCADE,
      env VARCHAR(10), collected_at TIMESTAMPTZ, pool_name VARCHAR(200),
      taint_key VARCHAR(200), taint_value VARCHAR(200), effect VARCHAR(50),
      dedicated BOOLEAN, node_count INTEGER, cpu_cores NUMERIC(10,3),
      memory_gib NUMERIC(10,1), namespaces JSONB
    );
    CREATE TABLE IF NOT EXISTS namespace_snapshots (
      id SERIAL PRIMARY KEY, snapshot_id INTEGER REFERENCES capacity_snapshots(id) ON DELETE CASCADE,
      env VARCHAR(10), collected_at TIMESTAMPTZ, namespace VARCHAR(200),
      ns_type VARCHAR(20), pod_count INTEGER, cpu_req NUMERIC(10,3),
      mem_req_gib NUMERIC(10,1), cpu_pct NUMERIC(6,3), mem_pct NUMERIC(6,3)
    );
    CREATE OR REPLACE VIEW latest_snapshots AS
      SELECT DISTINCT ON (env) * FROM capacity_snapshots ORDER BY env, collected_at DESC;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: capacity-monitor
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  clusterIP: None   # headless — StatefulSet
