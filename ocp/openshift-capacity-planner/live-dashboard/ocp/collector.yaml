# =============================================================
# ocp/collector.yaml
# CronJob — runs the bash collector + DB insert every 5 minutes
# =============================================================
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: planner-output
  namespace: capacity-monitor
spec:
  accessModes: [ReadWriteMany]          # shared with pod restarts
  storageClassName: azurefile-csi       # Azure File Share on ARO
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: capacity-collector
  namespace: capacity-monitor
spec:
  schedule: "*/5 * * * *"              # Every 5 minutes
  concurrencyPolicy: Forbid            # Never run overlapping jobs
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 240       # Kill if takes > 4 min
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: collector
            image: your-registry/capacity-collector:latest   # <-- replace
            imagePullPolicy: Always
            command: ["/collector/cron-entrypoint.sh"]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: capacity-secrets
                  key: DATABASE_URL
            - name: DEV_API
              value: "https://api.babdevaro.albtests.com:6443"
            - name: DEV_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capacity-secrets
                  key: DEV_TOKEN
            - name: DEV_ENV_LABEL
              value: "DEV"
            - name: SIT_API
              value: "https://api.babsitaro.albtests.com:6443"
            - name: SIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: capacity-secrets
                  key: SIT_TOKEN
            - name: SIT_ENV_LABEL
              value: "SIT"
            volumeMounts:
            - name: output
              mountPath: /planner/output
            resources:
              requests: { cpu: "200m", memory: "256Mi" }
              limits:   { cpu: "1",    memory: "512Mi" }
          volumes:
          - name: output
            persistentVolumeClaim:
              claimName: planner-output
