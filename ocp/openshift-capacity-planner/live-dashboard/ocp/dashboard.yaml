# =============================================================
# ocp/dashboard.yaml
# nginx dashboard — Deployment + Service + Route
# Single URL:  https://capacity-monitor.apps.<cluster-domain>
# =============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-dashboard
  namespace: capacity-monitor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: capacity-dashboard
  template:
    metadata:
      labels:
        app: capacity-dashboard
    spec:
      containers:
      - name: dashboard
        image: your-registry/capacity-dashboard:latest   # <-- replace
        imagePullPolicy: Always
        ports:
        - containerPort: 8080   # nginx listens on 8080 (non-root, required by OCP)
        resources:
          requests: { cpu: "25m",  memory: "64Mi" }
          limits:   { cpu: "100m", memory: "128Mi" }
        readinessProbe:
          httpGet: { path: /healthz, port: 8080 }
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: capacity-dashboard
  namespace: capacity-monitor
spec:
  selector:
    app: capacity-dashboard
  ports:
  - port: 8080
    targetPort: 8080
---
# OCP Route — HTTPS edge termination
# URL: https://capacity-monitor.apps.<your-cluster-domain>
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: capacity-monitor
  namespace: capacity-monitor
spec:
  host: ""          # Leave empty — OCP auto-generates from cluster domain
  to:
    kind: Service
    name: capacity-dashboard
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
